<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blend · board</title>
<style>
:root{
  --house:oklch(16% .015 240);--aisle:oklch(20% .02 240);--row:oklch(26% .025 240);--slate:oklch(30% .02 240);
  --ink:oklch(92% .01 240);--mut:oklch(92% .01 240 / .62);--dim:oklch(92% .01 240 / .45);--line:oklch(92% .01 240 / .08);
  --blue:oklch(72% .16 230);--blueink:oklch(18% .05 230);--energy:oklch(82% .11 75);--ok:oklch(76% .17 155);--warn:oklch(83% .16 85);
  --card:oklch(19% .03 235);--z:.547;--zp:.5;
}
@media (min-width:1400px){:root{--z:1;--zp:.9}}
*{box-sizing:border-box;margin:0}
body{font:14px/1.43 ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:transparent}
.board{display:flex;flex-direction:column;gap:28px;padding:4px 0 16px}
h1{font-size:1.25rem;font-weight:600;letter-spacing:-.02em}
.lead{color:var(--mut);max-width:70ch;font-size:13px}
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px;font-size:12.5px;color:var(--mut)}
.stories b{color:var(--ink);font-weight:600;margin-right:4px}
.dir h2{font-size:1.05rem;font-weight:600;letter-spacing:-.02em;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dir h2 small{font-size:12px;font-weight:500;color:var(--blue)}
.dir p.why{color:var(--mut);font-size:12.5px;margin:4px 0 10px;max-width:72ch}
.shots{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.cap{font-size:11px;color:var(--dim);margin-top:4px}
/* frames */
.desk{width:1280px;height:800px;zoom:var(--z);position:relative;overflow:hidden;border-radius:14px;background:var(--house);outline:1px solid var(--line)}
.phone{width:390px;height:844px;zoom:var(--zp);position:relative;overflow:hidden;border-radius:34px;background:var(--house);outline:1px solid var(--line)}
@media (max-width:1399px){.phone{zoom:.55}}
/* chrome */
.rail{position:absolute;left:12px;top:12px;bottom:12px;width:72px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:16px}
.rail .logo{width:26px;height:30px;border-radius:8px;background:linear-gradient(var(--blue),oklch(60% .14 230))}
.rail .srch{width:46px;height:46px;border-radius:12px;background:var(--blue)}
.rail i{width:52px;height:46px;border-radius:10px;display:grid;place-items:center;font:500 10px/1 system-ui;color:var(--mut);font-style:normal}
.rail i.on{background:oklch(40% .08 230 / .5);color:var(--ink)}
.topc{position:absolute;left:104px;right:20px;top:16px;height:88px;border-radius:16px;background:linear-gradient(90deg,oklch(22% .04 235),oklch(19% .03 235));outline:1px solid oklch(72% .16 230 / .14)}
.topc .t{position:absolute;left:18px;top:8px;font-size:19px}
.topc .t small{display:block;font-size:11px;color:var(--mut);font-style:italic}
.topc .s{position:absolute;left:96px;right:300px;top:6px;height:38px;border-radius:9px;border:2px solid oklch(72% .16 230 / .8);background:var(--house);color:var(--dim);font-size:13px;padding:8px 36px}
.topc .np{position:absolute;right:70px;top:9px;height:30px;padding:0 14px;border-radius:5px;background:var(--blue);color:var(--blueink);font-size:12px;line-height:30px}
.tabs{position:absolute;left:18px;top:46px;display:flex;gap:2px;background:oklch(16% .02 240 / .7);border-radius:12px;padding:3px}
.tabs span{padding:6px 16px;border-radius:9px;font-size:12.5px;color:var(--mut)}
.tabs span.on{background:oklch(40% .1 230 / .45);color:var(--ink)}
.libs{position:absolute;left:104px;top:120px;width:226px;font-size:13px}
.libs h5{font-size:10.5px;letter-spacing:.06em;color:var(--dim);font-weight:500;margin:0 0 8px 10px}
.libs div{display:flex;justify-content:space-between;padding:8px 10px;border-radius:9px;color:var(--ink)}
.libs div.on{background:oklch(40% .1 230 / .35)}
.libs div em{font-style:normal;color:var(--dim);font-size:11.5px}
.bar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:510px;height:56px;border-radius:14px;background:oklch(20% .03 225);outline:1px solid oklch(80% .1 170 / .45);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:13px}
.bar .art{width:34px;height:34px;border-radius:8px;background:var(--slate)}
.bar .p{width:34px;height:34px;border-radius:9px;background:var(--blue);margin-left:auto}
.bar small{display:block;color:var(--mut);font-size:11px}
.bar small b{color:oklch(70% .15 330);font-weight:500}
.main{position:absolute;left:352px;right:20px;top:120px;bottom:84px}
/* phone chrome */
.ptop{position:absolute;left:12px;right:12px;top:10px;border-radius:18px;background:linear-gradient(90deg,oklch(22% .04 235),oklch(19% .03 235));padding:12px 14px 10px}
.ptop .t{font-size:19px;font-weight:500}
.ptop .t small{font-size:11px;color:var(--mut);font-style:italic;margin-left:6px}
.ptop .tabs{position:static;margin-top:8px;width:max-content}
.ptop .tabs span{padding:5px 11px;font-size:12px}
.pdock{position:absolute;left:12px;right:12px;bottom:12px;height:122px;border-radius:20px;background:oklch(20% .03 225);outline:1px solid oklch(80% .1 170 / .4)}
.pdock .bar{position:static;transform:none;width:auto;background:none;outline:0;height:60px;border-bottom:1px solid var(--line)}
.pdock nav{display:flex;justify-content:space-around;align-items:center;height:62px;font-size:11px;color:var(--mut)}
.pdock nav i{font-style:normal}.pdock nav .q{width:50px;height:50px;border-radius:14px;background:var(--blue)}
.pdock nav .on{color:var(--ink);background:oklch(40% .1 230 / .45);padding:6px 12px;border-radius:9px}
.pmain{position:absolute;left:12px;right:12px;top:112px;bottom:142px;overflow:hidden}
/* shared bits */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:5px;font-size:12.5px;font-weight:500;background:oklch(92% .01 240 / .07);color:var(--ink);white-space:nowrap}
.btn.pri{background:var(--blue);color:var(--blueink)}
.play{width:34px;height:34px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.play::after{content:"";border-left:10px solid var(--blueink);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.play.sm{width:30px;height:30px}
.dots{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--dim);flex:none}
.dots::after{content:"";width:3px;height:3px;border-radius:50%;background:currentColor;box-shadow:-6px 0 currentColor,6px 0 currentColor}
.hd{font-size:15px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:10px}
.hd span{font-size:12px;font-weight:400;color:var(--dim)}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:oklch(92% .01 240 / .07);color:var(--mut);white-space:nowrap}
.tag.k{color:var(--ok);background:oklch(76% .17 155 / .1)}
.tag.m{color:var(--energy);background:oklch(82% .11 75 / .12)}
.tag.b{color:oklch(72% .16 25);background:oklch(68% .19 25 / .12)}
.seg{display:inline-flex;background:var(--house);border-radius:8px;padding:2px;outline:1px solid var(--line)}
.seg span{padding:4px 10px;border-radius:6px;font-size:12px;color:var(--mut)}
.seg span.on{background:var(--row);color:var(--ink)}
.trk{display:flex;align-items:center;gap:8px;min-width:0;font-size:12.5px;padding:4px 0}
.trk .n{color:var(--dim);font-variant-numeric:tabular-nums;width:30px;flex:none;font-size:11px}
.trk .ti{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .ti em{font-style:normal;color:var(--dim);margin-left:6px}
.note{position:absolute;font-size:11px;color:var(--ink);background:oklch(72% .16 230 / .18);outline:1px solid oklch(72% .16 230 / .5);padding:3px 8px;border-radius:6px;white-space:nowrap}
svg.cv{display:block}
/* ---- blend additions ---- */
.strip{width:908px;zoom:var(--z);position:relative;border-radius:14px;background:var(--house);outline:1px solid var(--line);padding:18px}
@media (max-width:1399px){.strip{zoom:.75}}
.panel{background:var(--card);border-radius:14px;padding:14px 16px}
.lvl{display:inline-flex;align-items:center;gap:6px;vertical-align:middle}
.lvl i{display:block;width:44px;height:6px;border-radius:3px;background:oklch(92% .01 240 / .1);position:relative;overflow:hidden}
.lvl i b{position:absolute;inset:0 auto 0 0;background:var(--energy);border-radius:3px}
.lvl em{font-style:normal;font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.ring{width:18px;height:18px;border-radius:50%;flex:none;display:inline-block;vertical-align:middle}
.mset{display:inline-flex;gap:1px;background:var(--house);border-radius:7px;padding:2px;outline:1px solid var(--line)}
.mset span{font-size:10.5px;padding:2px 7px;border-radius:5px;color:var(--dim)}
.mset span.on{background:var(--row);color:var(--ink)}
.mset span.must.on{background:oklch(72% .16 230 / .25);color:var(--ink)}
.lane{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:stretch;border-top:1px solid var(--line);padding:8px 0}
.lane .lb{font-size:13px;display:flex;flex-direction:column;gap:5px}
.lane .lb small{color:var(--dim);font-size:11px;line-height:1.3}
.bricks{display:flex;gap:4px;position:relative;min-height:46px}
.brick{border-radius:9px;background:var(--row);padding:6px 10px;font-size:12.5px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.brick small{color:var(--dim);font-size:10.5px}
.brick.e{background:oklch(82% .11 75 / .1);outline:1px solid oklch(82% .11 75 / .3)}
.brick.sel{outline:2px solid var(--blue)}
.pal .it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;font-size:13.5px}
.pal .it small{margin-left:auto;color:var(--dim);font-size:11px}
.pal .it.on{background:oklch(40% .1 230 / .3)}
.bd{position:absolute;width:300px;background:oklch(23% .03 235);border-radius:12px;outline:1px solid oklch(92% .01 240 / .12);box-shadow:0 18px 40px oklch(0% 0 0 / .45);padding:12px 14px;font-size:12.5px}
.bd h6{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.bd .r{display:grid;grid-template-columns:70px 1fr 64px;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.bd .r span:first-child{color:var(--mut)}
.bd .r .pt{height:5px;border-radius:3px;background:oklch(92% .01 240 / .1);position:relative}
.bd .r .pt b{position:absolute;inset:0 auto 0 0;border-radius:3px}
.bd .r em{font-style:normal;text-align:right;color:var(--dim);font-size:11px}
.qrow{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;font-size:13px}
.qrow .art{width:34px;height:34px;border-radius:7px;background:var(--slate);flex:none}
.qrow .ti{flex:1;min-width:0}.qrow .ti small{display:block;color:var(--dim);font-size:11.5px}
.qrow.now{background:oklch(40% .1 230 / .25)}
.join{display:flex;align-items:center;gap:8px;padding:1px 0 1px 54px;font-size:11px;color:var(--dim);position:relative}
.join::before{content:"";position:absolute;left:26px;top:-6px;bottom:-6px;width:1px;background:var(--line)}
.opt{font:600 12px/1 system-ui;color:var(--blue);letter-spacing:.04em;margin-bottom:6px}
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:22px 22px 0 0;background:oklch(22% .03 235);outline:1px solid oklch(92% .01 240 / .12);padding:10px 16px 22px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:oklch(92% .01 240 / .25);margin:0 auto 12px}
.sl{position:relative;height:28px;display:flex;align-items:center}
.sl .tr{flex:1;height:6px;border-radius:3px;background:linear-gradient(90deg,oklch(82% .11 75 / .15),oklch(82% .11 75 / .9))}
.sl .th{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px oklch(82% .11 75 / .35)}
.before{opacity:.55}
</style>
</head>
<body>
<div class="board" id="board"></div>
<script>
let gid=0;
const rail=()=>`<div class="rail"><div class="logo"></div><div class="srch"></div><i>Home</i><i>Media</i><i>Discover</i><i class="on">Music</i><i>Library</i></div>`;
const topc=(tab='Flows')=>`<div class="topc"><div class="t">Music<small>474 tracks</small></div><div class="s">Search your libraries and online, or paste a link</div><div class="np">+ New playlist</div><div class="tabs">${['Flows','Mixes','Albums','Artists','Tracks'].map(t=>`<span class="${t===tab?'on':''}">${t}</span>`).join('')}</div></div>`;
const libs=()=>`<div class="libs"><h5>LIBRARIES</h5><div class="on">All<em>474</em></div><div>This PC<em>0</em></div><div>neuro soundcloud<em>46</em></div><div>Deadmau5<em>272</em></div><div>perso<em>156</em></div><h5 style="margin-top:16px">PLAYLISTS</h5><div>Queue<em>46</em></div><div>perso<em>2 parts</em></div><div>New playlist<em>13</em></div></div>`;
const bar=()=>`<div class="bar"><div class="art"></div><div>Black Bloc<small><b>Dark</b> · 172 BPM</small></div><div class="p"></div></div>`;
const pdock=()=>`<div class="pdock"><div class="bar"><div class="art"></div><div>Black Bloc<small><b>Dark</b> · 172 BPM</small></div><div class="p"></div></div><nav><i>Home</i><i>Media</i><span class="q"></span><i class="on">Music</i><i>Library</i></nav></div>`;
const ptop=(t='Music',tab='Flows')=>`<div class="ptop"><div class="t">${t}<small>474 tracks</small></div><div class="tabs">${['Flows','Mixes','Albums','Tracks'].map(x=>`<span class="${x===tab?'on':''}">${x}</span>`).join('')}</div></div>`;
const desk=(main,o={})=>`<div class="desk">${rail()}${o.top??topc()}${o.nolibs?'':libs()}<div class="main" style="${o.nolibs?'left:104px':''}">${main}</div>${bar()}</div>`;
const phone=(main,o={})=>`<div class="phone">${o.top??ptop()}<div class="pmain" style="${o.pm??''}">${main}</div>${o.nodock?'':pdock()}${o.over??''}</div>`;
// energy level (absolute 0..100), no name
const lvl=v=>`<span class="lvl" title="energy ${v}"><i><b style="width:${v}%"></b></i><em>${v}</em></span>`;
// Blend mark: ring filled to the score; colour by how well it blends
const gc=s=>s>=.75?'var(--ok)':s>=.5?'var(--energy)':'oklch(70% .17 25)';
const ring=(s,sz=18)=>{const r=sz/2-2.5,c=2*Math.PI*r;return `<svg class="ring" width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="oklch(92% .01 240 / .14)" stroke-width="3"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${gc(s)}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${s*c} ${c}" transform="rotate(-90 ${sz/2} ${sz/2})"/></svg>`};
const J={match:['In key','k'],relative:['Relative','m'],'mode-':['Darker','m'],lower:['Drop','m'],up:['Up a fifth','m'],break:['Break','b']};
const jt=k=>`<span class="tag ${J[k][1]}">${J[k][0]}</span>`;
// a Peak render from the live server (titles real; energy on the new absolute scale)
const T=[
 {t:'Supersonic (My Existence)',a:'Skrillex, Noisia, josh pan & Dylan Brady',bpm:174,e:81},
 {t:'Suicide Bassline VIP',a:'Mefjus',bpm:174,e:86,j:'lower',s:.82,d:{e:'+5',t:'0',h:'Drop',c:'dark → dark',g:'Drum & Bass'}},
 {t:'Farewell',a:'',bpm:172,e:78,j:'mode-',s:.58,d:{e:'−8',t:'−2',h:'Darker',c:'dark → dark',g:'Drum & Bass'}},
 {t:'Wanna',a:'Kumarion',bpm:174,e:83,j:'match',s:.91,d:{e:'+5',t:'+2',h:'In key',c:'dark → dark',g:'Drum & Bass'}},
 {t:'The Hole',a:'',bpm:174,e:80,j:'relative',s:.79,d:{e:'−3',t:'0',h:'Relative',c:'dark → warm',g:'Dubstep'}},
 {t:'All I Ever Wanted',a:'Emperor',bpm:175,e:84,j:'relative',s:.77,d:{e:'+4',t:'+1',h:'Relative',c:'warm → warm',g:'Drum & Bass'}},
 {t:'Perseverance',a:'',bpm:175,e:88,j:'lower',s:.71,d:{e:'+4',t:'0',h:'Drop',c:'warm → dark',g:'Drum & Bass'}},
];
// breakdown rows: [label, value, share of the score 0..1, setting]
function breakdown(x,o={}){
  const parts=[['Energy',`${x.d.e} (${x.d.e.startsWith('−')?'against the lift':'with the lift'})`,x.d.e.startsWith('−')?.35:.9,'Prefer'],['Tempo',`${x.d.t} BPM`,1,'Prefer'],['Harmony',x.d.h,x.j==='match'?1:x.j==='relative'?.8:.55,'Prefer'],['Colour',x.d.c,x.d.c.split(' → ')[0]===x.d.c.split(' → ')[1]?1:.5,'Prefer'],['Genre',x.d.g,x.d.g==='Drum & Bass'?1:.4,'Ignore']];
  return `<h6>${ring(x.s,20)} Blends ${x.s>=.75?'well':x.s>=.5?'fairly':'roughly'} <span style="margin-left:auto;font-weight:400;color:var(--dim);font-size:11.5px">${Math.round(x.s*100)}</span></h6><div style="color:var(--dim);font-size:11.5px;margin-bottom:6px">into ${x.t}</div>`+
   parts.map(([l,v,s,m])=>`<div class="r" style="${m==='Ignore'?'opacity:.45':''}"><span>${l}</span><span style="display:flex;flex-direction:column;gap:3px"><span>${v}</span><span class="pt"><b style="width:${m==='Ignore'?0:s*100}%;background:${gc(s)}"></b></span></span><em>${m==='Ignore'?'ignored':m}</em></div>`).join('')+
   (o.foot??`<div style="color:var(--dim);font-size:11px;margin-top:6px">This stretch leans <b style="color:var(--ink);font-weight:500">Lift</b>: a step up in energy counts in its favour.</div>`);
}

const S=[]; // sections
const sec=(id,title,tag,why,shots)=>S.push(`<section class="dir" id="${id}"><h2>${title}<small>${tag}</small></h2><p class="why">${why}</p><div class="shots">${shots}</div></section>`);
const shot=(html,cap)=>`<div>${html}<div class="cap">${cap}</div></div>`;

/* ===== 1. Lanes editor: leans + Must/Prefer/Ignore (stories 5, 6, 7) ===== */
const mset=(on,o={})=>`<span class="mset">${['Must','Prefer','Ignore'].map(m=>`<span class="${m===on?'on':''} ${m==='Must'?'must':''}">${m}</span>`).join('')}</span>`;
function leanBrick(kind,w,o={}){
  const path={Lift:'M0 30 L100 8',Hold:'M0 19 L100 19',Ease:'M0 8 L100 30'}[kind];
  return `<div class="brick e ${o.sel?'sel':''}" style="flex:${w}"><svg viewBox="0 0 100 38" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;opacity:.5"><path d="${path}" stroke="oklch(82% .11 75)" stroke-width="2" fill="none" vector-effect="non-scaling-stroke" stroke-dasharray="4 4"/></svg><span style="position:relative">${kind}</span><small style="position:relative">${o.sub??''}</small></div>`;
}
// the rendered result drawn through the energy lane: real picks, each a dot at its level
function result(w,h,vals){const n=vals.length;let d='',dots='';vals.forEach((v,i)=>{const x=(i+.5)/n*w,y=h-4-(v/100)*(h-8);d+=(i?'L':'M')+x+' '+y;dots+=`<circle cx="${x}" cy="${y}" r="2.6" fill="oklch(82% .11 75)"/>`});return `<svg width="${w}" height="${h}" style="position:absolute;left:0;top:0;pointer-events:none"><path d="${d}" stroke="oklch(82% .11 75)" stroke-width="1.6" fill="none"/>${dots}</svg>`}
const EV=[42,47,51,55,58,63,66,70,74,77,78,79,78,80,79,81,78,79,74,69,63,58,52,47];
const lanesDesk=desk(`
 <div class="panel" style="display:flex;align-items:center;gap:14px;padding:10px 14px"><span style="background:var(--house);padding:6px 12px;border-radius:7px;outline:1px solid var(--line);font-size:13px">Warm-up to peak</span><span style="color:var(--mut)">1 h · about 13 tracks</span><span style="margin-left:auto;font-size:12px;color:var(--dim)">Converted from your saved curve</span><span class="btn">Save</span><span class="btn pri">Play</span></div>
 <div style="display:grid;grid-template-columns:200px 1fr;gap:14px;margin-top:14px">
  <div class="panel pal" style="padding:10px">
   <div class="seg" style="margin-bottom:8px"><span class="on">Energy</span><span>Genre</span><span>Harmony</span></div>
   <div class="it on"><svg width="22" height="12"><path d="M1 11 L21 1" stroke="oklch(82% .11 75)" stroke-width="2"/></svg>Lift<small>steps up</small></div>
   <div class="it"><svg width="22" height="12"><path d="M1 6 L21 6" stroke="oklch(82% .11 75)" stroke-width="2"/></svg>Hold<small>stays close</small></div>
   <div class="it"><svg width="22" height="12"><path d="M1 1 L21 11" stroke="oklch(82% .11 75)" stroke-width="2"/></svg>Ease<small>steps down</small></div>
