<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>sestudio · harmony navigation mockups</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#060c11;--s1:#0c141b;--s2:#111b24;--s3:#17232e;--line:#1e2b37;
  --tx:#e3e9ee;--mu:#9aa7b2;--di:#76848f;
  --ac:#16b4f0;--acink:#03202c;--acsoft:#0d3346;
  --smooth:#4cc38a;--door:#82b6ff;--clash:#f0a83a;
  --r:10px;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#03070a;color:var(--tx);font-size:14px}
::selection{background:var(--acsoft);color:#fff}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}

/* board chrome */
.bar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 20px;background:#03070aee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar h1{font-size:15px;font-weight:600;margin:0 8px 0 0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:5px 12px;border-radius:999px;color:var(--mu);font-size:13px}
.seg button[aria-pressed=true]{background:var(--acsoft);color:#bfeaff}
.lbl{font-size:12px;color:var(--di);margin-right:4px}
.board{padding:24px 20px 80px;display:flex;flex-direction:column;gap:40px}
.scene h2{font-size:18px;margin:0 0 4px;letter-spacing:-.015em}
.scene p.note{margin:0 0 14px;color:var(--mu);max-width:78ch;line-height:1.5}
.frames{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.frame{flex:none;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);position:relative}
.frame.desk{width:1440px;height:900px}
.frame.phone{width:390px;height:844px;border-radius:28px}
.cap{font-size:12px;color:var(--di);margin:6px 2px 0}
.fwrap{display:flex;flex-direction:column}
body.fit .frame.desk{zoom:.62} body.fit .frame.phone{zoom:.9}

/* app chrome */
.app{display:flex;height:100%;gap:14px;padding:12px}
.rail{width:84px;flex:none;background:var(--s1);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:28px;height:28px;margin-bottom:12px;color:var(--ac)}
.rail .srch{width:52px;height:52px;border-radius:14px;background:var(--ac);color:var(--acink);display:grid;place-items:center;margin-bottom:10px}
.rail .it{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mu);padding:6px 0;width:64px;border-radius:10px}
.rail .it.on{color:var(--tx)} .rail .it.on svg{background:var(--acsoft);color:#bfeaff;border-radius:8px;padding:4px;width:34px;height:28px}
.rail .grow{flex:1}
.main{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.hdr{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:12px 18px;display:flex;flex-direction:column;gap:10px}
.hdr .top{display:flex;align-items:center;gap:16px}
.hdr .ttl{font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.hdr .ttl small{display:block;font-size:12px;font-weight:400;color:var(--mu);font-style:italic}
.search{flex:1;height:42px;border:1px solid var(--line);background:var(--bg);border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--di)}
.ibtn{width:40px;height:40px;border-radius:10px;background:var(--s2);display:grid;place-items:center;color:var(--mu);flex:none}
.tabs{display:inline-flex;background:var(--bg);border-radius:12px;padding:4px;gap:2px;align-self:flex-start}
.tabs span{padding:8px 22px;border-radius:9px;color:var(--mu)}
.tabs span.on{background:var(--acsoft);color:#d6f3ff}
.body{flex:1;display:flex;gap:14px;min-height:0}
.side{width:250px;flex:none;display:flex;flex-direction:column;gap:4px;padding:4px 0}
.side h4{font-size:11px;letter-spacing:.08em;color:var(--di);margin:14px 10px 6px;font-weight:600;display:flex;justify-content:space-between}
.side h4 b{font-weight:500;letter-spacing:0;color:var(--mu);font-size:12px;display:inline-flex;gap:4px;align-items:center}
.side .row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:9px;color:var(--tx)}
.side .row small{color:var(--di)} .side .row.on{background:var(--s3)}
.side .dot{width:7px;height:7px;border-radius:50%;background:var(--smooth);display:inline-block;margin-right:10px}
.content{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.mini{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:576px;height:62px;border-radius:14px;background:linear-gradient(90deg,#0f2a2a,#0d1c26 40%,#0f2a2a);border:1px solid #2b4a4a;display:flex;align-items:center;gap:12px;padding:0 12px;z-index:5}
.mini .art{width:38px;height:38px;border-radius:9px;background:#1b2440;display:grid;place-items:center;color:#a9b8ff}
.mini .meta{flex:1;font-size:14px} .mini .meta small{display:block;font-size:12px;color:var(--mu)}
.mini .pp{width:40px;height:40px;border-radius:10px;background:var(--ac);color:var(--acink);display:grid;place-items:center}

/* playlist workspace */
.plh{display:flex;align-items:flex-end;gap:16px;padding:6px 4px 0}
.plh .name{font-size:24px;font-weight:600;letter-spacing:-.025em}
.plh .sub{color:var(--mu);font-size:13px;margin-top:2px;display:flex;gap:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--s2);color:var(--mu);font-size:13px;white-space:nowrap}
.chip.clash{background:#3a2a10;color:#ffd08a}
.chip.on{background:var(--acsoft);color:#d6f3ff}
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;background:var(--s2);color:var(--tx);font-size:13px;white-space:nowrap}
.btn.pri{background:var(--ac);color:var(--acink);font-weight:600}
.spacer{flex:1}
.curve{height:74px;border-radius:12px;background:var(--s1);border:1px solid var(--line);position:relative;overflow:hidden;flex:none}
.list{display:flex;flex-direction:column;overflow:hidden}
.tr{display:grid;grid-template-columns:22px 1fr auto auto auto 30px;align-items:center;gap:14px;padding:8px 10px;border-radius:9px;min-height:50px}
.tr .n{color:var(--di);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.tr .t{min-width:0} .tr .t b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .t small{color:var(--mu);font-size:12.5px}
.tr .bpm,.tr .dur{color:var(--mu);font-size:12.5px;font-variant-numeric:tabular-nums}
.tr.sel{background:var(--s3);box-shadow:inset 0 0 0 1px #2c4a5c}
.mood{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu)}
.mood i{width:8px;height:8px;border-radius:50%;display:inline-block}
.join{display:flex;align-items:center;gap:8px;margin-left:46px;height:22px;font-size:12px;color:var(--di)}
.join::before{content:"";width:14px;height:1px;background:currentColor;opacity:.5}
.join.smooth{color:#5d9f80}.join.door{color:#7d9cc8}
.join.clash{color:#f0b250;font-weight:500}
.join.sel{color:#ffd08a}
.join .fix{color:#ffd08a;text-decoration:underline;text-underline-offset:3px}
.join.selbox{background:#2a2110;border-radius:8px;margin-left:36px;padding:0 10px;box-shadow:inset 0 0 0 1px #5a4316}

/* Fits next */
.fits{display:flex;flex-direction:column;background:var(--s1);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fits .fh{padding:14px 16px 10px;display:flex;flex-direction:column;gap:3px}
.fits .fh .k{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.fits .fh .a{color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fits .ff{display:flex;gap:6px;padding:0 16px 10px;flex-wrap:wrap}
.fits .fl{flex:1;overflow:hidden;padding:0 6px}
.fr{display:grid;grid-template-columns:1fr auto 34px;gap:10px;align-items:center;padding:8px 10px;border-radius:9px}
.fr:hover{background:var(--s2)}
.fr b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fr small{color:var(--mu);font-size:12.5px;display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.why{font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.why i{width:7px;height:7px;border-radius:50%;display:inline-block}
.why.smooth{color:#7fd6ad}.why.smooth i{background:var(--smooth)}
.why.door{color:#a8c9ff}.why.door i{background:var(--door)}
.add{width:32px;height:32px;border-radius:8px;background:var(--s2);display:grid;place-items:center;color:var(--tx)}
.fits .ft{border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px}
.sw{width:36px;height:20px;border-radius:999px;background:var(--s3);position:relative;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--mu)}
.help{margin-left:auto;color:var(--mu);font-size:12.5px;display:inline-flex;gap:5px;align-items:center}
.tray{margin:2px 0 6px 36px;border-left:2px solid #2c4a5c;padding-left:10px}
.tray .fits{border-radius:12px;background:#0b1720}
.tray.between{border-left-color:#5a4316}

/* phone */
.ph{height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.ph .phd{margin:10px 10px 0;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.ph .phd .ttl{font-size:18px;font-weight:600;letter-spacing:-.02em;flex:1;min-width:0}
.ph .phd .ttl small{display:block;font-size:12px;font-weight:400;color:var(--mu)}
.ph .scroll{flex:1;overflow:hidden;padding:8px 6px 0}
.ph .tr{grid-template-columns:18px 1fr auto 26px;gap:10px;padding:7px 8px;min-height:52px}
.ph .tr .t small{display:flex;gap:7px;align-items:center}
.ph .join{margin-left:34px}
.dock{position:absolute;left:10px;right:10px;bottom:10px;height:120px;border-radius:20px;background:#0e1a20f2;border:1px solid #23404a;display:flex;flex-direction:column;z-index:6}
.dock .mp{flex:1;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #1f3640}
.dock .nav{height:58px;display:flex;justify-content:space-around;align-items:center;font-size:11px;color:var(--mu)}
.dock .nav span{display:flex;flex-direction:column;align-items:center;gap:3px}
.dock .nav .s{width:48px;height:48px;border-radius:14px;background:var(--ac);color:var(--acink);display:grid;place-items:center}
.dock .nav .on{color:var(--tx)}
.scrim{position:absolute;inset:0;background:#000a;z-index:7}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--s1);border-top:1px solid #2a3a47;border-radius:22px 22px 0 0;display:flex;flex-direction:column;box-shadow:0 -12px 40px #0008}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:#34434f;margin:8px auto 2px}
.sheet .fh{padding-right:64px}
.sheet .fits{border:0;background:transparent;border-radius:0;flex:1}
.sheet .x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--mu);background:var(--s2)}
.tag{position:absolute;top:10px;left:10px;z-index:20;background:#000c;color:#bfeaff;font-size:11px;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
</style>
</head>
<body class="fit">
<div class="bar">
  <h1>Harmony navigation · mockups</h1>
  <span class="lbl">Variant</span>
  <div class="seg" id="vSeg"><button data-v="A" aria-pressed="true">A · Side panel</button><button data-v="B">B · Inline tray</button></div>
  <span class="lbl">Theory level</span>
  <div class="seg" id="lSeg"><button data-l="plain" aria-pressed="true">Plain</button><button data-l="theory">Theory</button></div>
  <span class="lbl">Size</span>
  <div class="seg" id="zSeg"><button data-z="fit" aria-pressed="true">Fit</button><button data-z="real">Real size</button></div>
</div>
<div class="board" id="board"></div>

<script>
const S={v:'A',l:'plain'};
const ic={
 logo:'<path d="M15 4c-4 0-7 2-7 5s3 4 6 5 6 2 6 5-3 5-7 5" stroke-width="2.6"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 tv:'<rect x="3" y="5" width="18" height="13" rx="2"/><path d="m10 9 5 2.5-5 2.5z"/>',
 compass:'<circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4z"/>',
 music:'<path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/>',
 heart:'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
 bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
 dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',
 play:'<path d="M7 5v14l12-7z"/>',
 pause:'<path d="M8 5v14M16 5v14"/>',
 cast:'<path d="M3 17a4 4 0 0 1 4 4M3 13a8 8 0 0 1 8 8M3 9V6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-6"/>',
 up:'<path d="m6 15 6-6 6 6"/>', down:'<path d="m6 9 6 6 6-6"/>', back:'<path d="M15 6l-6 6 6 6"/>',
 list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 map:'<circle cx="7" cy="16" r="2"/><circle cx="12" cy="9" r="2"/><circle cx="18" cy="13" r="2"/><path d="M8.5 14.5l2.5-4M13.8 9.8l2.6 2"/>',
 wand:'<path d="M4 20 15 9M14 4v3M19 9h-3M18 5l-2 2"/>',
 help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17h.01"/>',
 filter:'<path d="M4 6h16M7 12h10M10 18h4"/>',
 next:'<path d="M5 5v14l9-7zM18 5v14"/>',
 grip:'<circle cx="9" cy="7" r="1"/><circle cx="15" cy="7" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="17" r="1"/><circle cx="15" cy="17" r="1"/>',
};
const I=(n,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[n]}</svg>`;

// mood ramp: own hues, no amber/green (those mean fit/clash)
const MOOD={Floating:'#b7a8ff',Bright:'#8fd3ff',Warm:'#ff9eb4',Smooth:'#e590d2',Dark:'#c06ad8',Menacing:'#8f6bff',Exotic:'#6fd6e6'};
const KEY={Floating:'F lydian',Bright:'C major',Warm:'G mixolydian',Smooth:'D dorian',Dark:'A minor',Menacing:'E phrygian',Exotic:'B harm. minor'};
const T=[
 {t:'Sunder',a:'Emperor',m:'Exotic',b:174,d:'4:36',e:3,g:'DnB'},
 {t:'These Days',a:'Emperor',m:'Smooth',b:172,d:'4:28',e:2,g:'DnB'},
 {t:'A Taste Of Hope (Emperor Remix)',a:'Unknown artist',m:'Dark',b:172,d:'5:14',e:3,g:'DnB'},
 {t:'Hear The Lies [Premiere]',a:'Eluun',m:'Dark',b:172,d:'3:55',e:4,g:'DnB'},
 {t:'Fade Black - Elysium',a:'Fade Black',m:'Dark',b:175,d:'4:07',e:4,g:'DnB'},
 {t:'Best Of Me ft. Dia Frampton',a:'Unknown artist',m:'Bright',b:124,d:'4:13',e:2,g:'Dubstep'},
 {t:'All I Ever Wanted',a:'Emperor',m:'Dark',b:172,d:'4:57',e:3,g:'DnB'},
 {t:'You left me',a:'Eluun',m:'Dark',b:174,d:'3:33',e:2,g:'DnB'},
];
const J=[['smooth','lifts'],['door','lifts'],['smooth','holds'],['smooth','holds'],['clash','tempo 175 → 124'],['door','lifts'],['smooth','eases off']];
const FITS=[
 {t:'Dune',a:'Unknown artist',m:'Dark',b:174,d:'2:07',k:'smooth',e:'lifts',n:7},
 {t:'Black Bloc',a:'Unknown artist',m:'Dark',b:172,d:'4:11',k:'smooth',e:'holds',n:7},
 {t:'Aurora (Justin Hawkes Remix)',a:'feat. Metrik',m:'Menacing',b:175,d:'3:51',k:'smooth',e:'lifts',n:7},
 {t:'If I Could (OUT NOW)',a:'Unknown artist',m:'Smooth',b:172,d:'4:13',k:'door',e:'holds',n:6},
 {t:'D_Minds & Mefjus - Systematic V4',a:'Unknown artist',m:'Smooth',b:172,d:'4:31',k:'door',e:'eases off',n:6},
 {t:'I\'m Back',a:'Dodge & Fuski',m:'Dark',b:150,d:'3:20',k:'door',e:'lifts',n:6},
 {t:'Halogenix - Blessings',a:'Halogenix',m:'Exotic',b:174,d:'4:45',k:'smooth',e:'holds',n:7},
];
const BETWEEN=[
 {t:'Strobe (Edit)',a:'Deadmau5',m:'Dark',b:150,d:'3:40',k:'smooth',e:'eases off',n:7,why2:'174 → 150 → 124'},
 {t:'I\'m Back',a:'Dodge & Fuski',m:'Dark',b:150,d:'3:20',k:'door',e:'eases off',n:6,why2:'175 → 150 → 124'},
 {t:'Ghosts n Stuff',a:'Deadmau5',m:'Smooth',b:128,d:'5:12',k:'door',e:'eases off',n:6,why2:'175 → 128 → 124'},
];
const theory=()=>S.l==='theory';
const moodTag=m=>`<span class="mood"><i style="background:${MOOD[m]}"></i>${theory()?KEY[m]:m}</span>`;
const bars=e=>`<svg width="18" height="12" viewBox="0 0 18 12" aria-label="energy ${e} of 4">${[0,1,2,3].map(i=>`<rect x="${i*4.6}" y="${9-i*3}" width="3" height="${3+i*3}" rx="1" fill="${i<e?'#16b4f0':'#24323d'}"/>`).join('')}</svg>`;
const kindWord=k=>({smooth:theory()?'same notes':'smooth',door:theory()?'1 note changes':'next door',clash:'clash'}[k]);

function why(f){
  const base=`<span class="why ${f.k}"><i></i>${kindWord(f.k)}</span>`;
  const extra=theory()?` · ${f.n} of 7 notes · ${f.e}`:` · ${f.e}`;
  return base+`<span style="color:var(--di);font-size:12px">${extra}</span>`;
}
function filters(phone){
  if(phone) return `<div class="ff"><span class="chip on">${theory()?'Same or close notes':'Smooth only'}</span><span class="chip">Energy · any</span><span class="chip">${I('filter',14)} ${theory()?'More (3)':'More'}</span></div>`;
  if(!theory()) return `<div class="ff"><div class="seg" style="font-size:12px"><button aria-pressed="true">Smooth only</button><button>Anything</button></div><div class="seg"><button aria-pressed="true">Any energy</button><button>Lift</button><button>Hold</button><button>Ease off</button></div></div>`;
  return `<div class="ff"><span class="chip on">Notes · same or close</span><span class="chip">Energy · any</span><span class="chip">Mood · any</span><span class="chip">Genre · same</span><span class="chip">Tempo · ±6%</span></div>`;
}
function fitsBox({title,anchor,rows,phone,footer,max=7,actions='add',between}){
  const r=rows.slice(0,max).map(f=>`<div class="fr"><div style="min-width:0"><b>${f.t}</b><small>${f.a} · ${moodTag(f.m)} · ${f.b}</small><small style="margin-top:2px">${why(f)}${between?`<span style="color:var(--di);font-size:12px"> · tempo ${f.why2}</span>`:''}</small></div><span class="dur" style="color:var(--mu);font-size:12.5px">${f.d}</span><button class="add" aria-label="${actions==='insert'?'Insert':'Add'} ${f.t}">${I('plus',16)}</button></div>`).join('');
  return `<div class="fits"><div class="fh"><div class="k">${title}<span class="help">${I('help',15)} How it works</span></div><div class="a">${anchor}</div></div>${filters(phone)}<div class="fl">${r}</div>${footer||''}</div>`;
}
const autopilot=`<div class="ft"><span class="sw"></span><div style="flex:1"><div style="color:var(--tx)">Keep filling like this</div><div style="font-size:12px">Adds a track that fits whenever 2 are left · Warm-up, peak, cool-down</div></div></div>`;

function curve(w){
  const n=T.length,xs=T.map((_,i)=>20+i*(w-40)/(n-1));
  const ey=T.map(t=>58-t.e*10), my=T.map(t=>({Dark:30,Smooth:22,Exotic:26,Bright:12}[t.m]||24));
  const path=(ys)=>xs.map((x,i)=>(i?'L':'M')+x.toFixed(1)+' '+ys[i]).join(' ');
  return `<div class="curve"><svg width="100%" height="74" viewBox="0 0 ${w} 74" preserveAspectRatio="none">
   <path d="${path(ey)} L${xs[n-1]} 70 L${xs[0]} 70Z" fill="#16b4f01c"/>
   <path d="${path(ey)}" stroke="#16b4f0" stroke-width="2" fill="none"/>
   <path d="${path(my)}" stroke="#c06ad8" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
   <line x1="${(xs[4]+xs[5])/2}" x2="${(xs[4]+xs[5])/2}" y1="4" y2="70" stroke="#f0a83a" stroke-width="2"/>
   ${xs.map(x=>`<circle cx="${x}" cy="70" r="2" fill="#4a5a66"/>`).join('')}
  </svg><span style="position:absolute;left:12px;top:6px;font-size:11px;color:var(--di)">Energy <i style="display:inline-block;width:14px;border-top:2px solid #16b4f0;vertical-align:middle"></i> · Mood <i style="display:inline-block;width:14px;border-top:2px dashed #c06ad8;vertical-align:middle"></i></span></div>`;
}
function joinRow(i,phone,selJoin){
  const [k,e]=J[i];
  if(k==='clash'){
    const sel=selJoin===i;
    return `<div class="join clash ${sel?'selbox':''}">${I('x',12)} Clash · ${theory()?'4 of 7 notes · ':''}${e} <span class="fix">${sel?'Fits between ↓':'Fix'}</span></div>`;
  }
  return `<div class="join ${k}">${kindWord(k)} · ${e}</div>`;
}
function trackRow(t,i,phone,sel){

  return `<div class="tr ${sel?'sel':''}"><span class="n">${i+1}</span><div class="t"><b>${t.t}</b><small>${t.a}</small></div>${moodTag(t.m)}<span class="bpm">${t.b} bpm</span><span class="dur">${t.d}</span><span style="color:var(--di)">${I('dots',18)}</span></div>`;
}

function mapSvg(w,h){
  const pts=[];let s=7;const rnd=()=>{s=(s*9301+49297)%233280;return s/233280};
  for(let i=0;i<120;i++)pts.push([rnd(),rnd()]);
  const moods=Object.keys(MOOD);
  const dots=pts.map(([x,y],i)=>`<circle cx="${30+x*(w-60)}" cy="${20+y*(h-60)}" r="3.2" fill="${MOOD[moods[i%7]]}" opacity=".22"/>`).join('');
  const path=[[.18,.78],[.26,.62],[.36,.5],[.44,.36],[.52,.24],[.86,.62],[.6,.42],[.66,.7]].map(([x,y])=>[30+x*(w-60),20+y*(h-60)]);
  const fits=[[.5,.2],[.56,.28],[.47,.3],[.58,.18]].map(([x,y])=>`<circle cx="${30+x*(w-60)}" cy="${20+y*(h-60)}" r="6" fill="none" stroke="#4cc38a" stroke-width="1.5" opacity=".9"/>`).join('');
  const line=path.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">${dots}
   <path d="${line}" stroke="#e3e9ee" stroke-width="1.5" stroke-dasharray="5 5" fill="none" opacity=".8"/>
   ${path.map((p,i)=>`<g><circle cx="${p[0]}" cy="${p[1]}" r="11" fill="${i===4?'#16b4f0':'#17232e'}" stroke="${i===5?'#f0a83a':'#4a6070'}" stroke-width="${i===5?2:1}"/><text x="${p[0]}" y="${p[1]+4}" text-anchor="middle" font-size="11" fill="${i===4?'#03202c':'#e3e9ee'}">${i+1}</text></g>`).join('')}
   ${fits}
   <text x="30" y="${h-14}" font-size="11" fill="#76848f">darker</text><text x="${w-30}" y="${h-14}" font-size="11" fill="#76848f" text-anchor="end">brighter</text>
   <text x="12" y="${h/2}" font-size="11" fill="#76848f" transform="rotate(-90 12 ${h/2})" text-anchor="middle">energy</text></svg>`;
}

   :'Variant B: Fits next opens as a tray right under the selected row (top 3, "More" grows it). Nothing docks; the list itself is the workspace, the same on phone and desktop. The dock stays visible on phone.',
  d:()=>deskPlaylist({sel:2}),p:()=>phonePlaylist({sel:2})},
 {h:'2 · Playlist: a clash is selected',n:'Tapping the amber join (or the "1 clash" chip) turns Fits next into Fits between: tracks that fit both sides, with the tempo path. This replaces Fill a gap, Bridge two tracks and the separate Fix dialog.',
  d:()=>deskPlaylist({selJoin:4}),p:()=>phonePlaylist({selJoin:4})},
 {h:'3 · Player: Add to queue → Fits next',n:'The same component, anchored to the last queued track (not an empty library). Autopilot lives here as "Keep filling like this", so it sits next to the list it would fill. Same in both variants.',
  d:deskPlayer,p:phonePlayer},
 {h:'4 · Any track → Fits next',n:'From a row menu, the key card or a map dot. Desktop: the same side panel beside Tracks. Phone: a sheet with a visible close. Replaces the Tracks tab\'s Fits after mode and its 16-option filter bar. Same in both variants (B uses the panel here too: a library list has no row to anchor a tray between).',
  d:deskTrackFits,p:phoneTrackFits},
 {h:'5 · New playlist',n:'Replaces the Build a set dialog and the Mix builder. Not saved until it has a track, so no empty drafts. "Fill a gap" is gone from here: repairs live on the clash (scene 2).',
  d:deskNew,p:phoneNew},
 {h:'6 · Playlist: Map view',n:'Explore moves into the playlist as a List | Map toggle. The path is drawn in order, the selected track filled, clashes ringed amber, tracks that fit after it ringed green. A legend explains colours. Library-wide exploring = Map of an empty playlist.',
  d:deskMap,p:phoneMap},
];
function render(){
  document.getElementById('board').innerHTML=scenes().map(s=>`<section class="scene"><h2>${s.h}</h2><p class="note">${s.n}</p><div class="frames"><div class="fwrap"><div class="frame desk"><span class="tag">Desktop 1440 × 900</span>${s.d()}</div></div><div class="fwrap"><div class="frame phone"><span class="tag">Phone 390 × 844</span>${s.p()}</div></div></div></section>`).join('');
}
function seg(id,key,fn){document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;[...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));fn(b.dataset[key]);});}
seg('vSeg','v',v=>{S.v=v;render()});
seg('lSeg','l',l=>{S.l=l;render()});
seg('zSeg','z',z=>{document.body.classList.toggle('fit',z==='fit')});
const q=new URLSearchParams(location.search);
if(q.get('v'))S.v=q.get('v'); if(q.get('l'))S.l=q.get('l');
const only=+q.get('only')||0;
if(only){const all=render;render=()=>{all();[...document.querySelectorAll('.scene')].forEach((s,i)=>{if(i!==only-1)s.remove()})};}
if(q.get('z')==='real')document.body.classList.remove('fit');
render();
</script>
</body>
