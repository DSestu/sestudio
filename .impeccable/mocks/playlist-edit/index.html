<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playlist edit mode — mockups</title>
<style>
:root{
  --b1:oklch(16% .015 240);--b2:oklch(20% .02 240);--b3:oklch(26% .025 240);--b4:oklch(31% .025 240);
  --tx:oklch(92% .01 240);--p:oklch(72% .16 230);--pink:oklch(80% .07 230 / .9);
  --ok:oklch(76% .17 155);--warn:oklch(83% .16 85);--bad:oklch(68% .19 25);--rel:oklch(78% .13 300);--fifth:oklch(80% .12 200);
  --dark:oklch(62% .2 330);--smooth:oklch(70% .12 190);--float:oklch(78% .1 260);--warm:oklch(76% .14 60);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05080d;color:var(--tx);font:14px/1.43 ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:oklch(72% .16 230 / .35)}
.num{font-variant-numeric:tabular-nums}
.dim{color:oklch(92% .01 240 / .55)}.dimmer{color:oklch(92% .01 240 / .4)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:15px;height:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- desktop frame ---------- */
.desk{width:1440px;height:900px;background:var(--b1);position:relative;overflow:hidden;display:flex;gap:16px;padding:12px 16px 12px 12px}
.rail{width:84px;flex:none;border-radius:16px;background:oklch(20% .02 240 / .6);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.rail .logo{width:28px;height:34px;margin-bottom:10px;color:var(--tx)}
.rail .srch{width:52px;height:52px;border-radius:12px;background:var(--p);color:var(--b1);display:grid;place-items:center;margin-bottom:8px}
.rail .it{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:oklch(92% .01 240 / .7);padding:8px 0;width:64px;border-radius:10px}
.rail .it.on{color:var(--p)}.rail .it.on .ic{background:oklch(72% .16 230 / .18);border-radius:10px;padding:4px 14px}
.rail .grow{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.top{height:56px;border-radius:16px;background:var(--b2);border:1px solid var(--b3);display:flex;align-items:center;gap:12px;padding:0 8px 0 8px}
.back{width:38px;height:38px;border-radius:10px;background:var(--b3);display:grid;place-items:center}
.ttl{line-height:1.15}.ttl b{font-size:19px;font-weight:600;letter-spacing:-.02em}.ttl small{display:block;font-size:12px;color:oklch(92% .01 240 / .55)}
.edtag{font-size:11px;font-weight:600;color:var(--p);background:oklch(72% .16 230 / .14);border-radius:99px;padding:3px 9px;margin-left:6px;vertical-align:3px}
.top .sp{flex:1}
.btn{height:32px;border-radius:6px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.btn.pr{background:var(--p);color:oklch(18% .05 230)}.btn.gh{color:oklch(92% .01 240 / .8)}.btn.gh:hover{background:var(--b3)}
.btn.soft{background:oklch(72% .16 230 / .14);color:var(--p)}
.undo{font-size:12px}

.cols{flex:1;min-height:0;display:grid;grid-template-columns:352px minmax(0,1fr) 372px;gap:12px}
.col{min-height:0;border-radius:16px;background:oklch(20% .02 240 / .55);display:flex;flex-direction:column;overflow:hidden;position:relative}
.colh{padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid oklch(26% .025 240 / .7)}
.colh .row1{display:flex;align-items:center;gap:8px}
.h{font-size:15px;font-weight:600;letter-spacing:-.02em}
.seg{display:inline-flex;background:oklch(100% 0 0 / .05);border-radius:99px;padding:2px}
.seg b{font-weight:500;font-size:12px;height:28px;padding:0 13px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;color:oklch(92% .01 240 / .7)}
.seg b.on{background:oklch(72% .16 230 / .2);color:var(--p)}
.field{height:34px;border-radius:8px;background:var(--b1);border:1px solid var(--b3);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;color:oklch(92% .01 240 / .45)}
.field.live{border-color:oklch(72% .16 230 / .8);box-shadow:0 0 0 3px oklch(72% .16 230 / .15);color:var(--tx)}
.crumbs{display:flex;align-items:center;gap:4px;font-size:12.5px;flex-wrap:wrap}
.crumbs a{color:oklch(92% .01 240 / .6);padding:2px 5px;border-radius:5px}.crumbs a:hover{background:var(--b3)}
.crumbs .sep{color:oklch(92% .01 240 / .3)}.crumbs .cur{color:var(--tx);font-weight:600;padding:2px 5px}
.scroll{flex:1;min-height:0;overflow:hidden;padding:6px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;color:oklch(92% .01 240 / .45);padding:10px 8px 6px;display:flex;align-items:center;gap:8px}
.lbl .r{margin-left:auto;font-weight:500;letter-spacing:0}

/* source rows */
.srow{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border-radius:9px;position:relative}
.srow:hover,.srow.hov{background:oklch(100% 0 0 / .05)}
.srow.hov{box-shadow:inset 0 0 0 1px oklch(72% .16 230 / .45);background:oklch(72% .16 230 / .08)}
.srow .grip{color:oklch(92% .01 240 / .25);width:12px}
.srow .t{flex:1;min-width:0;line-height:1.2}.srow .t b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .du{font-size:12px;color:oklch(92% .01 240 / .5);width:36px;text-align:right}
.fold{width:30px;height:30px;border-radius:7px;background:var(--b3);display:grid;place-items:center;color:oklch(92% .01 240 / .7);flex:none}
.fold.lib{background:oklch(72% .16 230 / .14);color:var(--p)}
.cnt{font-size:12px;color:oklch(92% .01 240 / .45)}
.chev{color:oklch(92% .01 240 / .3)}
.inpl{font-size:10.5px;color:var(--ok);background:oklch(76% .17 155 / .12);border-radius:99px;padding:2px 7px;white-space:nowrap}
.drawer{position:absolute;right:6px;top:7px;display:flex;gap:4px}
.drawer b{height:30px;border-radius:7px;background:var(--b4);display:inline-flex;align-items:center;gap:5px;padding:0 9px;font-weight:500;font-size:12px}
.drawer b.pr{background:var(--p);color:oklch(18% .05 230)}
.ldot{width:8px;height:8px;border-radius:99px;background:var(--ok);flex:none}

.key{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:5px;background:oklch(100% 0 0 / .07);padding:2px 6px;color:oklch(92% .01 240 / .75);white-space:nowrap}
.key i{width:8px;height:8px;border-radius:99px;display:inline-block}
.bpm{font-size:11.5px;color:oklch(92% .01 240 / .45);white-space:nowrap}
.gen{font-size:11px;color:var(--smooth);border:1px solid oklch(70% .12 190 / .45);border-radius:99px;padding:1px 7px;white-space:nowrap}
.na{font-size:11px;color:oklch(92% .01 240 / .4);font-style:normal;white-space:nowrap}

/* playlist */
.plh{padding:12px 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid oklch(26% .025 240 / .7)}
.plh .meta{font-size:12.5px;color:oklch(92% .01 240 / .55)}
.chip{font-size:12px;border-radius:99px;padding:2px 9px;white-space:nowrap}
.chip.warn{background:oklch(83% .16 85 / .14);color:var(--warn)}
.curve{height:46px;margin:8px 16px 4px;border-radius:10px;background:var(--b1);position:relative;overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;height:46px;padding:0 10px 0 6px;border-radius:9px;position:relative}
.prow:hover,.prow.hov{background:oklch(100% 0 0 / .05)}
.prow.lifted{opacity:.35}
.prow .ix{width:20px;text-align:right;font-size:11.5px;color:oklch(92% .01 240 / .35)}
.prow .t{flex:1;min-width:0;line-height:1.2}.prow .t b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5)}
.prow .du{font-size:12px;color:oklch(92% .01 240 / .55);width:38px;text-align:right}
.prow .grip{color:oklch(92% .01 240 / .25)}
.prow.now .t b{color:var(--p)}
.join{height:22px;display:flex;align-items:center;gap:8px;padding-left:36px;position:relative}
.join::before{content:"";position:absolute;left:26px;right:14px;top:50%;height:1px;background:oklch(26% .025 240 / .9)}
.jc{position:relative;font-size:11px;border-radius:99px;padding:1px 8px;background:var(--b2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 0 0 3px var(--b2)}
.jc i{width:6px;height:6px;border-radius:99px;display:inline-block}
.jc.m{color:var(--ok)}.jc.m i{background:var(--ok)}
.jc.f{color:var(--fifth)}.jc.f i{background:var(--fifth)}
.jc.r{color:var(--rel)}.jc.r i{background:var(--rel)}
.jc.c{color:var(--warn)}.jc.c i{background:var(--warn)}
.jc.x{color:var(--bad)}.jc.x i{background:var(--bad)}
.jc .sub{color:oklch(92% .01 240 / .45)}
.join.hov::before{background:oklch(72% .16 230 / .7);height:2px}
.join.hov .jc{box-shadow:0 0 0 1px oklch(72% .16 230 / .7),0 0 0 4px var(--b2)}
.pin{position:relative;width:18px;height:18px;border-radius:99px;background:var(--p);color:oklch(18% .05 230);font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px var(--b2)}
.pin.g{background:oklch(72% .16 230 / .25);color:var(--p)}
.ghostline{height:0;position:relative;margin:0 14px 0 26px}
.ins{height:50px;margin:2px 4px;border-radius:10px;border:1.5px dashed oklch(72% .16 230 / .75);background:oklch(72% .16 230 / .07);display:flex;align-items:center;gap:10px;padding:0 10px;position:relative}
.ins .t b{font-size:13.5px;font-weight:500}.ins .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5)}
.dragcard{position:absolute;z-index:20;width:300px;height:48px;border-radius:10px;background:var(--b4);box-shadow:0 14px 30px -6px #000c,0 0 0 1px oklch(72% .16 230 / .6);display:flex;align-items:center;gap:10px;padding:0 10px;transform:rotate(-1.5deg)}
.dragcard .t b{font-size:13px;font-weight:500;display:block}.dragcard .t small{font-size:11px;color:oklch(92% .01 240 / .55)}
.cursor{position:absolute;z-index:21;width:18px;height:22px}

/* fits */
.fh{padding:12px 14px 10px;border-bottom:1px solid oklch(26% .025 240 / .7);display:flex;flex-direction:column;gap:8px}
.follow{display:flex;align-items:center;gap:7px;font-size:11.5px;color:oklch(92% .01 240 / .5)}
.follow .dot{width:7px;height:7px;border-radius:99px;background:var(--p);box-shadow:0 0 0 3px oklch(72% .16 230 / .2)}
.follow .pinb{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:7px;color:oklch(92% .01 240 / .7);background:oklch(100% 0 0 / .05)}
.follow .pinb.on{color:var(--p);background:oklch(72% .16 230 / .15)}
.about{display:flex;align-items:center;gap:10px}
.about .art{width:40px;height:40px;border-radius:7px;background:var(--b3);flex:none;background-size:cover;background-position:center}
.about .t{min-width:0;flex:1;line-height:1.25}.about .t b{font-size:15px;font-weight:600;letter-spacing:-.015em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.about .t small{font-size:12px;color:oklch(92% .01 240 / .55)}
.frow{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;position:relative}
.frow:hover{background:oklch(100% 0 0 / .05)}
.frow .t{flex:1;min-width:0;line-height:1.28}.frow .t b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{font-size:11.5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.why i{width:7px;height:7px;border-radius:99px;display:inline-block}
.src{font-size:10.5px;border-radius:4px;padding:1px 5px;background:oklch(100% 0 0 / .07);color:oklch(92% .01 240 / .6)}
.plus{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--p)}
.spot{border-radius:10px;background:oklch(100% 0 0 / .035);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;margin:0 6px 6px}
.spot.best{background:oklch(72% .16 230 / .09);box-shadow:inset 0 0 0 1px oklch(72% .16 230 / .35)}
.spot .t{flex:1;min-width:0}.spot .t b{font-size:13px;font-weight:500;display:block}
.spot .t small{font-size:12px;color:oklch(92% .01 240 / .55);display:block;margin-top:2px}
.spot .lines{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.verdict{margin:10px 6px 8px;padding:12px;border-radius:12px;background:oklch(100% 0 0 / .04)}
.verdict .vh{font-size:13px;font-weight:600;margin-bottom:8px}
.vline{display:grid;grid-template-columns:86px 1fr;gap:6px;font-size:12.5px;padding:3px 0}
.vline span:first-child{color:oklch(92% .01 240 / .5)}
.bar{height:6px;border-radius:99px;background:var(--b3);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.tip{font-size:12px;color:oklch(92% .01 240 / .55);padding:4px 10px 10px}

/* online */
.oart{width:44px;height:44px;border-radius:6px;background:var(--b3) center/cover;flex:none}
.orow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;position:relative}
.orow.hov{background:oklch(72% .16 230 / .08);box-shadow:inset 0 0 0 1px oklch(72% .16 230 / .45)}
.orow .t{flex:1;min-width:0;line-height:1.25}.orow .t b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5)}
.orow .facts{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.anl{height:28px;border-radius:7px;border:1px solid oklch(72% .16 230 / .5);color:var(--p);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:0 9px;white-space:nowrap}
.prog{display:flex;flex-direction:column;gap:3px;font-size:11px;width:118px}
.prog .st{display:flex;align-items:center;gap:5px;color:oklch(92% .01 240 / .5)}
.prog .st.done{color:var(--ok)}.prog .st.run{color:var(--p)}
.spin{width:10px;height:10px;border-radius:99px;border:2px solid oklch(72% .16 230 / .3);border-top-color:var(--p);display:inline-block}
.srail{width:88px;flex:none;border-right:1px solid oklch(26% .025 240 / .7);padding:6px;display:flex;flex-direction:column;gap:3px}
.stop{border-radius:9px;padding:8px;font-size:12px;line-height:1.2;color:oklch(92% .01 240 / .7)}
.stop b{display:block;font-weight:500;font-size:12.5px}.stop small{font-size:11px;color:oklch(92% .01 240 / .45)}
.stop.on{background:oklch(72% .16 230 / .14);color:var(--p)}.stop.on small{color:oklch(72% .16 230 / .75)}
.stopdiv{font-size:10px;color:oklch(92% .01 240 / .35);padding:6px 8px 2px;letter-spacing:.04em}

.note{position:absolute;z-index:40;background:oklch(83% .16 85);color:#1a1405;font-size:12px;font-weight:600;border-radius:8px;padding:6px 9px;max-width:230px;line-height:1.3;box-shadow:0 8px 20px -6px #000a}
.note:before{content:attr(data-n);display:inline-grid;place-items:center;width:17px;height:17px;border-radius:99px;background:#1a1405;color:oklch(83% .16 85);font-size:10.5px;margin-right:6px;vertical-align:1px}

/* ---------- phone ---------- */
.phone{width:390px;height:844px;background:var(--b1);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ptop{margin:10px 12px 0;height:56px;border-radius:16px;background:var(--b2);border:1px solid var(--b3);display:flex;align-items:center;gap:10px;padding:0 8px;flex:none}
.pbody{flex:1;min-height:0;overflow:hidden;padding:8px 8px 0;position:relative}
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:62px;border-radius:20px;background:oklch(26% .025 240 / .92);backdrop-filter:blur(12px);display:flex;align-items:center;padding:6px;gap:6px;box-shadow:0 10px 30px -8px #000c;z-index:10}
.dock b{flex:1;height:50px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:oklch(92% .01 240 / .75)}
.dock b.on{background:oklch(72% .16 230 / .18);color:var(--p)}
.dock b small{font-size:10px;color:oklch(92% .01 240 / .45);max-width:100px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dock b.on small{color:oklch(72% .16 230 / .7)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--b2);border-radius:20px 20px 0 0;box-shadow:0 -14px 40px -8px #000d;display:flex;flex-direction:column;z-index:12;border-top:1px solid var(--b3)}
.handle{width:40px;height:4px;border-radius:99px;background:oklch(92% .01 240 / .25);margin:8px auto 4px}
.pchips{display:flex;gap:6px;overflow:hidden;padding:0 12px 8px}
.pchips b{height:32px;border-radius:99px;background:oklch(100% 0 0 / .06);font-size:12px;font-weight:500;padding:0 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:oklch(92% .01 240 / .75)}
.pchips b.on{background:oklch(72% .16 230 / .2);color:var(--p)}
.pchips .div{width:1px;background:var(--b4);margin:6px 2px}
.phone .prow{height:50px}
.phone .srow{height:50px}
.scrim{position:absolute;inset:0;background:#0006;z-index:11}
.lift{position:absolute;z-index:30;left:20px;right:30px;height:52px;border-radius:12px;background:var(--b4);box-shadow:0 16px 30px -6px #000d,0 0 0 1px oklch(72% .16 230 / .6);display:flex;align-items:center;gap:10px;padding:0 12px;transform:rotate(-1.2deg)}
.finger{position:absolute;z-index:31;width:34px;height:34px;border-radius:99px;background:oklch(92% .01 240 / .25);box-shadow:0 0 0 2px oklch(92% .01 240 / .4)}

/* board */
.board{padding:28px;display:flex;flex-direction:column;gap:30px}
.scene{display:flex;flex-direction:column;gap:10px}
.scene h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
.scene p{font-size:13px;color:oklch(92% .01 240 / .65);max-width:900px}
.st{font-size:11px;color:var(--p);font-weight:600}
</style></head>
<body>
<div id="root"></div>
<script>
const I = {
 back:'<path d="M15 18l-6-6 6-6"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/>', media:'<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M10 9l5 2.5-5 2.5z"/>',
 disc:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>', music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
 heart:'<path d="M12 20s-7-4.4-9-9a5 5 0 019-3 5 5 0 019 3c-2 4.6-9 9-9 9z"/>', set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
 folder:'<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>', drive:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15h.01M11 15h6"/>',

const P={};
function ptop(){return `<div class="ptop"><div class="back">${ic('back')}</div><div class="ttl" style="flex:1"><b style="font-size:17px">Queue</b><span class="edtag">Editing</span><small>46 tracks · 7 clashes</small></div><span class="btn pr">Done</span></div>`}
function pprow(t,i,cls=''){const [ti,ar,du,bpm,m]=t;return `<div class="prow ${cls}"><span class="ix num">${i+1}</span><span class="t"><b>${ti}</b><small>${ar} · ${bpm} bpm</small></span>${key(m)}<span class="grip" style="padding:0 4px">${ic('grip','s')}</span></div>`}
function pjoin(j,o={}){const[c,t]=j;return `<div class="join ${o.hov?'hov':''}" style="padding-left:30px">${o.pin?`<span class="pin">${o.pin}</span>`:''}<span class="jc ${c}"><i></i>${t}</span></div>`}
function plist(n=9,o={}){let h='';Q.slice(0,n).forEach((t,i)=>{if(o.insertAt===i)h+=o.insertEl;h+=pprow(t,i,o.hovRow===i?'hov':'');if(i<n-1)h+=pjoin(J[i],{hov:o.hovJoin===i,pin:o.pins?.[i]})});return h}
function dock(on,fitsSub){return `<div class="dock"><b class="${on==='lib'?'on':''}">${ic('drive','s')}Library</b><b class="${on==='on'?'on':''}">${ic('cloud','s')}Online</b><b class="${on==='fits'?'on':''}">${ic('target','s')}Fits<small>${fitsSub}</small></b></div>`}
function phone(body){return `<div class="phone">${ptop()}<div class="pbody">${body}</div></div>`}
