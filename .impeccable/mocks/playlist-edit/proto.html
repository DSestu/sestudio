<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playlist edit mode — decide</title>
<style>
:root{
  --b1:oklch(16% .015 240);--b2:oklch(20% .02 240);--b3:oklch(26% .025 240);--b4:oklch(31% .025 240);
  --tx:oklch(92% .01 240);--p:oklch(72% .16 230);--pink:oklch(80% .07 230 / .9);
  --ok:oklch(76% .17 155);--warn:oklch(83% .16 85);--bad:oklch(68% .19 25);--rel:oklch(78% .13 300);--fifth:oklch(80% .12 200);
  --dark:oklch(62% .2 330);--smooth:oklch(70% .12 190);--float:oklch(78% .1 260);--warm:oklch(76% .14 60);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05080d;color:var(--tx);font:14px/1.43 ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:oklch(72% .16 230 / .35)}
.num{font-variant-numeric:tabular-nums}
.dim{color:oklch(92% .01 240 / .55)}.dimmer{color:oklch(92% .01 240 / .4)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:15px;height:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- desktop frame ---------- */
.desk{width:1440px;height:900px;background:var(--b1);position:relative;overflow:hidden;display:flex;gap:16px;padding:12px 16px 12px 12px}
.rail{width:84px;flex:none;border-radius:16px;background:oklch(20% .02 240 / .6);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.rail .logo{width:28px;height:34px;margin-bottom:10px;color:var(--tx)}
.rail .srch{width:52px;height:52px;border-radius:12px;background:var(--p);color:var(--b1);display:grid;place-items:center;margin-bottom:8px}
.rail .it{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:oklch(92% .01 240 / .7);padding:8px 0;width:64px;border-radius:10px}
.rail .it.on{color:var(--p)}.rail .it.on .ic{background:oklch(72% .16 230 / .18);border-radius:10px;padding:4px 14px}
.rail .grow{flex:1}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.top{height:56px;border-radius:16px;background:var(--b2);border:1px solid var(--b3);display:flex;align-items:center;gap:12px;padding:0 8px 0 8px}
.back{width:38px;height:38px;border-radius:10px;background:var(--b3);display:grid;place-items:center}
.ttl{line-height:1.15}.ttl b{font-size:19px;font-weight:600;letter-spacing:-.02em}.ttl small{display:block;font-size:12px;color:oklch(92% .01 240 / .55)}
.edtag{font-size:11px;font-weight:600;color:var(--p);background:oklch(72% .16 230 / .14);border-radius:99px;padding:3px 9px;margin-left:6px;vertical-align:3px}
.top .sp{flex:1}
.btn{height:32px;border-radius:6px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.btn.pr{background:var(--p);color:oklch(18% .05 230)}.btn.gh{color:oklch(92% .01 240 / .8)}.btn.gh:hover{background:var(--b3)}
.btn.soft{background:oklch(72% .16 230 / .14);color:var(--p)}
.undo{font-size:12px}

.cols{flex:1;min-height:0;display:grid;grid-template-columns:352px minmax(0,1fr) 372px;gap:12px}
.col{min-height:0;border-radius:16px;background:oklch(20% .02 240 / .55);display:flex;flex-direction:column;overflow:hidden;position:relative}
.colh{padding:12px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid oklch(26% .025 240 / .7)}
.colh .row1{display:flex;align-items:center;gap:8px}
.h{font-size:15px;font-weight:600;letter-spacing:-.02em}
.seg{display:inline-flex;background:oklch(100% 0 0 / .05);border-radius:99px;padding:2px}
.seg b{font-weight:500;font-size:12px;height:28px;padding:0 13px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;color:oklch(92% .01 240 / .7)}
.seg b.on{background:oklch(72% .16 230 / .2);color:var(--p)}
.field{height:34px;border-radius:8px;background:var(--b1);border:1px solid var(--b3);display:flex;align-items:center;gap:8px;padding:0 10px;font-size:13px;color:oklch(92% .01 240 / .45)}
.field.live{border-color:oklch(72% .16 230 / .8);box-shadow:0 0 0 3px oklch(72% .16 230 / .15);color:var(--tx)}
.crumbs{display:flex;align-items:center;gap:4px;font-size:12.5px;flex-wrap:wrap}
.crumbs a{color:oklch(92% .01 240 / .6);padding:2px 5px;border-radius:5px}.crumbs a:hover{background:var(--b3)}
.crumbs .sep{color:oklch(92% .01 240 / .3)}.crumbs .cur{color:var(--tx);font-weight:600;padding:2px 5px}
.scroll{flex:1;min-height:0;overflow:hidden;padding:6px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.02em;color:oklch(92% .01 240 / .45);padding:10px 8px 6px;display:flex;align-items:center;gap:8px}
.lbl .r{margin-left:auto;font-weight:500;letter-spacing:0}

/* source rows */
.srow{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px;border-radius:9px;position:relative}
.srow:hover,.srow.hov{background:oklch(100% 0 0 / .05)}
.srow.hov{box-shadow:inset 0 0 0 1px oklch(72% .16 230 / .45);background:oklch(72% .16 230 / .08)}
.srow .grip{color:oklch(92% .01 240 / .25);width:12px}
.srow .t{flex:1;min-width:0;line-height:1.2}.srow .t b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .du{font-size:12px;color:oklch(92% .01 240 / .5);width:36px;text-align:right}
.fold{width:30px;height:30px;border-radius:7px;background:var(--b3);display:grid;place-items:center;color:oklch(92% .01 240 / .7);flex:none}
.fold.lib{background:oklch(72% .16 230 / .14);color:var(--p)}
.cnt{font-size:12px;color:oklch(92% .01 240 / .45)}
.chev{color:oklch(92% .01 240 / .3)}
.inpl{font-size:10.5px;color:var(--ok);background:oklch(76% .17 155 / .12);border-radius:99px;padding:2px 7px;white-space:nowrap}
.drawer{position:absolute;right:6px;top:7px;display:flex;gap:4px}
.drawer b{height:30px;border-radius:7px;background:var(--b4);display:inline-flex;align-items:center;gap:5px;padding:0 9px;font-weight:500;font-size:12px}
.drawer b.pr{background:var(--p);color:oklch(18% .05 230)}
.ldot{width:8px;height:8px;border-radius:99px;background:var(--ok);flex:none}

.key{display:inline-flex;align-items:center;gap:5px;font-size:11px;border-radius:5px;background:oklch(100% 0 0 / .07);padding:2px 6px;color:oklch(92% .01 240 / .75);white-space:nowrap}
.key i{width:8px;height:8px;border-radius:99px;display:inline-block}
.bpm{font-size:11.5px;color:oklch(92% .01 240 / .45);white-space:nowrap}
.gen{font-size:11px;color:var(--smooth);border:1px solid oklch(70% .12 190 / .45);border-radius:99px;padding:1px 7px;white-space:nowrap}
.na{font-size:11px;color:oklch(92% .01 240 / .4);font-style:normal;white-space:nowrap}

/* playlist */
.plh{padding:12px 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid oklch(26% .025 240 / .7)}
.plh .meta{font-size:12.5px;color:oklch(92% .01 240 / .55)}
.chip{font-size:12px;border-radius:99px;padding:2px 9px;white-space:nowrap}
.chip.warn{background:oklch(83% .16 85 / .14);color:var(--warn)}
.curve{height:46px;margin:8px 16px 4px;border-radius:10px;background:var(--b1);position:relative;overflow:hidden}
.prow{display:flex;align-items:center;gap:10px;height:46px;padding:0 10px 0 6px;border-radius:9px;position:relative}
.prow:hover,.prow.hov{background:oklch(100% 0 0 / .05)}
.prow.lifted{opacity:.35}
.prow .ix{width:20px;text-align:right;font-size:11.5px;color:oklch(92% .01 240 / .35)}
.prow .t{flex:1;min-width:0;line-height:1.2}.prow .t b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5)}
.prow .du{font-size:12px;color:oklch(92% .01 240 / .55);width:38px;text-align:right}
.prow .grip{color:oklch(92% .01 240 / .25)}
.prow.now .t b{color:var(--p)}
.join{height:22px;display:flex;align-items:center;gap:8px;padding-left:36px;position:relative}
.join::before{content:"";position:absolute;left:26px;right:14px;top:50%;height:1px;background:oklch(26% .025 240 / .9)}
.jc{position:relative;font-size:11px;border-radius:99px;padding:1px 8px;background:var(--b2);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 0 0 3px var(--b2)}
.jc i{width:6px;height:6px;border-radius:99px;display:inline-block}
.jc.m{color:var(--ok)}.jc.m i{background:var(--ok)}
.jc.f{color:var(--fifth)}.jc.f i{background:var(--fifth)}
.jc.r{color:var(--rel)}.jc.r i{background:var(--rel)}
.jc.c{color:var(--warn)}.jc.c i{background:var(--warn)}
.jc.x{color:var(--bad)}.jc.x i{background:var(--bad)}
.jc .sub{color:oklch(92% .01 240 / .45)}
.join.hov::before{background:oklch(72% .16 230 / .7);height:2px}
.join.hov .jc{box-shadow:0 0 0 1px oklch(72% .16 230 / .7),0 0 0 4px var(--b2)}
.pin{position:relative;width:18px;height:18px;border-radius:99px;background:var(--p);color:oklch(18% .05 230);font-size:11px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px var(--b2)}
.pin.g{background:oklch(72% .16 230 / .25);color:var(--p)}
.ghostline{height:0;position:relative;margin:0 14px 0 26px}
.ins{height:50px;margin:2px 4px;border-radius:10px;border:1.5px dashed oklch(72% .16 230 / .75);background:oklch(72% .16 230 / .07);display:flex;align-items:center;gap:10px;padding:0 10px;position:relative}
.ins .t b{font-size:13.5px;font-weight:500}.ins .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5)}
.dragcard{position:absolute;z-index:20;width:300px;height:48px;border-radius:10px;background:var(--b4);box-shadow:0 14px 30px -6px #000c,0 0 0 1px oklch(72% .16 230 / .6);display:flex;align-items:center;gap:10px;padding:0 10px;transform:rotate(-1.5deg)}
.dragcard .t b{font-size:13px;font-weight:500;display:block}.dragcard .t small{font-size:11px;color:oklch(92% .01 240 / .55)}
.cursor{position:absolute;z-index:21;width:18px;height:22px}

/* fits */
.fh{padding:12px 14px 10px;border-bottom:1px solid oklch(26% .025 240 / .7);display:flex;flex-direction:column;gap:8px}
.follow{display:flex;align-items:center;gap:7px;font-size:11.5px;color:oklch(92% .01 240 / .5)}
.follow .dot{width:7px;height:7px;border-radius:99px;background:var(--p);box-shadow:0 0 0 3px oklch(72% .16 230 / .2)}
.follow .pinb{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:7px;color:oklch(92% .01 240 / .7);background:oklch(100% 0 0 / .05)}
.follow .pinb.on{color:var(--p);background:oklch(72% .16 230 / .15)}
.about{display:flex;align-items:center;gap:10px}
.about .art{width:40px;height:40px;border-radius:7px;background:var(--b3);flex:none;background-size:cover;background-position:center}
.about .t{min-width:0;flex:1;line-height:1.25}.about .t b{font-size:15px;font-weight:600;letter-spacing:-.015em;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.about .t small{font-size:12px;color:oklch(92% .01 240 / .55)}
.frow{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;position:relative}
.frow:hover{background:oklch(100% 0 0 / .05)}
.frow .t{flex:1;min-width:0;line-height:1.28}.frow .t b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.why{font-size:11.5px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.why i{width:7px;height:7px;border-radius:99px;display:inline-block}
.src{font-size:10.5px;border-radius:4px;padding:1px 5px;background:oklch(100% 0 0 / .07);color:oklch(92% .01 240 / .6)}
.plus{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--p)}
.spot{border-radius:10px;background:oklch(100% 0 0 / .035);padding:10px 12px;display:flex;gap:10px;align-items:flex-start;margin:0 6px 6px}
.spot.best{background:oklch(72% .16 230 / .09);box-shadow:inset 0 0 0 1px oklch(72% .16 230 / .35)}
.spot .t{flex:1;min-width:0}.spot .t b{font-size:13px;font-weight:500;display:block}
.spot .t small{font-size:12px;color:oklch(92% .01 240 / .55);display:block;margin-top:2px}
.spot .lines{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.verdict{margin:10px 6px 8px;padding:12px;border-radius:12px;background:oklch(100% 0 0 / .04)}
.verdict .vh{font-size:13px;font-weight:600;margin-bottom:8px}
.vline{display:grid;grid-template-columns:86px 1fr;gap:6px;font-size:12.5px;padding:3px 0}
.vline span:first-child{color:oklch(92% .01 240 / .5)}
.bar{height:6px;border-radius:99px;background:var(--b3);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.tip{font-size:12px;color:oklch(92% .01 240 / .55);padding:4px 10px 10px}

/* online */
.oart{width:44px;height:44px;border-radius:6px;background:var(--b3) center/cover;flex:none}
.orow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;position:relative}
.orow.hov{background:oklch(72% .16 230 / .08);box-shadow:inset 0 0 0 1px oklch(72% .16 230 / .45)}
.orow .t{flex:1;min-width:0;line-height:1.25}.orow .t b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .t small{display:block;font-size:11.5px;color:oklch(92% .01 240 / .5)}
.orow .facts{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.anl{height:28px;border-radius:7px;border:1px solid oklch(72% .16 230 / .5);color:var(--p);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:0 9px;white-space:nowrap}
.prog{display:flex;flex-direction:column;gap:3px;font-size:11px;width:118px}
.prog .st{display:flex;align-items:center;gap:5px;color:oklch(92% .01 240 / .5)}
.prog .st.done{color:var(--ok)}.prog .st.run{color:var(--p)}
.spin{width:10px;height:10px;border-radius:99px;border:2px solid oklch(72% .16 230 / .3);border-top-color:var(--p);display:inline-block}
.srail{width:88px;flex:none;border-right:1px solid oklch(26% .025 240 / .7);padding:6px;display:flex;flex-direction:column;gap:3px}
.stop{border-radius:9px;padding:8px;font-size:12px;line-height:1.2;color:oklch(92% .01 240 / .7)}
.stop b{display:block;font-weight:500;font-size:12.5px}.stop small{font-size:11px;color:oklch(92% .01 240 / .45)}
.stop.on{background:oklch(72% .16 230 / .14);color:var(--p)}.stop.on small{color:oklch(72% .16 230 / .75)}
.stopdiv{font-size:10px;color:oklch(92% .01 240 / .35);padding:6px 8px 2px;letter-spacing:.04em}

.note{position:absolute;z-index:40;background:oklch(83% .16 85);color:#1a1405;font-size:12px;font-weight:600;border-radius:8px;padding:6px 9px;max-width:230px;line-height:1.3;box-shadow:0 8px 20px -6px #000a}
.note:before{content:attr(data-n);display:inline-grid;place-items:center;width:17px;height:17px;border-radius:99px;background:#1a1405;color:oklch(83% .16 85);font-size:10.5px;margin-right:6px;vertical-align:1px}

/* ---------- phone ---------- */
.phone{width:390px;height:844px;background:var(--b1);position:relative;overflow:hidden;display:flex;flex-direction:column}
.ptop{margin:10px 12px 0;height:56px;border-radius:16px;background:var(--b2);border:1px solid var(--b3);display:flex;align-items:center;gap:10px;padding:0 8px;flex:none}
.pbody{flex:1;min-height:0;overflow:hidden;padding:8px 8px 0;position:relative}
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:62px;border-radius:20px;background:oklch(26% .025 240 / .92);backdrop-filter:blur(12px);display:flex;align-items:center;padding:6px;gap:6px;box-shadow:0 10px 30px -8px #000c;z-index:10}
.dock b{flex:1;height:50px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:oklch(92% .01 240 / .75)}
.dock b.on{background:oklch(72% .16 230 / .18);color:var(--p)}
.dock b small{font-size:10px;color:oklch(92% .01 240 / .45);max-width:100px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dock b.on small{color:oklch(72% .16 230 / .7)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--b2);border-radius:20px 20px 0 0;box-shadow:0 -14px 40px -8px #000d;display:flex;flex-direction:column;z-index:12;border-top:1px solid var(--b3)}
.handle{width:40px;height:4px;border-radius:99px;background:oklch(92% .01 240 / .25);margin:8px auto 4px}
.pchips{display:flex;gap:6px;overflow:hidden;padding:0 12px 8px}
.pchips b{height:32px;border-radius:99px;background:oklch(100% 0 0 / .06);font-size:12px;font-weight:500;padding:0 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:oklch(92% .01 240 / .75)}
.pchips b.on{background:oklch(72% .16 230 / .2);color:var(--p)}
.pchips .div{width:1px;background:var(--b4);margin:6px 2px}
.phone .prow{height:50px}
.phone .srow{height:50px}
.scrim{position:absolute;inset:0;background:#0006;z-index:11}
.lift{position:absolute;z-index:30;left:20px;right:30px;height:52px;border-radius:12px;background:var(--b4);box-shadow:0 16px 30px -6px #000d,0 0 0 1px oklch(72% .16 230 / .6);display:flex;align-items:center;gap:10px;padding:0 12px;transform:rotate(-1.2deg)}
.finger{position:absolute;z-index:31;width:34px;height:34px;border-radius:99px;background:oklch(92% .01 240 / .25);box-shadow:0 0 0 2px oklch(92% .01 240 / .4)}

/* board */
.board{padding:28px;display:flex;flex-direction:column;gap:30px}
.scene{display:flex;flex-direction:column;gap:10px}
.scene h2{font-size:18px;font-weight:600;letter-spacing:-.02em}
.scene p{font-size:13px;color:oklch(92% .01 240 / .65);max-width:900px}
.st{font-size:11px;color:var(--p);font-weight:600}
</style>
<style>
html,body{height:100%;overflow:hidden;background:var(--b1)}
.cols.two{grid-template-columns:260px minmax(0,1fr)}
.cols.two.fits{grid-template-columns:260px minmax(0,1fr) 372px}
.scroll{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--b4) transparent}
[data-h]{cursor:default}
.srow[data-drag],.frow[data-drag],.orow[data-drag],.prow[data-drag]{cursor:grab}
.srow.nodrag{cursor:not-allowed}
.srow.folder{cursor:pointer}
.srow .x,.prow .x{opacity:0;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:oklch(92% .01 240 / .5)}
.prow:hover .x{opacity:1}.prow .x:hover{background:var(--b4);color:var(--bad)}
.srow:hover .drawer,.orow:hover .drawer{display:flex}
.drawer{display:none}
.srow .drawer{top:7px}
.orow .drawer{top:50%;transform:translateY(-50%)}
.prev{box-shadow:inset 0 0 0 1px oklch(72% .16 230 / .3)}
.tgt{box-shadow:inset 0 0 0 1px oklch(72% .16 230 / .6);background:oklch(72% .16 230 / .08)}
.join[data-h]{cursor:pointer}
.join.tgt{background:none;box-shadow:none}
.join.tgt::before{background:oklch(72% .16 230 / .8);height:2px}
.join.tgt .jc{box-shadow:0 0 0 1px oklch(72% .16 230 / .8),0 0 0 4px var(--b2)}

const parent=t=>t.tonic==null?null:((PC[t.tonic]-OFF[t.mode])%12+12)%12;
const known=t=>t&&t.tonic!=null&&t.bpm!=null;
function rel(a,b){ // join kind a -> b
  if(!known(a)||!known(b)) return {k:'u',txt:'Not analysed',s:.5};
  const pa=parent(a),pb=parent(b),d=((pb-pa)%12+12)%12;
  let r;
  if(d===0) r=a.tonic===b.tonic&&a.mode===b.mode?{k:'m',txt:'Same key',s:1}:{k:'r',txt:'Relative',s:.85};
  else if(d===7) r={k:'f',txt:'Up a fifth',s:.8};
  else if(d===5) r={k:'f',txt:'Down a fifth',s:.8};
  else if(d===2||d===10) r={k:'c',txt:'Clash',s:.3};
  else r={k:'x',txt:'Break',s:0};
  const dt=b.bpm-a.bpm;r.dt=dt;
  if(Math.abs(dt)/a.bpm>.06){r.tempo=`tempo ${dt>0?'+':''}${dt}`;r.s-=.45}else if(Math.abs(dt)>2) r.tempo=`tempo ${dt>0?'+':''}${dt}`;
  const de=(b.energy??0)-(a.energy??0);r.de=de;
  if(de>=6) r.energy=`energy lifts ${a.energy} → ${b.energy}`;else if(de<=-8) r.energy=`energy eases ${a.energy} → ${b.energy}`;
  return r;
}

function stateBits(t){

function curve(){const e=S.q.map(i=>T.get(i).energy??70);const w=100/Math.max(1,e.length-1);let p='';e.forEach((v,i)=>p+=`${i?'L':'M'}${(i*w).toFixed(2)} ${(44-(v-55)*.95).toFixed(1)} `);
 let marks='';for(let i=0;i<S.q.length-1;i++){const r=rel(T.get(S.q[i]),T.get(S.q[i+1]));if(r.k==='c'||r.k==='x')marks+=`<line x1="${(i+.5)*w}" x2="${(i+.5)*w}" y1="0" y2="46" stroke="oklch(83% .16 85 / .7)" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/>`}
 return `<div class="curve"><svg viewBox="0 0 100 46" preserveAspectRatio="none" style="width:100%;height:100%"><path d="${p}" fill="none" stroke="oklch(92% .01 240 / .8)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>${marks}</svg><span style="position:absolute;right:10px;top:6px;font-size:10.5px" class="dimmer">energy</span></div>`}
function hl(kind,v){const key=kind+':'+v;if(S.target&&tk(S.target)===key) return 'tgt';if(S.preview===key) return 'prev';return ''}
const tk=t=>t?t.k+':'+(t.id??t.i??''):'';
function joinHTML(i,a,b,pins){const r=rel(a,b);const pend=a.state==='run'||b.state==='run';

 return `<div class="join ${hl('join',i)}" data-h="join:${i}">${pin}<span class="jc ${pend?'u':r.k}">${pend?'<span class="spin" style="width:8px;height:8px"></span> analysing':`<i></i>${r.txt}`}${!pend&&(r.tempo||r.energy)?` <span class="sub">· ${r.tempo||r.energy}</span>`:''}</span>${r.k==='u'&&!pend?`<button class="jc" style="color:var(--p)" data-a="analyseQ" data-v="${i}">${ic('wave','s')} Analyse</button>`:''}</div>`}
function insHTML(){const d=S.drag,t=T.get(d.id);const ok=dropOk(t);
 return `<div class="ins ${ok?'':'no'}"><span class="grip" style="color:var(--${ok?'p':'bad'})">${ic(ok?'plus':'ban','s')}</span><span class="t"><b>${esc(t.title)}</b><small>${ok?`drops here as track ${d.gap+1}`:'Analyse it first: this choice keeps unanalysed tracks out'}</small></span><span style="flex:1"></span>${keyChip(t)}<span class="bpm">${t.bpm?t.bpm+' bpm':''}</span></div>`}
function playlistCol(edit){const pins={};
 const pinSrc=(S.target?.k==='track'&&!S.drag)?S.target.id:(S.preview?.startsWith('track:')&&S.opts.q1==='C'&&!S.drag?S.preview.slice(6):null);
 if(edit&&pinSrc&&known(T.get(pinSrc))) spotsFor(T.get(pinSrc)).forEach((s,n)=>pins[s.g]=n);
 let q=S.q.slice();let dragFrom=-1;
 if(S.drag?.from!=null){dragFrom=S.drag.from}
 let h=`<div class="plh"><span class="h" style="font-size:16px">Queue</span><span class="meta num">${S.q.length} tracks · ${fmtLong(total(S.q))}</span>${clashes(S.q)?`<span class="chip warn">${clashes(S.q)} clashes</span>`:''}<span style="flex:1"></span><span class="seg"><b class="on">List</b><b>Map</b></span></div>${curve()}<div class="scroll" id="sc-pl" style="padding:4px 8px 40px">`;
 const showGap=S.drag&&S.drag.gap!=null;
 q.forEach((id,i)=>{const t=T.get(id);
  if(showGap&&S.drag.gap===i) h+=insHTML();
  else if(edit&&pins[i]!=null&&i>0) {/* pin shown on join */}
  h+=`<div class="prow ${i===0?'now':''} ${hl('row',i)} ${dragFrom===i?'lifted':''}" data-h="row:${i}" ${edit?`data-drag="${id}" data-from="${i}"`:''}>${edit?`<span class="grip">${ic('grip','s')}</span>`:''}<span class="ix num">${i+1}</span>
   <span class="t"><b>${esc(t.title)}</b><small>${esc(t.artist||'Unknown artist')}${t.online?` · ${srcBadge(t)}`:''}</small></span>${t.genre?'<span class="gen">DnB</span>':''}${t.state==='run'?'<span class="na">analysing…</span>':keyChip(t)}<span class="bpm num">${t.bpm?t.bpm+' bpm':''}</span><span class="du num">${fmt(t.dur)}</span>${edit?`<button class="x" data-a="remove" data-v="${i}" title="Remove">${ic('x','s')}</button>`:''}</div>`;
  if(i<q.length-1&&!(showGap&&S.drag.gap===i+1)) h+=joinHTML(i,t,T.get(q[i+1]),edit?pins:{});
 });
 if(showGap&&S.drag.gap===q.length) h+=insHTML();
 if(edit&&pins[q.length]!=null) h+=`<div class="join"><span class="pin ${pins[q.length]?'g':''}">${pins[q.length]+1}</span><span class="jc u">at the end</span></div>`;

// fits column
function fitsCol(){const t=S.drag?{k:'drop'}:(S.target||{k:'end'});
 const pinBtn=`<button class="pinb ${S.pinned?'on':''}" data-a="pin">${ic('pin','s')}${S.pinned?'Pinned':'Pin'}</button>`;
 const follow=S.drag?'Drop preview':S.pinned?'Pinned':S.opts.q1==='C'?'Showing what you clicked':(S.target?'Following your pointer':'Resting · after the last track');
 const head=(about,extra='')=>`<div class="fh"><div class="follow">${S.pinned?ic('pin','s'):'<span class="dot"></span>'}<span>${follow}</span>${S.drag?'':pinBtn}</div>${about}${extra}</div>`;
 const list=(rows)=>rows.map(o=>`<div class="frow" data-drag="${o.x.id}">${o.x.online?`<span class="oart" style="width:36px;height:36px;background-image:url(${o.x.art})"></span>`:`<span class="grip" style="color:oklch(92% .01 240 / .25)">${ic('grip','s')}</span>`}<span class="t"><b>${esc(o.x.title)}</b><small>${esc(o.x.artist||'Unknown artist')} · ${srcBadge(o.x)}</small>${o.r2?whyPair(o.r1,o.r2):why(o.r1)}</span><button class="plus" data-a="${o.at!=null?'insert':'add'}" data-v="${o.x.id}" ${o.at!=null?`data-at="${o.at}"`:''}>${ic('plus')}</button></div>`).join('');
 if(t.k==='drop'){const d=S.drag,x=T.get(d.id);
  if(d.gap==null) return head(`<div class="about"><span class="t"><b>${esc(x.title)}</b><small>Move over the playlist to pick a slot</small></span></div>`)+`<div class="scroll"><div class="tip">Release outside the playlist to cancel.</div></div>`;
  if(!dropOk(x)) return head(`<div class="about"><span class="t"><b>${esc(x.title)}</b><small>not analysed</small></span></div>`)+`<div class="scroll"><div class="verdict"><div class="vh" style="color:var(--bad)">Can't drop yet</div><div class="tip" style="padding:0">With "Analyse first", a track joins only once its tempo and key are known. Release, press Analyse, then drag it again.</div></div></div>`;
  const q2=S.q.filter((_,i)=>i!==d.from);let g=d.gap;if(d.from!=null&&d.from<d.gap) g--;q2.splice(g,0,x.id);
  const a=T.get(q2[g-1]),b=T.get(q2[g+1]);const ri=a&&rel(a,x),ro=b&&rel(x,b);
  const good=[ri,ro].filter(Boolean).every(r=>r.s>=.8),unk=[ri,ro].some(r=>r&&r.k==='u');
  const best=known(x)?spotsFor(x)[0]:null;
  return head(`<div class="about"><span class="t"><b>${esc(x.title)} → slot ${g+1}</b><small>${a?'after '+esc(a.title):'at the start'}${b?' · before '+esc(b.title):' · at the end'}</small></span></div>`)+
  `<div class="scroll"><div class="verdict"><div class="vh" style="color:var(--${unk?'tx':good?'ok':'warn'})">${unk?(S.opts.q3==='B'?'Drops now; analysis starts on drop':'Drops now; joins stay grey until you analyse'):good?'Good drop: both joins hold':'This drop makes a rough join'}</div>
  ${ri?`<div class="vline"><span>In</span>${why(ri)}</div>`:''}${ro?`<div class="vline"><span>Out</span>${why(ro)}</div>`:''}
  <div class="vline"><span>Clashes</span><span class="num">${clashes(S.q)} → ${clashes(q2)}</span></div><div class="vline"><span>Length</span><span class="num">${fmtLong(total(S.q))} → ${fmtLong(total(q2))}</span></div></div>
  ${best&&best.g!==d.gap?`<div class="lbl">Better nearby</div><div class="tip">Slot ${best.g+1} scores higher (${best.ri?best.ri.txt.toLowerCase():'start'} in, ${best.ro?best.ro.txt.toLowerCase():'end'} out).</div>`:''}</div>`}
 if(t.k==='track'){const x=T.get(t.id);
  const about=`<div class="about">${x.online?`<span class="art" style="background-image:url(${x.art})"></span>`:`<span class="art" style="display:grid;place-items:center">${ic('music')}</span>`}<span class="t"><b>${esc(x.title)}</b><small>${esc(x.artist||'Unknown artist')} · ${x.online?x.src:x.lib}${known(x)?` · ${x.bpm} bpm`:''}</small></span></div>`;
  if(!known(x)) return head(about)+`<div class="scroll"><div class="verdict"><div class="vh">${x.state==='run'?'Analysing…':'Where would it fit? Analyse it first.'}</div><div class="tip" style="padding:0 0 10px">Tempo, key and energy. About 20 s for a 4 min track (sped up here). It stays analysed and ranks in Fits like your own files.</div>${x.state==='run'?stateBits(x):`<button class="btn pr" data-a="analyse" data-v="${x.id}">${ic('wave','s')} Analyse ${esc(x.title)}</button>`}</div>
   <div class="lbl">Meanwhile</div><div class="tip">${{A:'You can drop it in now; its joins stay grey with an Analyse button.',B:'You can drop it in now; analysis starts by itself on drop.',C:'It can\'t go in until it is analysed.'}[S.opts.q3]}</div></div>`;
  const seg=`<span class="seg"><b class="${S.mode==='where'?'on':''}" data-a="mode" data-v="where">Where it fits</b><b class="${S.mode==='after'?'on':''}" data-a="mode" data-v="after">What fits after it</b></span>`;
  if(S.mode==='after') return head(about,seg)+`<div class="scroll">${list(fitsAfter(x).filter(o=>o.x.id!==x.id))}</div>`;
  const sp=spotsFor(x);
  return head(about,seg)+`<div class="scroll"><div class="lbl">Best places in Queue</div>${sp.map((s,n)=>{const a=T.get(S.q[s.g-1]),b=T.get(S.q[s.g]);
   return `<div class="spot ${n?'':'best'}"><span class="pin ${n?'g':''}">${n+1}</span><span class="t"><b>${a&&b?`Between ${s.g} ${esc(a.title)} and ${s.g+1} ${esc(b.title)}`:a?'At the end':'At the start'}</b><span class="lines">${s.ri?why(s.ri,'In: '):''}${s.ro?why(s.ro,'Out: '):''}</span>${s.old&&(s.old.k==='c'||s.old.k==='x')&&s.v>.9?'<small>Replaces a rough join with two good ones.</small>':''}</span><button class="btn soft" data-a="insert" data-v="${x.id}" data-at="${s.g}" style="height:28px">Put here</button></div>`}).join('')}</div>`}
 if(t.k==='join'){const a=T.get(S.q[t.i]),b=T.get(S.q[t.i+1]);if(!a||!b){S.target=null;return fitsCol()}const r=rel(a,b);
  return head(`<div class="about"><span class="t"><b>Between ${t.i+1} ${esc(a.title)} and ${t.i+2} ${esc(b.title)}</b><small>today: <span style="color:var(--${KCLS[r.k]==='u'?'tx':KCLS[r.k]})">${r.txt.toLowerCase()}</span></small></span></div>`)+
   `<div class="scroll"><div class="lbl">Bridges this join · all sources</div>${list(fitsAfter(a,b).map(o=>({...o,at:t.i+1})))}</div>`}
 const i=t.k==='row'?t.i:S.q.length-1;const a=T.get(S.q[i]);if(!a){S.target=null;return fitsCol()}
 return head(`<div class="about"><span class="t"><b>After ${i+1} ${esc(a.title)}</b><small>${keyChip(a)} ${a.bpm??''} bpm · energy ${a.energy??'?'}</small></span></div>`)+
  `<div class="scroll"><div class="lbl">Fits next</div>${list(fitsAfter(a).map(o=>({...o,at:i+1})))}</div>`}

const app=document.getElementById('app');
function render(){const sc={};app.querySelectorAll('.scroll[id]').forEach(e=>sc[e.id]=e.scrollTop);
 const focus=document.activeElement?.id,sel=document.activeElement?.selectionStart;
 const ed=inEdit();
 let cols;

 else cols=`<div class="cols two ${S.fitsOpen?'fits':''}"><section class="col">${navCol()}</section><section class="col">${playlistCol(false)}</section>${S.fitsOpen?`<section class="col" data-zone="fits">${fitsCol()}</section>`:''}</div>`;
 app.innerHTML=`<div class="shell"><div class="desk">${rail()}<div class="main">${topBar()}${cols}</div></div>${decide()}</div>${S.toast?`<div class="toast">${S.toast.text}${S.toast.undo?'<button data-a="undo">Undo</button>':''}</div>`:''}`;
 app.querySelectorAll('.scroll[id]').forEach(e=>{if(sc[e.id]!=null)e.scrollTop=sc[e.id]});

let toastT;function toast(text,undo){S.toast={text,undo};clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render()},3500)}

// ---------- actions ----------
const snap=()=>{S.undo.push(S.q.slice());if(S.undo.length>50)S.undo.shift()};
const dragOk=t=>!(S.opts.q3==='C'&&!known(t)&&t.state!=='done');
const dropOk=t=>dragOk(t);
function insertAt(id,g,from){snap();if(from!=null){S.q.splice(from,1);if(from<g)g--}else if(inQ(id)){const j=S.q.indexOf(id);S.q.splice(j,1);if(j<g)g--}
 S.q.splice(g,0,id);const t=T.get(id);if(!known(t)&&S.opts.q3==='B'&&t.state==='none') analyse(id);
 toast(`${from!=null?'Moved':'Added'} <b>${esc(t.title)}</b> as track ${g+1}`,true)}
function analyse(id){const t=T.get(id);if(t.state!=='none')return;t.state='run';t.step=0;render();
 const tick=()=>{t.step++;if(t.step>=3){Object.assign(t,t.an,{state:'done'});if(t.then!=null){const g=t.then==='last'?S.q.length:t.then;delete t.then;insertAt(id,g)}render();return}render();setTimeout(tick,900)};setTimeout(tick,900)}
function setTarget(tg){if(S.pinned||S.drag)return;if(tk(tg)===tk(S.target))return;S.target=tg;render()}

app.addEventListener('click',e=>{const el=e.target.closest('[data-a]');
 if(!el){ // click-to-target (Q1 C)
  if(S.opts.q1==='C'){const h=e.target.closest('[data-h]');if(h&&!h.closest('[data-zone="fits"]')){const [k,v]=h.dataset.h.split(':');S.pinned=false;S.target=k==='track'?{k,id:v}:{k,i:+v};render()}}
  return}
 const a=el.dataset.a,v=el.dataset.v;e.stopPropagation();
 ({
  tab:()=>{S.tab=v;S.filter=''},go:()=>{S.path=v?JSON.parse(v):[];S.filter=''},src:()=>{S.src=v},
  add:()=>{const t=T.get(v);if(!dragOk(t)){t.then='last';analyse(v);toast(`Analysing <b>${esc(t.title)}</b>, it goes in when done`);return}insertAt(v,S.q.length)},
  next:()=>insertAt(v,1),
  insert:()=>{const t=T.get(v);if(!dragOk(t)){t.then=+el.dataset.at;analyse(v);return}insertAt(v,+el.dataset.at)},
  remove:()=>{snap();const t=T.get(S.q[+v]);S.q.splice(+v,1);S.target=null;toast(`Removed <b>${esc(t.title)}</b>`,true)},
  undo:()=>{if(S.undo.length){S.q=S.undo.pop();S.toast=null}},
  analyse:()=>analyse(v),analyseAll:()=>ONLINE[S.src].forEach(o=>analyse(o.id)),
  analyseQ:()=>{const i=+v;[S.q[i],S.q[i+1]].forEach(id=>{const t=T.get(id);if(t.state==='none')analyse(id)})},
  pin:()=>{S.pinned=!S.pinned;if(!S.pinned&&S.opts.q1==='B')S.target=null},
  mode:()=>{S.mode=v},edit:()=>{S.editing=true;S.fitsOpen=false},done:()=>{S.editing=false;S.target=null;S.pinned=false},
  fitsnext:()=>{S.fitsOpen=!S.fitsOpen},play:()=>toast('Playback is not part of this prototype'),soon:()=>toast('Other playlists open the same way; not wired in this prototype'),
  opt:()=>{S.opts[el.dataset.k]=v;save();S.target=null;S.pinned=false;S.preview=null},
  panel:()=>{S.panelMin=!S.panelMin},
  copy:()=>{const txt=Q.map(q=>`${q.h}: ${S.opts[q.k]} — ${q.o.find(o=>o[0]===S.opts[q.k])[1]}`).join('\n');navigator.clipboard?.writeText(txt).then(()=>toast('Copied, paste it in the chat'),()=>toast(txt.replace(/\n/g,'<br>')))},
  reset:()=>{S.q=DATA.queue.slice();S.undo=[];S.target=null},
 }[a]||(()=>{}))();
 render()});
app.addEventListener('input',e=>{if(e.target.id==='filter'){S.filter=e.target.value;render()}if(e.target.id==='oq'){S.oq=e.target.value;render()}});

// hover logic per Q1
let hT,leaveT,curH=null;
app.addEventListener('pointerover',e=>{if(S.drag)return;const h=e.target.closest('[data-h]');
 const inFits=!!e.target.closest('[data-zone="fits"]');if(inFits||e.target.closest('.decide')){clearTimeout(hT);return}
 const key=h?.dataset.h??null;if(key===curH)return;curH=key;clearTimeout(hT);
 if(!inEdit()&&!S.fitsOpen)return;
 const tg=key?(([k,v])=>k==='track'?{k,id:v}:{k,i:+v})(key.split(':')):null;
 const q1=S.opts.q1;
 if(q1==='A'){if(tg)hT=setTimeout(()=>setTarget(tg),250)}
 else if(q1==='B'){clearTimeout(leaveT);if(tg)setTarget(tg);else leaveT=setTimeout(()=>{if(!S.pinned){S.target=null;render()}},500)}
 else{const p=key;if(p!==S.preview){S.preview=p;render()}}
});

// ---------- drag (pointer based) ----------
let down=null,ghost=null,raf=0;
app.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button,input,[data-a]'))return;const r=e.target.closest('[data-drag]');
 const blocked=e.target.closest('.srow.nodrag,.orow:not([data-drag])');
 if(blocked&&!r){const id=blocked.dataset.h?.split(':')[1];down={blocked:id,x:e.clientX,y:e.clientY};return}
 if(!r||!inEdit())return;down={id:r.dataset.drag,from:r.dataset.from!=null?+r.dataset.from:null,x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(!down)return;
 if(!S.drag){if(Math.hypot(e.clientX-down.x,e.clientY-down.y)<5)return;
  if(down.blocked){toast(`Analyse <b>${esc(T.get(down.blocked).title)}</b> first: with pick 3C, only analysed tracks go in`);render();down=null;return}
  S.drag={id:down.id,from:down.from,gap:null};document.body.classList.add('dragging');clearTimeout(hT);
  const t=T.get(down.id);ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=`<span class="grip" style="color:var(--p)">${ic('grip','s')}</span><span class="t"><b>${esc(t.title)}</b><small>${esc(t.artist||'Unknown artist')}${t.bpm?' · '+t.bpm+' bpm':''}</small></span>`;document.body.appendChild(ghost);
  const loop=()=>{if(!S.drag)return;const sc=document.getElementById('sc-pl');if(sc&&S.drag.py){const r=sc.getBoundingClientRect();if(S.drag.px>r.left&&S.drag.px<r.right){if(S.drag.py<r.top+50)sc.scrollTop-=10;else if(S.drag.py>r.bottom-50)sc.scrollTop+=10}}raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop)}
 ghost.style.left=e.clientX+12+'px';ghost.style.top=e.clientY-20+'px';S.drag.px=e.clientX;S.drag.py=e.clientY;
 const sc=document.getElementById('sc-pl');const r=sc.getBoundingClientRect();let gap=null;
 if(e.clientX>r.left-20&&e.clientX<r.right+20&&e.clientY>r.top-30&&e.clientY<r.bottom+10){const rows=[...sc.querySelectorAll('.prow')];gap=rows.length;
  for(let i=0;i<rows.length;i++){const b=rows[i].getBoundingClientRect();if(e.clientY<b.top+b.height/2){gap=i;break}}}
 ghost.classList.toggle('no',gap!=null&&!dropOk(T.get(S.drag.id)));
 if(gap!==S.drag.gap){S.drag.gap=gap;render()}});
addEventListener('pointerup',()=>{if(S.drag){const d=S.drag;S.drag=null;cancelAnimationFrame(raf);ghost?.remove();ghost=null;document.body.classList.remove('dragging');
  if(d.gap!=null&&dropOk(T.get(d.id))&&!(d.from!=null&&(d.gap===d.from||d.gap===d.from+1)))insertAt(d.id,d.gap,d.from);
  else if(d.gap!=null&&!dropOk(T.get(d.id)))toast('Not dropped: analyse it first (pick 3C)');
  render()}down=null});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){if(S.undo.length){S.q=S.undo.pop();render()}e.preventDefault()}if(e.key==='Escape'&&S.drag){S.drag.gap=null;dispatchEvent(new Event('pointerup'))}});
addEventListener('resize',()=>render());
render();
</script></body></html>
