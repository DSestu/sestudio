<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Harmony: building playlists</title>
<style>
:root{--p:oklch(72% .16 230);--pi:oklch(18% .05 230);--tx:#e3eaf0;--mut:rgba(227,234,240,.55);--mut2:rgba(227,234,240,.4);--glass:rgba(16,28,40,.8);--line:rgba(255,255,255,.08);--warn:oklch(80% .15 75)}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{display:flex;flex-direction:column;gap:46px;padding-bottom:16px}
h2{font-size:20px;margin:0 0 4px;letter-spacing:-.02em;font-weight:600}
h2 .k{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--p);color:var(--pi);font-size:15px;margin-right:10px;vertical-align:2px}
h3{font-size:14px;margin:18px 0 8px;font-weight:600;letter-spacing:-.01em}
.lede{margin:0 0 10px;font-size:14px;line-height:1.5;max-width:68ch}
.row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
ol.notes{margin:0;padding:0;list-style:none;display:grid;gap:7px;counter-reset:n;flex:1;min-width:200px}
ol.notes li{counter-increment:n;font-size:13px;line-height:1.45;position:relative;padding-left:30px}
ol.notes li::before{content:counter(n);position:absolute;left:0;top:0;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--p);color:var(--pi);font-size:11px;font-weight:700}
.illu{font-size:12px;color:var(--muted-foreground);margin:4px 0 0}
svg.i{width:1em;height:1em;vertical-align:-.13em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* devices */
.dev{position:relative;overflow:hidden;border-radius:12px;box-shadow:0 0 0 1px rgba(255,255,255,.1);flex:none}
.dev.ph{border-radius:22px}
.scr{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;color:var(--tx);font-size:13px;background:#060c13}
.scr *{line-height:1.25}
.abs{position:absolute}
.glass{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px}
.panel{background:rgba(255,255,255,.035);border-radius:14px}
.mut{color:var(--mut)}
.tab{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn.solid{background:var(--p);color:var(--pi)}
.btn.gh{background:rgba(255,255,255,.07);color:var(--tx)}
.btn.pri{background:rgba(0,170,230,.18);color:var(--p)}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;background:rgba(255,255,255,.06);color:var(--mut);white-space:nowrap}
.chip.on{background:rgba(0,170,230,.2);color:var(--p)}
.cap{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut2);font-weight:600}
/* track rows */
.tr{display:flex;align-items:center;gap:10px;height:48px;padding:0 10px;border-radius:12px}
.tr .g{width:14px;color:rgba(255,255,255,.25)}
.tr .tt{flex:1;min-width:0}
.tr .tt b{display:block;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .tt span{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .bpm{font-size:11px;color:var(--mut2);width:28px;text-align:right}
.tr .d{font-size:12px;color:var(--mut);width:34px;text-align:right}
.tr.sel{background:rgba(0,170,230,.13);box-shadow:inset 0 0 0 1px rgba(0,170,230,.35)}
.tr.new{background:rgba(255,255,255,.05);border:1px dashed rgba(0,170,230,.5)}
.mood{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;white-space:nowrap}
.mood i{width:8px;height:8px;border-radius:50%;flex:none}
.th{font-size:11.5px;color:var(--mut);white-space:nowrap}
/* join line between two rows */
.jn{display:flex;align-items:center;gap:8px;height:24px;padding-left:34px;font-size:11.5px;color:var(--mut)}
.jn.bad{color:var(--warn)}
.dots{display:inline-flex;gap:2.5px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--p)}
.dots i.o{background:transparent;box-shadow:inset 0 0 0 1px rgba(227,234,240,.35)}
.jn.bad .dots i{background:var(--warn)}
.jn.bad .dots i.o{background:transparent}
.bridge{margin:2px 0 6px 28px;padding:10px;border-radius:12px;background:rgba(242,193,78,.06);box-shadow:inset 0 0 0 1px rgba(242,193,78,.25)}
.dir{display:inline-flex;align-items:center;gap:3px;font-weight:500}
/* phone */
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:62px;display:flex;align-items:center;justify-content:space-around;padding:0 8px}
.dock span{display:grid;justify-items:center;gap:3px;font-size:10px;color:var(--mut)}
.dock span i{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.12)}
.dock span.on{color:var(--p)}.dock span.on i{background:rgba(0,170,230,.4)}
.dock .srch{width:52px;height:52px;border-radius:16px;background:var(--p)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#0d1822;border-radius:22px 22px 0 0;box-shadow:0 -20px 50px rgba(0,0,0,.6)}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:8px auto 4px}
.seg{display:flex;padding:3px;border-radius:10px;background:rgba(255,255,255,.07);gap:2px}
.seg span{flex:1;text-align:center;padding:7px 8px;border-radius:8px;font-weight:600;font-size:12px;color:var(--mut);white-space:nowrap}
.seg span.on{background:rgba(0,170,230,.22);color:var(--p)}
.fld{display:flex;align-items:center;gap:8px;height:40px;border-radius:10px;background:rgba(255,255,255,.07);padding:0 12px;font-size:13px}
/* theory specimen */
.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{padding:16px;border-radius:var(--radius);background:#0b141d;color:var(--tx);font-size:13px}
.card h4{margin:0 0 10px;font-size:13px;font-weight:600}
.card .chip{background:rgba(255,255,255,.06)}
.kb{display:block;margin-top:10px}
/* beginner explainer */
.basics{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.basic{font-size:13.5px;color:var(--tx)}
.basic h4{margin:0 0 8px;font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;gap:10px;align-items:center}
.basic h4 i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(0,170,230,.2);color:var(--p);font-size:12px;flex:none}
.basic p{margin:0 0 10px;line-height:1.5;max-width:60ch}
.basic .mut{font-size:12.5px}
.pl{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:0;background:rgba(0,170,230,.18);color:var(--p);font:600 12px system-ui,sans-serif;cursor:pointer;margin-top:8px}
.pl:hover{background:rgba(0,170,230,.28)}
.pl:focus-visible,.hm:focus-visible,.lr:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.legend .jn{padding-left:0;height:22px}
.homes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.hm{display:grid;justify-items:center;gap:2px;padding:7px 2px;border-radius:10px;border:0;background:rgba(255,255,255,.05);color:var(--tx);font:12px system-ui,sans-serif;cursor:pointer}
.hm:hover{background:rgba(255,255,255,.1)}
.hm b{font-size:14px}.hm span{font-size:10.5px;font-weight:600}.hm small{font-size:9.5px;color:var(--mut)}
.ladder{display:grid;gap:4px;margin-top:6px}
.lr{display:grid;grid-template-columns:96px 1fr 62px;align-items:center;gap:10px;padding:4px 8px;border-radius:10px;border:0;background:transparent;color:var(--tx);font:12px system-ui,sans-serif;cursor:pointer;text-align:left}
.lr:hover{background:rgba(255,255,255,.06)}
.lr .kb{margin:0}
.lw{display:grid;font-weight:600;font-size:12.5px}.lw small{font-weight:400;font-size:10.5px;color:var(--mut)}
.ln{font-size:11px;color:var(--warn);text-align:right}
.tip{font-size:12.5px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);color:var(--mut);margin:8px 0 0}
.dots i.q{background:transparent;box-shadow:inset 0 0 0 1px var(--p);outline:1px dashed rgba(0,170,230,.6);outline-offset:1px}
.mood.uns i{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.15);border-top-color:var(--p);display:inline-block}
.pop{position:absolute;border-radius:14px;background:#15222e;box-shadow:0 18px 44px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.08);padding:14px}
.radio{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:rgba(255,255,255,.04)}
.radio.on{background:rgba(0,170,230,.1);box-shadow:inset 0 0 0 1px rgba(0,170,230,.45)}
.radio>i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(227,234,240,.4);flex:none;margin-top:2px}
.radio.on>i{box-shadow:inset 0 0 0 5px var(--p)}
.tog{width:38px;height:22px;border-radius:999px;background:var(--p);position:relative;flex:none}
.tog::after{content:"";position:absolute;right:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--pi)}
.setrow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
// ---------- theory (illustrative modes on the real test tracks; tonics are S-KEY's) ----------
const NOTE=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const MAJ=[0,2,4,5,7,9,11];
const MODES={lydian:[3,3],ionian:[0,2],mixolydian:[4,1],dorian:[1,0],aeolian:[5,-1],phrygian:[2,-2],locrian:[6,-3]};
const WORD={3:'Floating',2:'Bright',1:'Warm',0:'Smooth','-1':'Dark','-2':'Menacing','-3':'Unstable'};
const COL={3:'oklch(88% .12 95)',2:'oklch(83% .13 75)',1:'oklch(77% .13 45)',0:'oklch(72% .13 10)','-1':'oklch(66% .15 340)','-2':'oklch(62% .17 310)','-3':'oklch(56% .18 290)'};
const scale=(t,m)=>m==='harmonic minor'?[0,2,3,5,7,8,11].map(x=>(t+x)%12):MAJ.map(x=>(t+x-MAJ[MODES[m][0]]+12)%12);
function T(title,artist,bpm,dur,t,mode){const hm=mode==='harmonic minor';const br=hm?-1:MODES[mode][1];
 const parent=hm?null:(t-MAJ[MODES[mode][0]]+12)%12;
 return {title,artist,bpm,dur,t,mode,pcs:scale(t,mode),br,set:hm?null:((parent*7)%12+7)%12+1,word:hm?'Exotic':WORD[br],col:hm?'oklch(70% .14 200)':COL[br]}}
const LIB=[
 T('Farewell','neuro soundcloud',172,239,7,'dorian'),T('These Days','Emperor',172,268,7,'aeolian'),T('Wanna','Kumarion',172,220,7,'aeolian'),
 T('All I Ever Wanted','Emperor',172,297,7,'aeolian'),T('No Way Out','feat. Mira Lu Kovacs',175,245,7,'dorian'),T('Noir','Teddy Killerz',174,226,7,'phrygian'),
 T('Suicide Bassline VIP','Mefjus',172,174,7,'phrygian'),T('Stargazer','Skylark',172,201,0,'aeolian'),T('Pray For Me','feat. Joe Killington',175,245,0,'dorian'),
 T('Sinkhole','neuro soundcloud',172,313,5,'aeolian'),T('You left me','Eluun',174,213,5,'aeolian'),T('Dune','neuro soundcloud',174,127,5,'harmonic minor'),
 T('Hear The Lies','Eluun',172,235,5,'dorian'),T('If I Could','neuro soundcloud',172,253,5,'aeolian'),T('Concussion (Mefjus Remix)','Noisia',172,226,5,'phrygian'),
 T('Elysium','Fade Black',175,247,2,'aeolian'),T('Mesmer','Sota, Circadian, Mila Falls',174,281,10,'aeolian'),T('Supersonic','Skrillex, Noisia',172,165,9,'aeolian'),
 T('Physically','Mefjus',172,112,4,'phrygian'),T('Nonplus','neuro soundcloud',172,233,4,'dorian'),T('Pure Action','Kumarion',174,203,4,'aeolian'),
 T('Twerp','Waeys, Bensley & Hoax',175,220,3,'aeolian'),T('Perseverance','neuro soundcloud',172,232,3,'dorian'),T('Dopamine Hits','Mefjus & Maksim MC',172,190,3,'phrygian'),
 T('Left','Maysev',172,192,3,'aeolian'),T('Sunder','Emperor',174,276,3,'aeolian'),T('The Hole','neuro soundcloud',172,315,5,'lydian'),
 T('The First Time','Virtual Riot, Tokyo Machine',145,190,7,'mixolydian'),T('Before You','Maysev & The Caracal Project',165,224,1,'aeolian'),
 T('Black Bloc','neuro soundcloud',172,251,1,'phrygian'),T('Hear Me','neuro soundcloud',172,249,11,'aeolian'),T('Aurora (Justin Hawkes Remix)','feat. Metrik',175,231,5,'aeolian'),
 T('A Taste Of Hope','Emperor',172,314,5,'aeolian'),T('Systematic V4','D_Minds & Mefjus',172,271,5,'phrygian'),T('Pure Hope','neuro soundcloud',172,240,0,'mixolydian')];
const by=n=>LIB.find(x=>x.title===n);
const shared=(a,b)=>a.pcs.filter(x=>b.pcs.includes(x)).length;
const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
const name=t=>`${NOTE[t.t]} ${t.mode}`;
function kind(a,b){const n=shared(a,b),same=a.t===b.t;
 if(n===7&&same)return['Same key','same key'];
 if(n===7)return['Same notes','pivot'];
 if(n===6&&same)return['One note changes','modal shift'];
 if(n===6)return['Next door','neighbour'];
 return['Clash','clash']}
// ---------- glyphs ----------
const ic={
 up:'<svg class="i" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
 dn:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
 eq:'<svg class="i" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14"/></svg>',
 grip:'<svg class="i" viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
 plus:'<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 play:'<svg class="i" viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><path d="M8 5l11 7-11 7z"/></svg>',
 back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 wand:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20 15 9M14 4v3M19 9h-3M17.5 5.5l-2 2"/></svg>',
 shuf:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h3l10 10h3M4 17h3l10-10h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
 x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 srch:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>',
 pause:'<svg class="i" viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
};
const dots=n=>`<span class="dots" title="${n} of 7 notes shared">${[0,1,2,3,4,5,6].map(i=>`<i class="${i<n?'':'o'}"></i>`).join('')}</span>`;
const dirOf=(a,b)=>{const d=b.br-a.br;return d>0?`<span class="dir">${ic.up}brighter</span>`:d<0?`<span class="dir">${ic.dn}darker</span>`:`<span class="dir">${ic.eq}same light</span>`};
const mood=t=>`<span class="mood" style="color:${t.col}"><i style="background:${t.col}"></i>${t.word}</span>`;
// level: 'plain' | 'theory'
function join(a,b,level='plain',extra=''){const n=shared(a,b),[k,kt]=kind(a,b),bad=n<6;
 const txt=level==='theory'?`${name(a)} → ${name(b)} · ${kt}`:`${k.toLowerCase()} · ${dirOf(a,b)}`;
 return `<div class="jn${bad?' bad':''}">${dots(n)}<span>${txt}</span>${extra}</div>`}
function trow(t,{sel='',level='plain',grip=true,bpm=true,right=''}={}){
 return `<div class="tr ${sel}">${grip?`<span class="g">${ic.grip}</span>`:''}<div class="tt"><b>${t.title}</b><span>${t.artist}</span></div>
 ${level==='theory'?`<span class="th">${name(t)}</span>`:mood(t)}${bpm?`<span class="bpm tab">${t.bpm}</span>`:''}<span class="d tab">${fmt(t.dur)}</span>${right}</div>`}
function dev(w,h,s,inner,ph){return `<div class="dev${ph?' ph':''}" style="width:${w*s}px;height:${h*s}px"><div class="scr" style="width:${w}px;height:${h}px;transform:scale(${s})">${inner}</div></div>`}
// one-octave keyboard comparing two scales: blue = in both, top tick = only in A, bottom tick = only in B
function keyboard(a,b,w=260){const kw=w/7,wh=[0,2,4,5,7,9,11],bl=[1,3,6,8,10],h=58;
 const cls=pc=>{const ia=a.pcs.includes(pc),ib=b.pcs.includes(pc);return ia&&ib?'both':ia?'a':ib?'b':''};
 let s=`<svg class="kb" width="100%" viewBox="0 0 ${w} ${h+30}" style="max-width:${w}px">`;
 wh.forEach((pc,i)=>{const c=cls(pc);s+=`<rect x="${i*kw+.5}" y="0.5" width="${kw-1}" height="${h}" rx="3" fill="${c==='both'?'oklch(72% .16 230)':'#d9e2e8'}" fill-opacity="${c==='both'?.9:c?.55:.12}"/>`;
  s+=`<text x="${i*kw+kw/2}" y="${h+14}" fill="rgba(227,234,240,.6)" font-size="10" text-anchor="middle">${NOTE[pc]}</text>`;
  if(c==='a')s+=`<text x="${i*kw+kw/2}" y="${h-8}" fill="${a.col}" font-size="10" font-weight="700" text-anchor="middle">A</text>`;
  if(c==='b')s+=`<text x="${i*kw+kw/2}" y="${h-8}" fill="${b.col}" font-size="10" font-weight="700" text-anchor="middle">B</text>`});
 bl.forEach(pc=>{const i=wh.indexOf(pc-1),c=cls(pc),x=(i+1)*kw-kw*.3;s+=`<rect x="${x}" y="0" width="${kw*.6}" height="${h*.6}" rx="2" fill="${c==='both'?'oklch(60% .16 230)':'#2a333b'}" stroke="#0b141d"/>`;
  if(c==='a'||c==='b')s+=`<text x="${x+kw*.3}" y="${h*.6-6}" fill="${c==='a'?a.col:b.col}" font-size="9" font-weight="700" text-anchor="middle">${c.toUpperCase()}</text>`});
 return s+`<text x="0" y="${h+28}" fill="rgba(227,234,240,.45)" font-size="10">blue: in both · A/B: only in one</text></svg>`}

// ---------- shared chrome ----------
const W=1280,H=800,PW=390,PH=844;
const rail=`<div class="abs glass" style="left:12px;top:12px;bottom:12px;width:84px;display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:24px">
 <i style="width:22px;height:30px;border-radius:6px;background:rgba(0,170,230,.6)"></i><i style="width:52px;height:52px;border-radius:14px;background:var(--p)"></i>
 ${['Home','Media','Discover','Music','Library'].map(n=>`<span style="display:grid;justify-items:center;gap:5px;font-size:11px;color:${n==='Music'?'var(--p)':'var(--mut)'}"><i style="width:${n==='Music'?52:22}px;height:${n==='Music'?32:22}px;border-radius:8px;background:${n==='Music'?'rgba(0,170,230,.25)':'rgba(255,255,255,.12)'}"></i>${n}</span>`).join('')}</div>`;
const topCard=`<div class="abs glass" style="left:127px;top:20px;width:1134px;height:98px">
 <div class="abs" style="left:20px;top:8px"><div style="font-size:20px;font-weight:600;letter-spacing:-.02em">Music</div><div class="mut" style="font-size:12px;margin-top:3px"><i>46</i> tracks</div></div>
 <div class="abs fld" style="left:100px;top:2px;width:860px;height:42px;box-shadow:0 0 0 2px oklch(72% .16 230 / .8);background:#060c13;color:var(--mut)">${ic.srch}<span>Search your libraries and online, or paste a link</span></div>
 <div class="abs seg" style="left:20px;top:46px;width:384px"><span>Albums</span><span>Artists</span><span>Tracks</span></div></div>`;
const libCol=`<div class="abs" style="left:127px;top:138px;width:250px">
 <div class="cap" style="padding:6px 12px">Libraries</div>
 <div style="display:flex;justify-content:space-between;padding:11px 12px;font-size:14px"><span>All</span><span class="mut">46</span></div>
 <div style="display:flex;justify-content:space-between;padding:6px 12px;font-size:14px"><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#3fd18a;margin-right:10px"></i>This PC</span><span class="mut">46</span></div>
 <div class="cap" style="padding:22px 12px 8px">Playlists</div>

// ---------- C: by hand, the harmony wheel ----------
function wheel(size,{path=ALL,cur=by('Noir'),showAll=true}={}){const c=size/2,R0=size*.12,R1=size*.40;
 const ang=set=>((set-1)/12)*Math.PI*2-Math.PI/2;const rad=br=>R0+((br+3)/6)*(R1-R0);
 const pos=(t,j=0)=>{const set=t.set??(((t.t+3)%12*7)%12+7)%12+1;const a=ang(set)+j;return [c+Math.cos(a)*rad(t.br),c+Math.sin(a)*rad(t.br)]};
 const jit=new Map();LIB.forEach(t=>{const k=`${t.set}|${t.br}`;const n=jit.get(k)||0;jit.set(k,n+1);t._j=(n%2?1:-1)*Math.ceil(n/2)*.075});
 let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block">`;
 [-3,-2,-1,0,1,2,3].forEach(b=>s+=`<circle cx="${c}" cy="${c}" r="${rad(b)}" fill="none" stroke="rgba(255,255,255,${b===0?.1:.05})"/>`);
 const cs=cur.set;[cs-1,cs,cs+1].forEach((st,i)=>{const s1=((st-1+12)%12)+1;const a0=ang(s1)-Math.PI/12,a1=ang(s1)+Math.PI/12;
  const p=(r,a)=>`${c+Math.cos(a)*r},${c+Math.sin(a)*r}`;s+=`<path d="M${p(R0-6,a0)} L${p(R1+8,a0)} A${R1+8} ${R1+8} 0 0 1 ${p(R1+8,a1)} L${p(R0-6,a1)} A${R0-6} ${R0-6} 0 0 0 ${p(R0-6,a0)}" fill="oklch(72% .16 230 / ${i===1?.14:.07})"/>`});
 for(let st=1;st<=12;st++){const a=ang(st);const majRoot=((st-8)*7%12+12)%12;s+=`<text x="${c+Math.cos(a)*(R1+16)}" y="${c+Math.sin(a)*(R1+16)+4}" font-size="${size*.03}" fill="rgba(227,234,240,${Math.abs(st-cs)<=1?.85:.35})" text-anchor="middle">${NOTE[majRoot]}</text>`}
 if(path){const pts=path.filter(t=>t.set).map(t=>pos(t,t._j));s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5" stroke-dasharray="4 4"/>`}
 if(showAll)LIB.filter(t=>t.set).forEach(t=>{const [x,y]=pos(t,t._j);const near=Math.min(Math.abs(t.set-cs),12-Math.abs(t.set-cs))<=1;const inSet=path&&path.includes(t);
  s+=`<circle cx="${x}" cy="${y}" r="${inSet?size*.014:size*.011}" fill="${t.col}" fill-opacity="${near||inSet?1:.25}" ${inSet?'stroke="#fff" stroke-width="1.2"':''}/>`});
 const [x,y]=pos(cur,cur._j);s+=`<circle cx="${x}" cy="${y}" r="${size*.026}" fill="none" stroke="oklch(72% .16 230)" stroke-width="2.5"/>`;

 s+=`<g><rect x="${hx-size*.47}" y="${hy-size*.02}" width="${size*.4}" height="${size*.085}" rx="8" fill="#15222e" stroke="rgba(255,255,255,.12)"/><text x="${hx-size*.27}" y="${hy+size*.015}" font-size="${size*.03}" fill="#e3eaf0" text-anchor="middle">Stargazer · same notes</text><text x="${hx-size*.27}" y="${hy+size*.045}" font-size="${size*.025}" fill="${hov.col}" text-anchor="middle">brighter · Dark</text></g>`;
 return s+'</svg>'}

function greedy(seed,n,want){const out=[seed];const used=new Set([seed]);let cur=seed;
 for(let i=1;i<n;i++){const tgt=want(i);const c=LIB.filter(t=>!used.has(t)&&t.set&&shared(cur,t)>=6&&Math.abs(t.bpm-seed.bpm)<=8)
  .sort((a,b)=>(Math.abs(a.br-tgt)-Math.abs(b.br-tgt))||(shared(cur,b)-shared(cur,a)))[0];if(!c)break;out.push(c);used.add(c);cur=c}return out}

// one octave: lit = the scale, white dot = home note, amber ring = the note that just moved
function kb(pcs,{home=null,changed=null,w=280,h=70,names=true}={}){const kw=w/7,wh=[0,2,4,5,7,9,11],bl=[1,3,6,8,10];
 let s=`<svg class="kb" width="100%" viewBox="0 0 ${w} ${h+(names?16:2)}" style="max-width:${w}px">`;
 const ring=(x,y,ww,hh)=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" rx="3" fill="none" stroke="oklch(80% .15 75)" stroke-width="2.5"/>`;
 wh.forEach((pc,i)=>{const on=pcs.includes(pc);
  s+=`<rect x="${i*kw+.5}" y=".5" width="${kw-1}" height="${h}" rx="3" fill="${on?'oklch(72% .16 230)':'#d9e2e8'}" fill-opacity="${on?.9:.12}"/>`;
  if(changed===pc)s+=ring(i*kw+1.5,1.5,kw-3,h-2);
  if(home===pc)s+=`<circle cx="${i*kw+kw/2}" cy="${h-11}" r="6" fill="#060c13"/><circle cx="${i*kw+kw/2}" cy="${h-11}" r="3" fill="#fff"/>`;
  if(names)s+=`<text x="${i*kw+kw/2}" y="${h+13}" fill="rgba(227,234,240,.55)" font-size="10" text-anchor="middle">${NOTE[pc]}</text>`});
 bl.forEach(pc=>{const i=wh.indexOf(pc-1),x=(i+1)*kw-kw*.3,on=pcs.includes(pc);
  s+=`<rect x="${x}" y="0" width="${kw*.6}" height="${h*.6}" rx="2" fill="${on?'oklch(58% .16 230)':'#2a333b'}" stroke="#0b141d"/>`;
  if(changed===pc)s+=ring(x+1,1,kw*.6-2,h*.6-2);
  if(home===pc)s+=`<circle cx="${x+kw*.3}" cy="${h*.6-9}" r="4.5" fill="#fff"/>`});
 return s+'</svg>'}
// the mockup really plays: a scale from its home note, up one octave
let AC;function play(pcs,home){AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+.05;
 const seq=pcs.map(p=>(p-home+12)%12).sort((a,b)=>a-b);seq.push(12);
 seq.forEach((iv,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=t0+i*.22;o.type='triangle';o.frequency.value=261.63*Math.pow(2,(home+iv)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.42);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.45)})}

const ESHAPE=[[4,.35],[4,'up'],[8,1],[4,.45],[2,'up'],[6,1],[4,.35]];
LIB.forEach((t,j)=>{t.e=EN[t.title]??.6;const c=[];let last=.35;
 ESHAPE.forEach(([n,v])=>{for(let i=0;i<n;i++){const lv=v==='up'?last+(1-last)*(i+1)/n:v;c.push(Math.min(1,t.e*lv*(1+.06*Math.sin(j*3+c.length*1.7))))}last=v==='up'?1:v});t.curve=c});

 return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="flex:none" aria-label="Energy shape"><path d="${d} L${w},${h}Z" fill="rgba(227,234,240,.22)"/><path d="${d.slice(d.indexOf('L'))}" fill="none" stroke="rgba(227,234,240,.7)" stroke-width="1"/></svg>`}

function setCurve2(w,h,tracks,{drawn=null,labels=true}={}){const tot=tracks.reduce((s,t)=>s+t.dur,0),eh=h*.56;
 const yE=e=>eh-2-e*(eh-8),yM=br=>h-6-((br+3)/6)*(h-eh-12);
 let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">`,x=0,d='';
 tracks.forEach((t,i)=>{const x0=x/tot*w,x1=(x+t.dur)/tot*w;t.curve.forEach((v,k)=>d+=`${d?' L':'M'}${(x0+k/(t.curve.length-1)*(x1-x0)).toFixed(1)},${yE(v).toFixed(1)}`);
  s+=`<rect x="${x0+1}" y="${yM(t.br)-3}" width="${x1-x0-2}" height="6" rx="3" fill="${t.col}"/>`;if(i)s+=`<line x1="${x0}" x2="${x0}" y1="2" y2="${h-2}" stroke="rgba(255,255,255,.05)"/>`;x+=t.dur});
 s+=`<path d="${d} L${w},${yE(0)} L0,${yE(0)}Z" fill="rgba(227,234,240,.12)"/><path d="${d}" fill="none" stroke="rgba(227,234,240,.65)" stroke-width="1.2"/>`;
 s+=`<line x1="0" x2="${w}" y1="${eh+3}" y2="${eh+3}" stroke="rgba(255,255,255,.06)"/>`;
 if(labels)s+=`<text x="6" y="12" font-size="9.5" fill="rgba(227,234,240,.45)">ENERGY</text><text x="6" y="${eh+15}" font-size="9.5" fill="rgba(227,234,240,.45)">MOOD</text>`;
 if(drawn)s+=drawn(yE,yM,w);return s+'</svg>'}

 return order.filter(k=>g[k]).map(k=>{const list=[...g[k]].sort((x,y)=>Math.abs(x.e-after.e)-Math.abs(y.e-after.e)).slice(0,limit);

function plane(w,h,{cur=by('Noir'),path=ALL,tip=by('Stargazer'),labels=false}={}){const px=t=>18+((t.br+3)/6)*(w-36)+((LIB.indexOf(t)%5)-2)*4,py=t=>h-18-t.e*(h-36);

 s+=(labels?q(18,h-22,'','start'):q(18,28,'Dark & intense','start')+q(w-18,28,'Bright & intense','end'))+q(18,h-22,'Dark & calm','start')+q(w-18,h-22,'Bright & calm','end');

function greedy2(seed,n,want){const out=[seed],used=new Set([seed]);let cur=seed;

function playStyle(pcs,home,hot){AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+.05,step=hot?.12:.42;
