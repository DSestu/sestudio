<style>

.sw.on{background:var(--p)}.sw.on::after{left:19px;background:var(--pi)}

.basic p{margin:0 0 10px;line-height:1.5;font-size:13.5px}

.gch{display:inline-flex;align-items:center;gap:4px;color:var(--tx);font-weight:500}
.tj{color:var(--warn);font-weight:500}
.arcw svg{touch-action:none;user-select:none}
.arcw [data-h]{cursor:grab}
.arcw [data-lane]{cursor:crosshair}
.arcw [data-a="gcycle"]{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

<div id="root"></div>
<script>
// ---------- music data: real test tracks; modes and energy levels are illustrative ----------
const NOTE=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const MAJ=[0,2,4,5,7,9,11];
const MODES={lydian:[3,3],ionian:[0,2],mixolydian:[4,1],dorian:[1,0],aeolian:[5,-1],phrygian:[2,-2],locrian:[6,-3]};
const WORD={3:'Floating',2:'Bright',1:'Warm',0:'Smooth','-1':'Dark','-2':'Menacing','-3':'Unstable'};
const COL={3:'oklch(88% .12 95)',2:'oklch(83% .13 75)',1:'oklch(77% .13 45)',0:'oklch(72% .13 10)','-1':'oklch(66% .15 340)','-2':'oklch(62% .17 310)','-3':'oklch(56% .18 290)'};
const scale=(t,m)=>m==='harmonic minor'?[0,2,3,5,7,8,11].map(x=>(t+x)%12):MAJ.map(x=>(t+x-MAJ[MODES[m][0]]+12)%12);
function T(title,artist,bpm,dur,t,mode,e){const hm=mode==='harmonic minor';const br=hm?-1:MODES[mode][1];
 const parent=hm?null:(t-MAJ[MODES[mode][0]]+12)%12;
 return {title,artist,bpm,dur,t,mode,e,pcs:scale(t,mode),br,set:hm?null:((parent*7)%12+7)%12+1,word:hm?'Exotic':WORD[br],col:hm?'oklch(70% .14 200)':COL[br]}}
const LIB=[
 T('Farewell','neuro soundcloud',172,239,7,'dorian',.32),T('These Days','Emperor',172,268,7,'aeolian',.62),T('Wanna','Kumarion',172,220,7,'aeolian',.7),
 T('All I Ever Wanted','Emperor',172,297,7,'aeolian',.66),T('No Way Out','feat. Mira Lu Kovacs',175,245,7,'dorian',.58),T('Noir','Teddy Killerz',174,226,7,'phrygian',.88),
 T('Suicide Bassline VIP','Mefjus',172,174,7,'phrygian',.92),T('Stargazer','Skylark',172,201,0,'aeolian',.6),T('Pray For Me','feat. Joe Killington',175,245,0,'dorian',.72),
 T('Sinkhole','neuro soundcloud',172,313,5,'aeolian',.8),T('You left me','Eluun',174,213,5,'aeolian',.55),T('Dune','neuro soundcloud',174,127,5,'harmonic minor',.75),
 T('Hear The Lies','Eluun',172,235,5,'dorian',.6),T('If I Could','neuro soundcloud',172,253,5,'aeolian',.7),T('Concussion (Mefjus Remix)','Noisia',172,226,5,'phrygian',.9),
 T('Elysium','Fade Black',175,247,2,'aeolian',.68),T('Mesmer','Sota, Circadian, Mila Falls',174,281,10,'aeolian',.64),T('Supersonic','Skrillex, Noisia',172,165,9,'aeolian',.95),
 T('Physically','Mefjus',172,112,4,'phrygian',.9),T('Nonplus','neuro soundcloud',172,233,4,'dorian',.78),T('Pure Action','Kumarion',174,203,4,'aeolian',.85),
 T('Twerp','Waeys, Bensley & Hoax',175,220,3,'aeolian',.9),T('Perseverance','neuro soundcloud',172,232,3,'dorian',.74),T('Dopamine Hits','Mefjus & Maksim MC',172,190,3,'phrygian',.86),
 T('Left','Maysev',172,192,3,'aeolian',.7),T('Sunder','Emperor',174,276,3,'aeolian',.8),T('The Hole','neuro soundcloud',172,315,5,'lydian',.66),
 T('The First Time','Virtual Riot, Tokyo Machine',145,190,7,'mixolydian',.72),T('Before You','Maysev & The Caracal Project',165,224,1,'aeolian',.5),
 T('Black Bloc','neuro soundcloud',172,251,1,'phrygian',.84),T('Hear Me','neuro soundcloud',172,249,11,'aeolian',.6),T('Aurora (Justin Hawkes Remix)','feat. Metrik',175,231,5,'aeolian',.7),
 T('A Taste Of Hope','Emperor',172,314,5,'aeolian',.67),T('Systematic V4','D_Minds & Mefjus',172,271,5,'phrygian',.88),T('Pure Hope','neuro soundcloud',172,240,0,'mixolydian',.55)];
// dubstep tracks from the test library (keys and tempos are real; modes and energy illustrative)
LIB.push(T('Statues','Virtual Riot',150,243,2,'phrygian',.85),T('Found You','Virtual Riot, Dodge & Fuski',150,247,4,'aeolian',.8),T('Nightmare','Virtual Riot & Autodrive',145,254,4,'phrygian',.9),
 T("I'm Back",'Dodge & Fuski',150,200,3,'aeolian',.88),T("Sh*t's On F*re",'neuro soundcloud',150,245,2,'aeolian',.92),T('So Sorry (RANKZ Remix)','Virtual Riot',145,159,3,'dorian',.78),T('Scorched Earth','Virtual Riot',135,281,3,'phrygian',.9));
const DUB=new Set(['The First Time','Statues','Found You','Nightmare',"I'm Back","Sh*t's On F*re",'So Sorry (RANKZ Remix)','Scorched Earth']);
LIB.forEach(t=>t.genre=t.title==='Farewell'?'Ambient':DUB.has(t.title)?'Dubstep':'Drum & Bass');
const GENRES=['Drum & Bass','Dubstep','Ambient'];
const GCOL={'Drum & Bass':'oklch(74% .11 185)','Dubstep':'oklch(80% .15 128)','Ambient':'oklch(78% .06 265)'};
const GS={'Drum & Bass':'DnB','Dubstep':'Dubstep','Ambient':'Ambient'};
const gchip=g=>`<span class="gchip" style="--gc:${GCOL[g]}">${GS[g]}</span>`;
const tempoJump=(a,b)=>Math.abs(a.bpm-b.bpm)>a.bpm*.06;
// energy per bar: intro / build / drop / break / build / drop / outro
const ESHAPE=[[4,.35],[4,'up'],[8,1],[4,.45],[2,'up'],[6,1],[4,.35]];
LIB.forEach((t,j)=>{const c=[];let last=.35;ESHAPE.forEach(([n,v])=>{for(let i=0;i<n;i++){const lv=v==='up'?last+(1-last)*(i+1)/n:v;c.push(Math.min(1,t.e*lv*(1+.06*Math.sin(j*3+c.length*1.7))))}last=v==='up'?1:v});t.curve=c});

const ELVL=e=>e<.45?'Calm':e<.65?'Steady':e<.8?'Driving':'Intense';
const eStep=(a,b)=>{const d=b.e-a.e;return d>.08?'lifts':d<-.08?'eases off':'holds'};

const ic={

 back:'<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 wand:'<svg class="i" viewBox="0 0 24 24"><path d="M4 20 15 9M14 4v3M19 9h-3M17.5 5.5l-2 2"/></svg>',
 shuf:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h3l10 10h3M4 17h3l10-10h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
 x:'<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
 q:'<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5V14M12 17h.01"/></svg>',
 srch:'<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>',
 next:'<svg class="i" viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><path d="M6 5l9 7-9 7zM16 5h2v14h-2z"/></svg>',
 prev:'<svg class="i" viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><path d="M18 5l-9 7 9 7zM6 5h2v14H6z"/></svg>',

 const jit=new Map();let s=`<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;margin:auto">`;
 [-3,-1,1,3].forEach(b=>s+=`<circle cx="${c}" cy="${c}" r="${rad(b)}" fill="none" stroke="rgba(255,255,255,.06)"/>`);
 for(let st=1;st<=12;st++){const a=ang(st),near=Math.min(Math.abs(st-cur.set),12-Math.abs(st-cur.set))<=1;s+=`<text x="${c+Math.cos(a)*(R1+14)}" y="${c+Math.sin(a)*(R1+14)+4}" font-size="10.5" fill="rgba(227,234,240,${near?.85:.3})" text-anchor="middle">${NOTE[((st-8)*7%12+12)%12]}</text>`}
 const ts=tracks().filter(t=>t.set);s+=`<polyline points="${ts.map(t=>{const k=`${t.set}|${t.br}`;return pos(t,0).join(',')}).join(' ')}" fill="none" stroke="rgba(255,255,255,.3)" stroke-dasharray="4 4"/>`;
 LIB.filter(t=>t.set).forEach(t=>{const k=`${t.set}|${t.br}`,n=jit.get(k)||0;jit.set(k,n+1);const [x,y]=pos(t,(n%2?1:-1)*Math.ceil(n/2)*.08);
  const inS=S.set.includes(t.title),ok=shared(cur,t)>=6;s+=`<circle cx="${x}" cy="${y}" r="${S.focus===t.title?8:inS?6:5}" fill="${t.col}" fill-opacity="${ok||inS?1:.2}" ${inS?'stroke="#fff" stroke-width="1.2"':''} ${S.focus===t.title?'stroke="oklch(72% .16 230)" stroke-width="3"':''} ${A('focus',t.title)}><title>${t.title}</title></circle>`;
  if(t===cur)s+=`<circle cx="${x}" cy="${y}" r="11" fill="none" stroke="oklch(72% .16 230)" stroke-width="2.5" pointer-events="none"/>`});
 return s+'</svg>'}
function plane(w,h,cur,{path=true}={}){const px=t=>22+((t.br+3)/6)*(w-44)+((LIB.indexOf(t)%5)-2)*4,py=t=>h-20-t.e*(h-40);
 let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin:auto"><rect x="8" y="8" width="${w-16}" height="${h-16}" rx="10" fill="none" stroke="rgba(255,255,255,.06)"/><line x1="${w/2}" x2="${w/2}" y1="10" y2="${h-10}" stroke="rgba(255,255,255,.05)"/><line x1="10" x2="${w-10}" y1="${h/2}" y2="${h/2}" stroke="rgba(255,255,255,.05)"/>`;
 const q=(x,y,t,a)=>`<text x="${x}" y="${y}" font-size="10.5" fill="rgba(227,234,240,.36)" text-anchor="${a}">${t}</text>`;
 s+=q(16,24,'Dark & intense','start')+q(w-16,24,'Bright & intense','end')+q(16,h-16,'Dark & calm','start')+q(w-16,h-16,'Bright & calm','end');
 if(path)s+=`<polyline points="${tracks().map(t=>`${px(t)},${py(t)}`).join(' ')}" fill="none" stroke="rgba(255,255,255,.32)" stroke-width="1.4" stroke-dasharray="4 4"/>`;
 LIB.forEach(t=>{const inS=S.set.includes(t.title),ok=shared(cur,t)>=6;s+=`<circle cx="${px(t)}" cy="${py(t)}" r="${S.focus===t.title?8:inS?6:5}" fill="${t.col}" fill-opacity="${ok||inS?1:.2}" ${S.focus===t.title?'stroke="oklch(72% .16 230)" stroke-width="3"':inS?'stroke="#fff" stroke-width="1.2"':''} ${A('focus',t.title)}><title>${t.title}</title></circle>`});
 s+=`<circle cx="${px(cur)}" cy="${py(cur)}" r="12" fill="none" stroke="oklch(72% .16 230)" stroke-width="2.5" pointer-events="none"/>`;return s+'</svg>'}
function focusCard(a,at){const f=S.focus&&by(S.focus);if(!f)return `<div class="sm mut" style="padding:8px 12px">Lit dots share 6 or more notes with ${a.title}. Tap one to see how it would follow.</div>`;

const BASICS=[['Twelve notes, seven at a time',()=>`<p>Music uses 12 notes, the keys of one octave. Most tracks lean on just 7 of them: the <b>scale</b>.</p>${keyboard(by('Stargazer'),by('Stargazer'),300).replace(/blue: in both.*?<\/text>/,'</text>')}<button class="pl" data-play='${JSON.stringify([by('Stargazer').pcs,0])}'>${ic.play}Hear it</button>`],
 ['Shared notes make smooth mixes',()=>`<p>During a mix both tracks play at once. The more notes they share, the cleaner the blend. The dots count them: 7 seamless, 6 smooth, 5 or fewer rub (amber).</p>${keyboard(by('Noir'),by('These Days'),300)}`],
 ['Same notes, a different home',()=>`<p>Keep the same 7 notes but move the <b>home note</b> and the mood changes. Each home is a <b>mode</b>; moving between them is a pivot.</p><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${[[0,'ionian'],[2,'dorian'],[4,'phrygian'],[5,'lydian'],[7,'mixolydian'],[9,'aeolian'],[11,'locrian']].map(([h,m])=>`<button class="pl" style="height:auto;padding:6px 2px;display:grid;justify-items:center;gap:2px" data-play='${JSON.stringify([CMAJ,h])}'><b>${NOTE[h]}</b><span style="font-size:10px;color:${COL[MODES[m][1]]}">${WORD[MODES[m][1]]}</span></button>`).join('')}</div>`],
 ['One note brighter or darker',()=>`<p>Keep the home note, move one note: lower darkens, higher lifts. Lydian → ionian → mixolydian → dorian → aeolian → phrygian → locrian, one note at a time.</p>${['lydian','dorian','phrygian'].map(m=>`<button class="pl" data-play='${JSON.stringify([scale(7,m),7])}'>${ic.play}G ${m} · ${WORD[MODES[m][1]]}</button>`).join(' ')}`],
 ['Mood isn\'t energy',()=>`<p>Mood comes from the notes. <b>Energy</b> is how hard the track hits: loudness and high end, bar by bar. A track can be dark and calm, or dark and intense.</p>${strip(by('Farewell'),300,40)}<div class="sm mut" style="margin:4px 0 8px">Farewell · calm</div>${strip(by('Noir'),300,40)}<div class="sm mut">Noir · intense</div>`],

 ['Genres and tempo',()=>`<p>Genres come with their own tempo: drum &amp; bass runs around 172–175 BPM, dubstep around 140–150. Changing genre usually changes tempo too, so joins flag it, and Build a set puts genre changes where your genre arc says.</p><div class="legend">${GENRES.map(g=>`<span><i style="background:${GCOL[g]}"></i>${g}</span>`).join('')}</div><p class="sm mut" style="margin-top:10px">Smoothest way across: let the outro finish, or mix over a breakdown, then start the next intro at its own tempo.</p>`],
 ['Reading a join',()=>{const a=by('Noir'),b=by('Stargazer');return `<p>Between two tracks, one line: the dots (shared notes), the move, the mood arrow, and the energy.</p><div class="jn2" style="padding-left:0;cursor:default">${dots(7)}<span>same notes · ${dirOf(a,b)}</span>${enTxt(a,b)}</div><p class="sm mut" style="margin-top:8px">Tap any join for the keyboard and both energy shapes.</p>`}]];

  case 'add':{const [at,t]=v.split('|');const i=+at;insertAt(i,t,`Added ${t} after ${tracks()[i-1]?.title||'the start'}`);if(S.alt==='C')S.sel=i;S.focus=null;if(ph&&S.sheet==='between')S.sheet=null;break}
  case 'remove':{remember();const t=S.set[n];S.set.splice(n,1);S.sel=Math.max(0,Math.min(S.sel,S.set.length-1));S.playing=Math.min(S.playing,S.set.length-1);S.join=null;toast(`Removed ${t}`);break}
  case 'bridge':{const b=bridgeFor(n);if(!b.length){toast('No bridge found within the tempo range',false);break}remember();S.set.splice(n+1,0,...b.map(x=>x.title));S.join=null;S.sel=n+1;if(ph)S.sheet=null;toast(`Bridged with ${b.map(x=>x.title).join(' and ')}`);break}
  case 'undo':if(S.prev){S.set=S.prev;S.prev=null;S.sel=Math.min(S.sel,S.set.length-1);S.playing=Math.min(S.playing,S.set.length-1)}S.toast=null;break;
  case 'modal':S.modal=v;S.step=0;S.sheet=null;break;case 'close':S.modal=null;break;
  case 'step':S.step+=n;if(S.step>=BASICS.length){S.modal=null;S.step=0}S.step=Math.max(0,S.step);break;case 'stepTo':S.step=n;break;
  case 'bmode':S.bmode=v;break;case 'preset':S.preset=n;S.arc=presetArc(n);break;case 'len':S.len=n;break;case 'fg':S.fg=v;break;
  case 'gcycle':{const g=S.arc.G[n];g[1]=GENRES[(GENRES.indexOf(g[1])+1)%GENRES.length];S.preset=-1;break}
  case 'gsplit':{const G=S.arc.G;let best=0,bw=0;G.forEach(([x],i)=>{const w=(i<G.length-1?G[i+1][0]:1)-x;if(w>bw){bw=w;best=i}});if(bw<.1)break;const cur=G[best][1];G.splice(best+1,0,[G[best][0]+bw/2,GENRES.find(g=>g!==cur)]);S.preset=-1;break}case 'dir':S.dir=v;break;case 'shuffle':S.seed++;break;
  case 'apply':{const seq=buildSeq().map(t=>t.title);remember();if(v==='replace'){S.set=seq}else S.set=[...S.set,...seq.filter(t=>!S.set.includes(t))];S.modal=null;S.sel=0;S.join=null;S.arcB=false;toast(v==='replace'?`Set rebuilt: ${seq.length} tracks`:`Added ${seq.length} tracks`);break}
  case 'sheet':S.sheet=v||null;if(!v)S.join=S.alt==='B'||S.alt==='A'||S.alt==='C'||S.alt==='D'?null:S.join;break;
  case 'auto':S.auto=!S.auto;break;case 'saved':toast('Saved as the set "Night drive"',false);break;
  case 'playNext':S.playing=Math.min(S.set.length-1,S.playing+1);S.sel=S.playing;break;case 'playPrev':S.playing=Math.max(0,S.playing-1);S.sel=S.playing;break;
  case 'cview':S.cview=v;S.tab=v==='vibe'?'vibe':'map';break;case 'arcB':S.arcB=!S.arcB;break}
 render()}
document.addEventListener('click',e=>{const p=e.target.closest('[data-play]');if(p){const [a,b,c,d]=JSON.parse(p.dataset.play);playScale(a,b);if(c)playScale(c,d,8*.2+.3);return}
 const el=e.target.closest('[data-a]');if(!el)return;e.stopPropagation();const dv=el.closest('[data-dev]');act(el.dataset.a,decodeURIComponent(el.dataset.v||''),dv&&dv.dataset.dev)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-a][tabindex]')){e.preventDefault();e.target.click()}if(e.key==='Escape'&&(S.modal||S.sheet||S.join!=null)){S.modal=null;S.sheet=null;S.join=null;render()}});
// dragging the arcs: handles move, a click in an empty lane adds a point, double-click removes one
let drag=null;
const svgPt=(svg,e)=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
const arcX=(wrap,p)=>Math.max(0,Math.min(1,(p.x-APAD)/(+wrap.dataset.arcw-2*APAD)));
function arcVal(k,y){const [t,h]=LANES[k];const f=Math.max(0,Math.min(1,(t+h-y)/h));return k==='E'?f:f*6-3}
const drawArcs=()=>document.querySelectorAll('.arcw').forEach(el=>el.innerHTML=arcSVG(+el.dataset.arcw));
document.addEventListener('pointerdown',e=>{const wrap=e.target.closest('.arcw');if(!wrap)return;const h=e.target.closest('[data-h]'),lane=e.target.closest('[data-lane]');
 if(h)drag={key:h.dataset.h,wrap};
 else if(lane){const k=lane.dataset.lane,arr=S.arc[k],p=svgPt(wrap.querySelector('svg'),e),x=arcX(wrap,p),i=arr.findIndex(q=>q[0]>x);if(i<=0)return;arr.splice(i,0,[x,arcVal(k,p.y)]);drag={key:k+':'+i,wrap};S.preset=-1;drawArcs()}
 if(drag)e.preventDefault()});
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const p=svgPt(drag.wrap.querySelector('svg'),e),x=arcX(drag.wrap,p),[k,is]=drag.key.split(':'),i=+is,arr=S.arc[k];
 if(k==='G')arr[i][0]=Math.max(arr[i-1][0]+.04,Math.min(i<arr.length-1?arr[i+1][0]-.04:.96,x));
 else{if(i>0&&i<arr.length-1)arr[i][0]=Math.max(arr[i-1][0]+.02,Math.min(arr[i+1][0]-.02,x));arr[i][1]=arcVal(k,p.y)}
 S.preset=-1;drawArcs()});
document.addEventListener('pointerup',()=>{if(drag){drag=null;render()}});
document.addEventListener('dblclick',e=>{const h=e.target.closest('.arcw [data-h]');if(!h)return;const [k,is]=h.dataset.h.split(':'),i=+is,arr=S.arc[k];if(k==='G'?i>0:(i>0&&i<arr.length-1)){arr.splice(i,1);S.preset=-1;render()}});
let lastW=0;new ResizeObserver(([e])=>{const w=Math.round(e.contentRect.width);if(w!==lastW){lastW=w;render()}}).observe(document.getElementById('root'));
render();
</script></body></html>
