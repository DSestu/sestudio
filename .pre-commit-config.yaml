# The built frontend (frontend/dist) is committed so git-installs work without
# npm — but it's generated output, so no hook should lint or rewrite it.
exclude: ^frontend/dist/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.3
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^\.github/workflows/
      - id: ruff-format
        exclude: ^\.github/workflows/

  # frontend/dist is committed and force-included into the wheel
  # (see [tool.hatch.build.targets.wheel.force-include]), so it must never lag
  # behind the sources. Only runs when something the build consumes changes.
  - repo: local
    hooks:
      - id: frontend-build
        name: build frontend (npm run build)
        entry: scripts/build-frontend.sh
        language: script
        pass_filenames: false
        files: ^frontend/(src/|public/|index\.html|package(-lock)?\.json|vite\.config\.ts|tsconfig[^/]*\.json|eslint\.config\.js)
