name: Android app

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The runner image ships the Android SDK (ANDROID_HOME).
      - name: Build and lint
        run: ./gradlew assembleDebug lint --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: sestudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
