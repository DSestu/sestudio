name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-wheels:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Change package version
        run: |
          uv version "${{ needs.release-please.outputs.tag_name }}"

      - name: Bake in the default TMDB key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          key = os.environ.get("TMDB_API_KEY", "")
          if not key:
              raise SystemExit("::error::TMDB_API_KEY secret is not set")
          path = pathlib.Path("src/sestudio/_tmdb_default.py")
          path.write_text(
              "# Generated at release time — do not commit.\n"
              f"TMDB_API_KEY = {key!r}\n",
              encoding="utf-8",
          )
          PY

      - name: Build wheels
        run: uv build

      - name: Verify the wheel bundles the frontend
        run: |
          python3 -m zipfile -l dist/*.whl | grep -q 'sestudio/web/static/index.html' \
            || { echo '::error::built wheel is missing the frontend (sestudio/web/static)'; exit 1; }

      - name: Verify the wheel bundles the default TMDB key
        run: |
          python3 -m zipfile -l dist/*.whl | grep -q 'sestudio/_tmdb_default.py' \
            || { echo '::error::built wheel is missing the default TMDB key'; exit 1; }

      - name: Upload wheels to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            dist/*.whl
            dist/*.tar.gz

  publish-to-pypi:
    needs: [release-please, build-wheels]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): no API token. Configure a PyPI trusted
    # publisher for this repo + workflow + the `pypi` environment first.
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Change package version
        run: uv version "${{ needs.release-please.outputs.tag_name }}"

      - name: Bake in the default TMDB key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          key = os.environ.get("TMDB_API_KEY", "")
          if not key:
              raise SystemExit("::error::TMDB_API_KEY secret is not set")
          path = pathlib.Path("src/sestudio/_tmdb_default.py")
          path.write_text(
              "# Generated at release time — do not commit.\n"
              f"TMDB_API_KEY = {key!r}\n",
              encoding="utf-8",
          )
          PY

      - name: Build wheels
        run: uv build

      - name: Verify the wheel bundles the default TMDB key
        run: |
          python3 -m zipfile -l dist/*.whl | grep -q 'sestudio/_tmdb_default.py' \
            || { echo '::error::built wheel is missing the default TMDB key'; exit 1; }

      - name: Publish to PyPI
        run: uv publish
