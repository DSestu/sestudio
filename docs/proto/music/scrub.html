<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music · scrub the timeline</title>
<style>
:root{--b1:oklch(16% .015 240);--b2:oklch(20% .02 240);--b3:oklch(26% .025 240);--tx:oklch(92% .01 240);--pr:oklch(72% .16 230);--pri:oklch(18% .05 230);--ease:cubic-bezier(.2,.8,.2,1);--h:250}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--b1);color:var(--tx);font:14px/1.4 ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px;border-radius:10px}
.mut{color:color-mix(in oklch,var(--tx) 60%,transparent)}.fnt{color:color-mix(in oklch,var(--tx) 42%,transparent)}
.glass{background:hsl(205 62% 14%/.66);backdrop-filter:blur(24px) saturate(1.4);box-shadow:inset 0 0 0 1px rgb(255 255 255/.08),0 8px 24px rgb(0 0 0/.35)}
body.tv details.bar,body.tv #addbtn,body.tv .addp,body.tv .row .grip,body.tv .row .rm,body.tv #prev,body.tv #play,body.tv #next,body.tv #hint,body.tv #toast{display:none!important}
body.tv,body.tv *{cursor:none!important}body.tv *:not(#start):not(#start *){pointer-events:none!important}body.tv #thumb{display:none}

/* casting: sender shows the TV's volume; the TV shows a short volume overlay when it changes */
.castbar{display:none;align-items:center;gap:10px;margin-top:14px;padding:8px 12px;border-radius:14px;font-size:12px}
body.casting .castbar{display:flex}.castbar .cdev{flex:1;min-width:0;color:color-mix(in oklch,var(--tx) 70%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.castbar .cdev b{font-weight:600;color:var(--pr)}
.castbar .cdev:before{content:'Playing on ';font-weight:400}
.vbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgb(255 255 255/.06)}.vbtn .mx{display:none}.vbtn.m .mx{display:block}.vbtn.m .w1,.vbtn.m .w2,.vbtn.lo .w2{display:none}
#vol{width:150px;accent-color:var(--pr)}#volv{width:26px;text-align:right}
body.casting #cast{background:color-mix(in oklch,var(--pr) 24%,transparent);color:var(--pr)}
#volo{position:fixed;left:50%;top:40px;translate:-50% -8px;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:16px;opacity:0;transition:opacity .25s var(--ease),translate .25s var(--ease);pointer-events:none}
#volo.on{opacity:1;translate:-50% 0}#volo i{display:block;width:240px;height:6px;border-radius:3px;background:rgb(255 255 255/.12);overflow:hidden}#volo i b{display:block;height:100%;background:var(--pr);transition:width .15s}#volo span{width:34px;text-align:right;font-size:15px}
body.tv #cast,body.tv .castbar{display:none!important}
/* bpm + transition popover */
.bpm{margin-left:10px;display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;color:color-mix(in oklch,var(--tx) 55%,transparent)}
.bpm b{font-weight:500}.bpm i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;transition:none}.bpm.sync{color:oklch(80% .12 75)}.bpm.lock{color:var(--pr)}
.bpmq{font-style:normal;margin-left:7px;opacity:.55;font-variant-numeric:tabular-nums}
#mixp{position:fixed;z-index:14;width:296px;padding:12px;border-radius:14px;font-size:12px;opacity:0;translate:0 6px;pointer-events:none;transition:opacity .2s var(--ease),translate .2s var(--ease)}
#mixp.on{opacity:1;translate:0 0;pointer-events:auto}
#mixp .mh{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:2px}#mixp .mh span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mixp .mh button{width:26px;height:26px;border-radius:8px;background:rgb(255 255 255/.06)}
#mixp .mm{color:color-mix(in oklch,var(--tx) 55%,transparent);margin-bottom:10px;font-variant-numeric:tabular-nums}
#mixp .r{display:flex;align-items:center;gap:8px;margin:6px 0}#mixp .r>b{width:72px;white-space:nowrap;font-weight:500;color:color-mix(in oklch,var(--tx) 70%,transparent)}
#mixp .sg{display:flex;flex:1;gap:2px;padding:2px;border-radius:9px;background:rgb(255 255 255/.05)}#mixp .sg button{flex:1;padding:5px 0;border-radius:7px;font-size:12px;color:color-mix(in oklch,var(--tx) 65%,transparent)}
#mixp .sg button.on{background:color-mix(in oklch,var(--pr) 24%,transparent);color:var(--pr)}#mixp .sg button:disabled{opacity:.35}
#mixp .nd{display:flex;flex:1;align-items:center;gap:6px}#mixp .nd button{width:28px;height:26px;border-radius:7px;background:rgb(255 255 255/.06)}#mixp .nd span{flex:1;text-align:center;font-variant-numeric:tabular-nums}
#mixp .ft{display:flex;align-items:center;gap:8px;margin-top:10px}#mixp .ft span{flex:1;color:color-mix(in oklch,var(--tx) 55%,transparent)}#mixp .ft button{padding:6px 10px;border-radius:8px;background:color-mix(in oklch,var(--pr) 20%,transparent);color:var(--pr);font-weight:600}
body.tv #mixp,body.tv #spx,body.tv #spxbtn{display:none}#spxbtn{position:fixed;z-index:21;left:12px;top:10px;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;font-size:12px;font-weight:600;color:color-mix(in oklch,var(--tx) 75%,transparent)}#spx.open~#spxbtn,#spxbtn.on{color:var(--pr)}
#spx{position:fixed;z-index:22;left:12px;top:56px;width:340px;max-height:calc(100vh - 72px);display:none;flex-direction:column;border-radius:14px;font-size:12px;overflow:hidden}#spx.open{display:flex}#spx .sh{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 12px}#spx .sh b{flex:1;font-size:13px;white-space:nowrap}#spx .tb2{flex:1;display:flex;gap:2px}#spx .tb2 button{background:none;padding:4px 6px;font-weight:600;font-size:13px;color:color-mix(in oklch,var(--tx) 50%,transparent)}#spx .tb2 button.on{color:var(--tx);background:color-mix(in oklch,var(--tx) 10%,transparent)}#spx .pal button{display:flex;align-items:center;gap:8px}#spx .pal span{display:flex}#spx .pal i{width:10px;height:18px;border-radius:3px;margin-right:2px}#spx .sh button{padding:4px 8px;border-radius:8px;color:color-mix(in oklch,var(--tx) 70%,transparent);background:color-mix(in oklch,var(--tx) 8%,transparent)}#spx canvas{height:44px;margin:0 12px 4px;border-radius:6px;background:rgb(0 0 0/.25)}#spx .sb{overflow:auto;padding:0 12px 4px}#spx h4{margin:10px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:color-mix(in oklch,var(--tx) 45%,transparent)}#spx label{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:8px;min-height:26px}#spx label span{color:color-mix(in oklch,var(--tx) 70%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#spx input{width:100%;accent-color:var(--pr)}#spx output{text-align:right;font-variant-numeric:tabular-nums;color:color-mix(in oklch,var(--tx) 85%,transparent)}#spx p{margin:4px 12px 10px;font-size:11px}#spx .pre{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:4px}#spx .pre button{padding:9px 10px;border-radius:10px;text-align:left;font-weight:600;color:color-mix(in oklch,var(--tx) 80%,transparent);background:color-mix(in oklch,var(--tx) 7%,transparent)}#spx .pre button.on{background:color-mix(in oklch,var(--pr) 24%,transparent);color:var(--pr)}#spx .pd{margin:8px 0 6px;min-height:30px;color:color-mix(in oklch,var(--tx) 60%,transparent)}#spx .ft summary{cursor:pointer;padding:8px 0;font-weight:600;color:color-mix(in oklch,var(--tx) 70%,transparent)}
@media (max-width:759px){#spx{left:0;right:0;top:auto;bottom:0;width:auto;max-height:58vh;border-radius:16px 16px 0 0}#spx label{min-height:34px;grid-template-columns:104px 1fr 52px}}
#specw{position:fixed;inset:0;pointer-events:none}/* clipped wrapper: the canvas inside is zoomed and blurred, the frame is not */
#spec{position:absolute;inset:0;width:100vw;height:100vh;pointer-events:none;filter:blur(var(--sb,40px)) saturate(var(--ss,1.15));transform:scale(var(--sz,1.08));opacity:var(--so,.9);transition:opacity .4s}
#sky{position:fixed;inset:0;background:linear-gradient(to top,oklch(15% .045 var(--h)) 0%,oklch(10.5% .03 var(--h)) 45%,oklch(8.5% .02 var(--h)) 100%)}
#flow{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#flow.drag{cursor:grabbing}
.bar{position:fixed;left:50%;top:10px;translate:-50% 0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:6px;max-width:calc(100% - 20px)}.bar summary{list-style:none;cursor:pointer;font-size:12px;font-weight:600;padding:6px 12px;border-radius:10px;color:color-mix(in oklch,var(--tx) 75%,transparent)}.bar summary::-webkit-details-marker{display:none}.opts{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:8px;border-radius:14px;background:hsl(205 62% 10%/.92);box-shadow:0 8px 24px rgb(0 0 0/.45)}.opts .grp{background:none;box-shadow:none;backdrop-filter:none;justify-content:flex-start}.opts .grp b{width:84px}
.grp{display:flex;align-items:center;gap:3px;padding:4px;border-radius:12px;font-size:12px;font-weight:600}
.grp b{padding:0 6px;color:color-mix(in oklch,var(--tx) 45%,transparent)}
.grp button{padding:6px 10px;border-radius:9px;color:color-mix(in oklch,var(--tx) 70%,transparent)}
.grp button.on{background:color-mix(in oklch,var(--pr) 24%,transparent);color:var(--pr)}
.title{position:fixed;z-index:5;transform-origin:0 0;transition:left .62s var(--ease),top .62s var(--ease),transform .62s var(--ease);pointer-events:none}
.title p{font-size:15px;margin-bottom:4px}.title h1{font-size:96px;line-height:.95;font-weight:700;letter-spacing:-.04em;white-space:nowrap}
.ctl{position:fixed;z-index:6;width:420px;transition:left .62s var(--ease),top .62s var(--ease)}
.seek{display:flex;align-items:center;gap:12px;font-size:12px}
.seek #bar{cursor:pointer;touch-action:none;outline-offset:6px}
.seek #bar::before{content:"";position:absolute;left:0;right:0;top:-10px;bottom:-10px}
.seek #bar u{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--tx);box-shadow:0 2px 8px rgb(0 0 0/.5);scale:0;transition:scale .15s var(--ease);pointer-events:none}
.seek #bar:hover u,.seek #bar.on u,.seek #bar:focus-visible u{scale:1}
.seek #bar:hover,.seek #bar.on{height:6px}
.seek #bar em{position:absolute;bottom:16px;translate:-50% 0;font:600 11px ui-sans-serif,system-ui;font-style:normal;padding:3px 7px;border-radius:7px;background:hsl(205 62% 10%/.92);color:var(--tx);opacity:0;pointer-events:none;transition:opacity .15s;white-space:nowrap}
.seek #bar:hover em,.seek #bar.on em{opacity:1}.seek i{flex:1;height:4px;border-radius:2px;background:rgb(255 255 255/.16);position:relative}.seek i b{position:absolute;inset:0 auto 0 0;background:var(--pr);border-radius:2px}
.tr{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:12px}
.gb{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:rgb(255 255 255/.06)}
.play{width:64px;height:64px;border-radius:22px;background:var(--pr);color:var(--pri);display:grid;place-items:center}
.q{position:fixed;z-index:6;border-radius:16px;overflow:hidden;transition:left .62s var(--ease),top .62s var(--ease),width .62s var(--ease),height .62s var(--ease),border-radius .62s var(--ease),background-color .62s var(--ease)}
body.exp .q{background:var(--b2);box-shadow:none;backdrop-filter:none;border-radius:8px}
.q h3{font-size:13px;font-weight:600;padding:12px 12px 8px;display:flex;gap:8px}.q h3 span{margin-left:auto;font-weight:400;font-size:12px}
.row{--hl:0;display:flex;align-items:center;gap:10px;padding:7px 12px;font-size:13px;cursor:pointer;background:color-mix(in oklch,var(--pr) calc(var(--hl)*22%),transparent);transition:opacity .35s var(--ease)}.row:hover{background:color-mix(in oklch,var(--pr) calc(var(--hl)*22%),rgb(255 255 255/.05))}
.row .m{flex:1;min-width:0}.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row span{font-size:11px;color:color-mix(in oklch,var(--tx) 52%,transparent)}
.row b{color:color-mix(in oklch,var(--pr) calc(var(--hl)*100%),var(--tx))}.row.done{opacity:.42}
.meter{display:flex;gap:2px;align-items:end;height:16px}.meter i{width:4px;border-radius:2px}
.handle{display:none;padding:8px 0 6px;cursor:grab;touch-action:none}
body.small .handle{display:block}
.handle i{display:block;margin:0 auto;width:36px;height:4px;border-radius:3px;background:rgb(255 255 255/.25);transition:background .2s,transform .18s}
.handle.armed i{background:var(--pr);animation:bump .22s var(--ease)}
@keyframes bump{50%{transform:scale(1.18,1.6)}}
.q{overflow-y:auto!important;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgb(255 255 255/.2) transparent}
body.small:not(.exp) .q{overflow-y:hidden!important}
.q .handle,.q h3{position:sticky;z-index:2;background:hsl(205 60% 12%/.96)}.q .handle{top:0}.q h3{top:0}body.small .q h3{top:22px}
body.exp .q .handle,body.exp .q h3{background:var(--b2)}
body.pulling .q,body.pulling .title,body.pulling .ctl{transition:none!important}
.row .grip,.lrow .grip{display:flex;color:color-mix(in oklch,var(--tx) 30%,transparent);cursor:grab;touch-action:none;padding:4px 2px}
.row .grip:hover,.lrow .grip:hover{color:var(--tx)}
.row .dur,.lrow .dur{font-size:11px;width:30px;text-align:right}
.row .rm{width:22px;height:22px;border-radius:7px;color:color-mix(in oklch,var(--tx) 40%,transparent);font-size:16px;line-height:1;display:grid;place-items:center;opacity:0}
.row:hover .rm{opacity:1}.row button.rm:hover{background:rgb(255 255 255/.08);color:var(--tx)}
@media (hover:none){.row .rm{opacity:.6}}
.row.lift,.lrow.lift{opacity:.3}.row.leaving{pointer-events:none}
.ghost{position:fixed;z-index:40;pointer-events:none;border-radius:12px;box-shadow:0 14px 34px rgb(0 0 0/.55),inset 0 0 0 1px rgb(255 255 255/.12)!important;transform:scale(1.02)}
body.rdragging,body.rdragging *{cursor:grabbing!important;user-select:none}
#drop{position:fixed;z-index:41;height:2px;border-radius:1px;background:var(--pr);box-shadow:0 0 0 3px color-mix(in oklch,var(--pr) 22%,transparent);opacity:0;pointer-events:none;transition:top .08s}
.addbtn{display:none;margin-left:10px;height:26px;padding:0 10px;border-radius:9px;background:color-mix(in oklch,var(--pr) 20%,transparent);color:var(--pr);font-size:12px;font-weight:600}
body.exp .addbtn,body:not(.small) .addbtn{display:inline-flex;align-items:center}
.row,.lrow{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.q h3{align-items:center}
.addp{position:fixed;z-index:8;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;opacity:0;translate:16px 0;filter:blur(6px);pointer-events:none;transition:opacity .26s var(--ease),translate .26s var(--ease),filter .26s var(--ease),height .32s var(--ease)}
body.adding .addp{opacity:1;translate:0 0;filter:none;pointer-events:auto}
.addp{left:calc(100vw - 772px);top:92px;width:380px;height:calc(100vh - 112px)}
body.small .addp{left:0;top:auto;bottom:0;width:100vw;height:calc(100vh - 48px);border-radius:16px 16px 0 0;translate:0 24px}
body.small.adding .addp{translate:0 0}
.ah{display:flex;align-items:center;padding:12px 12px 8px}.ah b{flex:1;font-size:14px}.ah button{width:30px;height:30px;border-radius:9px;font-size:18px;background:rgb(255 255 255/.06)}
.tabs{display:flex;gap:4px;padding:0 10px 8px;flex-wrap:wrap}.tabs button{padding:6px 10px;border-radius:9px;font-size:12px;font-weight:600;color:color-mix(in oklch,var(--tx) 65%,transparent);background:rgb(255 255 255/.04)}
.tabs button.on{background:color-mix(in oklch,var(--pr) 24%,transparent);color:var(--pr)}
.addbody{flex:1;overflow-y:auto;padding:0 8px 10px;overscroll-behavior:contain}
.search{width:calc(100% - 8px);margin:2px 4px 8px;height:36px;border-radius:10px;border:0;padding:0 12px;background:rgb(0 0 0/.25);box-shadow:inset 0 0 0 1px rgb(255 255 255/.08);color:var(--tx);font:13px ui-sans-serif,system-ui}
.search:disabled{opacity:.5}
.folder{display:flex;flex-direction:column;padding:4px 8px 6px;font-size:12px;font-weight:600}.folder .fnt{font-weight:400;font-size:11px}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:10px;font-size:13px}.lrow:hover{background:rgb(255 255 255/.05)}
.lrow .m{flex:1;min-width:0}.lrow b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lrow .m span{font-size:11px;color:color-mix(in oklch,var(--tx) 52%,transparent)}
.lrow .add{width:26px;height:26px;border-radius:8px;background:color-mix(in oklch,var(--pr) 20%,transparent);color:var(--pr);font-size:16px;font-weight:600}
.lrow .nx{height:26px;padding:0 8px;border-radius:8px;background:rgb(255 255 255/.06);font-size:11px;font-weight:600;color:color-mix(in oklch,var(--tx) 75%,transparent)}
.lrow .inq{display:none;font-size:10.5px}.lrow.in .inq{display:inline}
.lrow.mock{opacity:.55}.sk{display:block;height:10px;border-radius:5px;background:rgb(255 255 255/.1)}
.lrow .add:disabled,.row2 .add:disabled{opacity:.4;cursor:not-allowed}
.mockbar{margin:2px 4px 10px;padding:10px 12px;border-radius:10px;font-size:12px;background:color-mix(in oklch,oklch(83% .16 85) 14%,transparent);color:oklch(88% .1 85)}
.row2{display:flex;gap:6px;align-items:center}.row2 .search{flex:1;margin-right:0}.row2 .add{height:36px;padding:0 12px;border-radius:10px;background:color-mix(in oklch,var(--pr) 20%,transparent);color:var(--pr);font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;z-index:50;padding:8px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
.hint{position:fixed;z-index:7;font-size:12px;padding:6px 10px;border-radius:10px;pointer-events:none;transition:opacity .3s}
.start{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgb(0 0 0/.35);backdrop-filter:blur(4px)}
.start button{height:52px;padding:0 22px;border-radius:16px;background:var(--pr);color:var(--pri);font-weight:600;font-size:15px}
</style></head>
<body>
<div id="sky"></div>
<div id="specw"><canvas id="spec" width="96" height="54" aria-hidden="true"></canvas></div>
<canvas id="flow" aria-label="The music, drag to scrub"></canvas>
<details class="bar" open><summary class="glass">Scrub options</summary><div class="opts">
 <div class="grp glass"><b>Mode</b><button data-g="mode" data-v="def" class="on">Default</button><button data-g="mode" data-v="exp">Expanded</button></div>
 <div class="grp glass"><b>Background</b><button data-g="bg" data-v="off">Off</button><button data-g="bg" data-v="wash" class="on">A · Wash</button><button data-g="bg" data-v="bloom">B · Bloom</button><button data-g="bg" data-v="field">C · Field</button><button data-g="bg" data-v="mirror">D · Mirror EQ</button><button data-g="bg" data-v="aurora">E · Aurora</button><button data-g="bg" data-v="ridge">F · Ridge</button><button data-g="bg" data-v="fall">G · Waterfall</button><button data-g="bg" data-v="pulse">H · Pulse</button><button id="spxopen">Presets…</button></div>
 <div class="grp glass"><b>Default mix</b><button data-g="mixd" data-v="fade">Fade 4 s</button><button data-g="mixd" data-v="sync" class="on">Beat sync</button></div><div class="grp glass"><b>Beat grid</b><button data-g="grid" data-v="1" class="on">On</button><button data-g="grid" data-v="0">Off</button></div>
