<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H · Tape</title>
<link rel="stylesheet" href="common.css">
<style>
.bar2 { display: flex; align-items: center; gap: 12px; padding: 18px 6px 10px }
.bar2 .sp { flex: 1 }
.az { display: flex; gap: 7px; font-size: 12px; color: var(--dim) }
.az .on { color: var(--blue); font-weight: 600 }
.mini { position: relative; height: 34px; margin: 0 6px }
.mini svg { width: 100%; height: 100%; display: block }
.win { position: absolute; top: -4px; bottom: -4px; border: 1.5px solid var(--blue); border-radius: 6px; background: oklch(72% .16 230 / .08) }
.lane-h { display: flex; align-items: baseline; gap: 10px; padding: 18px 6px 6px; font-size: 13px; color: var(--mut) }
.lane-h b { color: var(--fg); font-size: 14px; font-weight: 600 }
.tape { position: relative; height: 300px; overflow: hidden; margin: 0 6px; border-radius: 16px; background: oklch(17% .02 245); border: 1px solid oklch(30% .02 240 / .5) }
.tape > svg { position: absolute; top: 0; left: 0 }
.lb { position: absolute; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.lb.ar { font-size: 30px; font-weight: 300; letter-spacing: -.02em; color: oklch(80% .02 240 / .35); top: 12px }
.lb.al { top: 58px; font-size: 14px; font-weight: 600 }
.lb.al small { display: block; font-size: 12px; font-weight: 400; color: var(--mut) }
.lb.tt { top: 252px; font-size: 12px; color: var(--mut); line-height: 1.3 }
.lb.tt i { display: block; font-style: normal; font-size: 11px; color: var(--dim) }
.lb.tt.hov { color: var(--fg) }
.hovbtn { position: absolute; width: 36px; height: 36px; border-radius: 10px; background: var(--blue); color: var(--blue-ink); display: grid; place-items: center; box-shadow: 0 6px 16px oklch(0% 0 0 / .45) }
.now { position: absolute; right: 12px; top: 14px; display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; border-radius: 10px; background: oklch(26% .04 240 / .9); font-size: 12px; border: 1px solid var(--line) }
.lane { position: relative; height: 58px; margin: 0 6px; border-radius: 12px; background: oklch(17% .02 245); border: 1px solid oklch(30% .02 240 / .5); overflow: hidden; display: flex; align-items: center; gap: 14px; padding: 0 12px }
.lane .nm { width: 120px; flex: none; font-size: 13px }
.lane .nm small { display: block; font-size: 11px; color: var(--dim) }
.lane svg { flex: 1; display: block }
.ph { display: none }
@media (max-width: 700px) {
  .desk { display: none !important }
  .ph { display: block }
  .bar2 { padding: 12px 4px 8px; gap: 8px }
  .vt { position: relative; margin: 0 22px 0 4px }
  .vsec { padding: 14px 0 6px; position: sticky; top: 0; background: var(--bg); z-index: 2 }
  .vsec b { display: block; font-size: 16px; font-weight: 600 }
  .vsec small { font-size: 12px; color: var(--mut) }
  .vsec.ar { font-size: 24px; font-weight: 300; color: oklch(80% .02 240 / .4); padding: 8px 0 0; position: static }
  .vrow { position: relative; display: flex; align-items: center; margin: 2px 0; border-radius: 10px; overflow: hidden; background: oklch(18% .02 245) }
  .vrow svg { position: absolute; inset: 0; width: 100%; height: 100% }
  .vrow span { position: relative; padding: 0 10px; font-size: 13px; text-shadow: 0 1px 3px oklch(0% 0 0 / .9); display: flex; justify-content: space-between; width: 100% }
  .vrow span i { font-style: normal; color: oklch(90% .01 240 / .8); font-size: 12px }
  .vrow.hov { outline: 2px solid var(--blue) }
  .vmini { position: fixed; right: 6px; top: 150px; bottom: 170px; width: 9px; border-radius: 5px; overflow: hidden; background: oklch(25% .02 240) }
  .vmini svg { width: 100%; height: 100% }
  .vwin { position: absolute; left: 0; right: 0; border: 2px solid var(--fg); border-radius: 4px; background: oklch(100% 0 0 / .25) }
}
</style></head>
<body>
<main>
  <div class="top"><div class="top-row"><div class="title"><h1>Music</h1><p class="desk"><em class="tab">474</em> tracks · 4 libraries</p></div><div class="search desk" id="search"></div><div class="bell" id="bell"></div></div></div>
  <div class="bar2"><div class="seg"><button class="on">By artist</button><button>By mood</button><button>By tempo</button><button class="desk">Newest</button></div><span class="sp"></span><div class="az desk" id="az"></div></div>
  <div class="desk">
    <div class="mini" id="mini"></div>
    <div class="lane-h"><b>Library</b><span>scroll sideways · ${'x'}</span></div>
    <div class="tape" id="tape"></div>
    <div class="lane-h"><b>Playlists and flows</b><span>the same tape, cut into your lists</span></div>
    <div id="lanes" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>
  <div class="ph" id="vt"></div>
</main>
<script src="data.js"></script><script src="common.js"></script>
<script>
chrome()
const P = phone()
document.getElementById('search').innerHTML = icon('search', 18) + 'Search everything, or paste a link'
document.getElementById('bell').innerHTML = icon('bell')
document.getElementById('az').innerHTML = '#ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c => `<span class="${c === 'D' ? 'on' : ''}">${c}</span>`).join('')


// The whole library as one tape: artist, then album, then track.
const order = []
for (const [ar, ats] of [...groupBy(T, t => t.ar)].sort((a, b) => b[1].length - a[1].length))
  for (const [al, ts] of [...groupBy(ats, t => t.al)].sort((a, b) => b[1].length - a[1].length)) order.push({ ar, al, ts })
const total = T.reduce((a, t) => a + t.d, 0)
if (!P) document.querySelector('.lane-h span').textContent = `scroll sideways · ${T.length} tracks · ${fmtDur(total)} end to end`
const start = order.findIndex(o => o.al === 'Vexillology') - 1
const hov = order[start].ts[4]

if (!P) {
  const mini = document.getElementById('mini'), MW = mini.clientWidth
  let s = '', x = 0, w0 = 0, w1 = 0
  order.forEach((o, i) => { for (const t of o.ts) { const w = t.d / total * MW; s += `<rect x="${x.toFixed(2)}" y="${34 - (t.e || 5) / 100 * 30}" width="${Math.max(.6, w - .3).toFixed(2)}" height="${(t.e || 5) / 100 * 30}" fill="${t.m.color}" fill-opacity=".75"/>`; x += w } if (i === start) w0 = x - o.ts.reduce((a, t) => a + t.d, 0) / total * MW })
  mini.innerHTML = `<svg viewBox="0 0 ${MW} 34" preserveAspectRatio="none">${s}</svg>`
  // Main tape at 0.24 px per second.
  const tape = document.getElementById('tape'), TW = tape.clientWidth, K = .24, TH = 300
  let svg = '', html = '', tx = 30, lastAr = ''
  for (let i = start; i < order.length && tx < TW + 200; i++) {
    const o = order[i]
    if (o.ar !== lastAr) { html += `<span class="lb ar" style="left:${tx}px">${esc(o.ar)}</span>`; lastAr = o.ar }
    const g = summarise(o.al, o.ts, 'Album'), aw = o.ts.reduce((a, t) => a + t.d, 0) * K
    html += `<span class="lb al" style="left:${tx}px;max-width:${aw}px">${esc(o.al)}<small>${o.ts.length} tracks · ${fmtDur(g.dur)} · ${bpmRange(g)}</small></span>`
    svg += `<line x1="${tx - 14}" y1="56" x2="${tx - 14}" y2="${TH - 14}" stroke="oklch(40% .02 240 / .5)"/>`
    for (const t of o.ts) {
      const w = t.d * K, on = t === hov
      svg += `<path d="${silhouette(t.curve, tx + 2, w - 4, 132, 178)}" fill="${t.m.color}" fill-opacity="${on ? 1 : .8}"/>`
      if (on) svg += `<rect x="${tx - 1}" y="104" width="${w + 2}" height="148" rx="10" fill="none" stroke="var(--fg)" stroke-opacity=".8" stroke-width="1.5"/>`
      html += `<span class="lb tt ${on ? 'hov' : ''}" style="left:${tx + 2}px;width:${w - 6}px">${esc(t.t)}<i>${t.m.word} · ${t.bpm}</i></span>`
      if (on) html += `<span class="hovbtn" style="left:${tx + w / 2 - 18}px;top:160px">${icon('play', 16)}</span>`
      tx += w
    }
    tx += 30
  }
  tape.innerHTML = `<svg width="${TW}" height="${TH}" viewBox="0 0 ${TW} ${TH}">${svg}</svg>${html}<span class="now">${sigil(NOW, 28, 20, { r: 5 })}${icon('right', 12)} Black Bloc is playing · jump to it</span>`
  tape.querySelector('.now svg.ic').style.transform = 'rotate(180deg)'
  // Window on the minimap.
  const shown = order.slice(start).reduce((acc, o) => acc, 0)
  let wx0 = 0; for (let i = 0; i < start; i++) wx0 += order[i].ts.reduce((a, t) => a + t.d, 0)
  const wPx = TW / K / total * MW
  mini.insertAdjacentHTML('beforeend', `<span class="win" style="left:${wx0 / total * MW}px;width:${wPx}px"></span>`)
  // Lanes: playlists and flows on the same timeline scale.
  const lane = (name, sub, inner) => `<div class="lane"><span class="nm">${name}<small>${sub}</small></span>${inner}</div>`
  const lw = TW - 170
  document.getElementById('lanes').innerHTML =
    lane('Queue', `${PLAYLISTS[0].n} tracks · playing`, ribbon(PLAYLISTS[0].tracks, lw, 36, { gap: 2 })) +
    lane('New playlist', `${PLAYLISTS[1].n} tracks`, ribbon(PLAYLISTS[1].tracks, lw * PLAYLISTS[1].dur / PLAYLISTS[0].dur, 36, { gap: 2 }) + '<span style="flex:1"></span>') +
    FLOWS_.slice(0, 3).map(f => lane(f.name, 'flow · energy shape', flowShape(f, lw, 40))).join('')
} else {
  // Phone: the tape runs downwards; each track's height is its length.
  const K = .12
  let h = '', lastAr = ''
  for (let i = start; i < start + 3; i++) {
    const o = order[i], g = summarise(o.al, o.ts, 'Album')
    if (o.ar !== lastAr) { h += `<div class="vsec ar">${esc(o.ar)}</div>`; lastAr = o.ar }
    h += `<div class="vsec"><b>${esc(o.al)}</b><small>${o.ts.length} tracks · ${fmtDur(g.dur)} · ${bpmRange(g)}</small></div>`
    for (const t of o.ts) {
      const H = Math.max(34, t.d * K), id = 'v' + t.id
      const v = t.curve.length ? t.curve : [20, 20], n = v.length
      const L = v.map((e, k) => `${(50 - e / 100 * 50).toFixed(1)},${(k / (n - 1) * 100).toFixed(1)}`), R = v.map((e, k) => `${(50 + e / 100 * 50).toFixed(1)},${(k / (n - 1) * 100).toFixed(1)}`).reverse()
      // Horizontal silhouette across the row, played left to right.
      const top = v.map((e, k) => `${(k / (n - 1) * 100).toFixed(1)},${(50 - e / 100 * 48).toFixed(1)}`), bot = v.map((e, k) => `${(k / (n - 1) * 100).toFixed(1)},${(50 + e / 100 * 48).toFixed(1)}`).reverse()
      h += `<div class="vrow ${t === hov ? 'hov' : ''}" style="height:${H}px"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M${top.join('L')}L${bot.join('L')}Z" fill="${t.m.color}" fill-opacity=".55"/></svg><span>${esc(t.t)}<i>${t.m.word} · ${t.bpm}</i></span></div>`
    }
  }
  let ms = '', y = 0, wy = 0
  order.forEach((o, i) => { if (i === start) wy = y; for (const t of o.ts) { const hh = t.d / total * 100; ms += `<rect x="0" y="${y.toFixed(2)}" width="100" height="${Math.max(.15, hh - .05).toFixed(2)}" fill="${t.m.color}"/>`; y += hh } })
  document.getElementById('vt').innerHTML = `<div class="vt">${h}</div><div class="vmini"><svg viewBox="0 0 100 100" preserveAspectRatio="none">${ms}</svg><span class="vwin" style="top:${wy}%;height:9%"></span></div>`
}
</script>
</body></html>
