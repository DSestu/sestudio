<!doctype html>
<html lang="en" data-theme="sestudio-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sestudio · below the player · prototype</title>
<style>
:root{
  --b1:oklch(16% .015 240);--b2:oklch(20% .02 240);--b3:oklch(26% .025 240);--b4:oklch(34% .025 240);
  --bc:oklch(92% .01 240);--mut:oklch(92% .01 240/.62);--p:oklch(72% .16 230);--pc:oklch(18% .05 230);
  --good:oklch(76% .17 155);--warn:oklch(83% .16 85);--bad:oklch(68% .19 25);
  --ease:cubic-bezier(.2,.8,.2,1);--pad:14px;--gap:16px;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:oklch(12% .012 240);color:var(--bc);font:14px/1.43 ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
::selection{background:color-mix(in oklch,var(--p) 45%,transparent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--b3);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.if{fill:currentColor;stroke:none}

/* ---------- stage (the app) ---------- */
#stage{flex:1;overflow:auto;padding:20px 24px 80px}
#app{margin:0 auto;max-width:1180px;transition:max-width .3s var(--ease)}
#app.phone{max-width:390px;background:var(--b1);border-radius:28px;padding:12px 10px 24px;border:1px solid var(--b3);min-height:780px;box-shadow:0 20px 60px oklch(0% 0 0/.5)}
#app.desk{background:var(--b1);border-radius:18px;padding:16px 20px 28px}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:color-mix(in oklch,var(--b2) 80%,transparent);border:1px solid oklch(92% .01 240/.08);margin-bottom:14px}
.hdr h2{font-size:18px;font-weight:600;letter-spacing:-.025em;line-height:1.2}
.hdr p{font-size:12px;color:var(--mut)}
.player{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:#000 center/cover}
.player .shade{position:absolute;inset:0;background:linear-gradient(to top,oklch(0% 0 0/.7),transparent 40%)}
.player .ctl{position:absolute;left:14px;right:14px;bottom:10px;display:flex;align-items:center;gap:10px;font-size:13px}
.player .seek{position:absolute;left:14px;right:14px;bottom:40px;height:4px;border-radius:3px;background:oklch(100% 0 0/.25)}
.player .seek s{position:absolute;inset:0 auto 0 0;background:var(--p);border-radius:3px}
.player .mid{position:absolute;inset:0;display:grid;place-items:center}
.bigplay{width:64px;height:64px;border-radius:50%;background:var(--p);color:var(--pc);display:grid;place-items:center}
.phone .bigplay{width:48px;height:48px}
.ontv{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:oklch(14% .015 240/.82);backdrop-filter:blur(6px)}
.below{margin-top:var(--gap)}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.h3{font-weight:600;font-size:18px;letter-spacing:-.025em;line-height:1.25}
.phone .h3{font-size:16px}
.ttl{font-weight:600;font-size:15px;letter-spacing:-.01em}
.mut{color:var(--mut)}.sm{font-size:12px}.xs{font-size:11px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:6px;font-size:13px;border:1px solid transparent;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--b3)}
.btn.o{border-color:oklch(92% .01 240/.5)}
.btn.p{background:var(--p);color:var(--pc);font-weight:600}.btn.p:hover{background:oklch(78% .15 230)}
.btn.s{background:var(--b3)}.btn.s:hover{background:var(--b4)}
.btn.ic{width:32px;padding:0}
.btn.pill{border-radius:99px}
.btn[aria-pressed=true]{outline:2px solid var(--p);outline-offset:1px}
.vp{display:inline-flex;align-items:center;gap:2px;height:32px;border-radius:99px;border:1px solid var(--b3);background:var(--b2);padding:2px;font-size:13px}
.vp:hover{border-color:oklch(92% .01 240/.3)}
.vp b{background:var(--p);color:var(--pc);border-radius:99px;padding:0 10px;height:100%;display:grid;place-items:center}
.vp span{padding:0 4px 0 8px;color:var(--mut)}
.rate{background:var(--good);color:oklch(20% .05 155);font-weight:700;font-size:12px;border-radius:99px;padding:1px 8px;white-space:nowrap}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--b3);white-space:nowrap}
.av{border-radius:50%;background:var(--b3) center/cover;flex:none}
.post{border-radius:8px;background:var(--b3) center/cover;aspect-ratio:2/3;position:relative;transition:transform .2s var(--ease)}
.post:hover{transform:translateY(-2px)}
.post i{position:absolute;top:6px;right:6px;font:700 10px/1 system-ui;background:var(--good);color:oklch(20% .05 155);border-radius:99px;padding:3px 6px;font-style:normal}
.seg{display:flex;background:var(--b2);border-radius:10px;padding:3px;gap:2px;position:relative}
.seg>button{flex:1;text-align:center;padding:7px 10px;border-radius:8px;font-size:13px;color:var(--mut);white-space:nowrap;transition:background .2s var(--ease),color .2s}
.seg>button:hover{color:var(--bc)}
.seg>.on{background:color-mix(in oklch,var(--p) 22%,var(--b2));color:var(--bc);font-weight:600}
.under{display:flex;gap:22px;border-bottom:1px solid var(--b3)}
.under>button{padding:10px 0;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
.under>.on{color:var(--bc);border-color:var(--p);font-weight:600}
.panel{background:var(--b2);border-radius:10px;padding:var(--pad)}
.glass{background:color-mix(in oklch,var(--b1) 70%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid oklch(92% .01 240/.1);box-shadow:0 10px 30px oklch(0% 0 0/.5)}
.pop{position:absolute;z-index:20;border-radius:14px;padding:12px;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;translate:0 -6px;filter:blur(6px)}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;border-radius:20px 20px 0 0;padding:10px 16px 22px;animation:sheet .28s var(--ease)}
@keyframes sheet{from{translate:0 40px;opacity:0}}
.scrim{position:absolute;inset:0;z-index:25;background:oklch(0% 0 0/.45);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.grab{display:block;margin:0 auto 10px;width:36px;height:4px;border-radius:9px;background:var(--b4)}
.hr{height:1px;background:var(--b3);margin:var(--gap) 0}
.ep{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:14px;width:100%;text-align:left}
.ep:hover{background:var(--b3)}
.ep .n{font:12px ui-monospace,monospace;color:var(--mut);width:28px}
.ep.on{background:color-mix(in oklch,var(--p) 22%,var(--b2));color:var(--p)}
.bar{height:3px;border-radius:2px;background:var(--b4);position:relative;overflow:hidden}
.bar>s{position:absolute;inset:0 auto 0 0;background:var(--p)}
.sw{width:32px;height:19px;border-radius:99px;background:var(--b4);position:relative;flex:none;transition:background .2s}
.sw:after{content:"";position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:var(--bc);transition:translate .2s var(--ease),background .2s}
.sw.on{background:var(--p)}.sw.on:after{translate:13px 0;background:var(--pc)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.sel{display:inline-flex;align-items:center;gap:6px;height:30px;border:1px solid var(--b4);border-radius:6px;padding:0 8px;font-size:13px;background:var(--b1);color:var(--bc)}
.src{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;width:100%;text-align:left}
.src:hover{background:var(--b3)}
.src.on{background:color-mix(in oklch,var(--p) 22%,var(--b2))}
.src.bad{opacity:.55}
.hs{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:99px;background:var(--b3);font-size:12px;transition:background .15s}
.hs:hover{background:var(--b4)}
.hs.on{background:var(--p);color:var(--pc);font-weight:600}
.hs.dim{background:transparent;border:1px dashed var(--b4);color:var(--mut)}
.hs.bad{opacity:.55}
.hs.try{outline:2px solid var(--warn);animation:pulse 1s infinite alternate}
@keyframes pulse{to{outline-color:transparent}}
.lang{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;width:100%;text-align:left}
.lang.on{background:color-mix(in oklch,var(--p) 12%,var(--b2));outline:1px solid color-mix(in oklch,var(--p) 45%,transparent)}
.lang>b{font-size:15px;letter-spacing:.02em}
table.board{width:100%;border-collapse:collapse;font-size:13px}
table.board th{text-align:left;font-weight:500;color:var(--mut);font-size:11px;padding:6px 10px}
table.board td{padding:8px 10px;border-top:1px solid var(--b3)}
table.board tr.on td{background:color-mix(in oklch,var(--p) 14%,var(--b2))}
table.board tr:hover td{background:var(--b3)}
.out{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13px;width:100%;text-align:left}
.out:hover{background:var(--b3)}
.out.on{background:color-mix(in oklch,var(--p) 22%,var(--b2))}
.rad{width:14px;height:14px;border-radius:50%;border:2px solid var(--b4);flex:none}
.out.on .rad{border:4px solid var(--p)}
.banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13px;background:color-mix(in oklch,var(--warn) 14%,var(--b2));border:1px solid color-mix(in oklch,var(--warn) 40%,transparent)}
.banner.tv{background:color-mix(in oklch,var(--p) 14%,var(--b2));border-color:color-mix(in oklch,var(--p) 40%,transparent)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--warn);border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{rotate:360deg}}
.link{color:var(--p)}.link:hover{text-decoration:underline;text-underline-offset:3px}
.fade-in{animation:fade .25s var(--ease)}
.stagebg{position:relative;border-radius:14px;overflow:hidden}
.stagebg>.bg{position:absolute;inset:0;background:center 25%/cover;z-index:0}
.stagebg>.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,oklch(16% .015 240/var(--bgk)),var(--b1) 78%)}
.stagebg>*:not(.bg){position:relative;z-index:1}
.cards{display:grid;gap:12px}

/* comment mode */
body.cm [data-fb]{outline:1px dashed color-mix(in oklch,var(--warn) 55%,transparent);outline-offset:2px;cursor:crosshair}
body.cm [data-fb]:hover{outline:2px solid var(--warn);background-color:color-mix(in oklch,var(--warn) 8%,transparent)}
.fbpin{position:absolute;z-index:50;width:20px;height:20px;border-radius:50%;background:var(--warn);color:oklch(20% .05 85);font:700 11px/20px system-ui;text-align:center;pointer-events:none;box-shadow:0 2px 6px oklch(0% 0 0/.5)}
#cbox{position:fixed;z-index:100;width:300px;border-radius:12px;padding:12px;display:none}
#cbox textarea,.side textarea{width:100%;min-height:72px;resize:vertical;background:var(--b1);color:var(--bc);border:1px solid var(--b4);border-radius:8px;padding:8px;font:13px/1.4 system-ui}

/* ---------- side panel (the prototype's own UI) ---------- */
.side{width:340px;flex:none;height:100%;overflow:auto;background:oklch(14% .012 240);border-left:1px solid var(--b3);padding:16px 16px 40px;font-size:13px}
.side h1{font-size:15px;font-weight:600;letter-spacing:-.01em}
.side h3{font-size:12px;font-weight:600;color:var(--mut);margin:18px 0 8px}
.side .seg>button{padding:6px 6px;font-size:12px;white-space:normal;min-width:0}
.dirs{display:flex;flex-direction:column;gap:4px}
.dirs button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid transparent}
.dirs button:hover{background:var(--b2)}
.dirs button.on{background:var(--b2);border-color:color-mix(in oklch,var(--p) 50%,transparent)}
.dirs b{font-size:15px;color:var(--p);width:14px}
.dirs .v{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--b3);white-space:nowrap}
.tune{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin:6px 0}
.tune>label{color:var(--mut);font-size:12px}
.tune input[type=range]{width:100%;accent-color:var(--p)}
.verdict{display:flex;gap:6px}
.verdict button{flex:1;padding:6px;border-radius:8px;background:var(--b2);font-size:12px}
.verdict button.on[data-v=keep]{background:color-mix(in oklch,var(--good) 30%,var(--b2))}
.verdict button.on[data-v=maybe]{background:color-mix(in oklch,var(--warn) 25%,var(--b2))}
.verdict button.on[data-v=drop]{background:color-mix(in oklch,var(--bad) 30%,var(--b2))}
.note{display:flex;gap:8px;padding:8px;border-radius:8px;background:var(--b2);margin-bottom:6px;font-size:12px}
.note .k{color:var(--warn);font-weight:700}
.toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;padding:10px 16px;border-radius:10px;z-index:200;animation:pop .25s var(--ease)}
#sideToggle{display:none}
@media (max-width:820px){
  body{display:block;overflow:auto}
  #stage{padding:10px 6px 90px;overflow:visible}
  #app.phone{border:0;border-radius:0;padding:8px 6px 24px;box-shadow:none;background:transparent}
  .side{position:fixed;inset:auto 0 0 0;height:78dvh;width:auto;z-index:150;border-left:0;border-top:1px solid var(--b3);border-radius:18px 18px 0 0;translate:0 100%;transition:translate .3s var(--ease)}
  .side.open{translate:0 0}
  #sideToggle{display:inline-flex;position:fixed;right:14px;bottom:14px;z-index:160}
}
</style>

// ---------------------------------------------------------------- C · Version board
function C() {
  const m = M(), t = S.t, L = m.langs
  const hidden = h => t.failing === 'hide' && h[2] === 'bad'
  const chips = (l) => L[l].length ? L[l].map((h, i) => hidden(h) ? '' : `<button class="hs ${l === S.lang && i === S.host ? 'on' : ''} ${h[2] === 'bad' ? 'bad' : ''} ${S.play === 'failed' && l === S.lang && i === S.host + 1 ? 'try' : ''}" data-act="pick:${l}:${i}">${l === S.lang && i === S.host ? ic('play', 'if', 'width:12px') : `<span class="dot" style="background:var(--${h[2]})"></span>`}${h[0]} · ${h[1]}${h[3] ? ` <span class="${l === S.lang && i === S.host ? '' : 'mut'}">${h[3]}</span>` : ''}</button>`).join('') : gapBox(true, l)
  const board = t.board === 'chips'
    ? `<div class="panel col" data-fb="Version board" style="padding:6px;gap:4px">${Object.keys(L).map(l => `<div class="lang ${l === S.lang ? 'on' : ''}"><b class="${L[l].length ? '' : 'mut'}">${l}</b><div class="row" style="flex-wrap:wrap;gap:6px">${chips(l)}</div></div>`).join('')}</div>`
    : `<div class="panel" data-fb="Version board (table)" style="padding:4px 0"><table class="board"><tr><th>Version</th><th>Site</th><th>Host</th><th>Last time</th><th></th></tr>
       ${Object.keys(L).flatMap(l => L[l].length ? L[l].map((h, i) => hidden(h) ? '' : `<tr class="${l === S.lang && i === S.host ? 'on' : ''}" data-act="pick:${l}:${i}" style="cursor:pointer"><td>${i === 0 ? `<b>${l}</b>` : ''}</td><td>${h[0]}</td><td class="mut">${h[1]}</td><td><span class="row"><span class="dot" style="background:var(--${h[2]})"></span><span class="xs mut">${h[3] || 'fine'}</span></span></td><td class="xs" style="color:var(--p)">${l === S.lang && i === S.host ? 'Playing' : 'Play'}</td></tr>`) : [`<tr><td><b class="mut">${l}</b></td><td colspan="4">${gapBox(true, l)}</td></tr>`]).join('')}</table></div>`
  const watch = t.watchOn === 'list'
    ? `<div data-fb="Watch on (devices)"><div class="xs mut" style="margin:2px 0 6px 4px">Watch on</div>${DEVICES.map((d, i) => `<button class="out ${S.device === i && (i === 0 ? S.play !== 'tv' : S.play === 'tv') ? 'on' : ''}" data-act="${i === 0 ? 'bringback' : 'cast:' + i}"><span class="rad"></span>${ic(i === 0 && phone() ? 'phn' : d[0])}${i === 0 && phone() ? 'This phone' : d[1]}<span class="xs mut" style="margin-left:auto">${d[2]}</span></button>`).join('')}</div>`
    : `<div data-fb="Watch on (devices)"><div class="xs mut" style="margin:2px 0 6px 4px">Watch on</div><div class="row" style="flex-wrap:wrap;gap:6px">${DEVICES.map((d, i) => `<button class="hs ${(i === 0 ? S.play !== 'tv' : S.play === 'tv' && S.device === i) ? 'on' : ''}" data-act="${i === 0 ? 'bringback' : 'cast:' + i}">${ic(i === 0 && phone() ? 'phn' : d[0], '', 'width:13px')}${i === 0 && phone() ? 'This phone' : d[1]}</button>`).join('')}</div></div>`
  const pbLine = `<div class="row sm" style="margin-top:10px;padding:8px 10px;border-top:1px solid var(--b3);position:relative"><span class="mut grow">Source 716p · 23.98 fps · AI 4</span><button class="btn ic" data-act="pop:pb" data-fb="Playback button">${ic('sl')}</button>${phone() ? '' : popover('pb', `<div class="col" style="gap:12px;width:320px">${playbackFields()}</div>`, 'right:0;bottom:40px')}</div>
   <button class="row sm" data-act="autoplay" style="padding:2px 10px;width:100%"><span class="grow" style="text-align:left">Autoplay next</span><span class="sw ${S.autoplay ? 'on' : ''}"></span></button>`
  const open = t.aboutC === 'open' || S.aboutOpen

    : `<button class="row panel" data-act="about" data-fb="About (one line)" style="width:100%;padding:12px 14px;text-align:left;flex-wrap:wrap"><span class="ttl">About${phone() ? '' : ' ' + m.title}</span><span class="rate">★ ${m.rating.toFixed(1)}</span>${phone() ? '' : `<span class="mut sm">${m.year} · ${m.genres.join(', ')} · ${m.who}</span>`}<span class="grow"></span>${phone() ? '' : m.cast.slice(0, 3).map(([c], i) => `<span class="av" style="width:26px;height:26px;margin-left:${i ? -12 : 0}px;background-image:url(${T}w185/${c}.jpg)"></span>`).join('') + `<span class="mut sm">Cast, synopsis, ${m.similar.length} similar</span>`}${ic(phone() ? 'rt' : 'dn', 'mut')}</button>`
  if (phone()) {

     ${S.kind === 'series' ? `<button class="row panel" style="width:100%;padding:10px 12px" data-act="pop:eps" data-fb="Episodes row"><span class="sm grow" style="text-align:left">Episodes · S1</span><span class="xs mut">2 of 62 watched</span>${ic('rt', 'mut')}</button>` : ''}
     ${about}
    </div>${sheet('eps', 'Episodes', episodes()) + sheet('pb', 'Playback', `<div class="col" style="gap:14px">${playbackFields()}</div>`)}`
  }
  return `<div class="below col" style="gap:14px">
   <div class="row" style="gap:12px" data-fb="Episode line"><span class="h3">${lineTitle()}</span><span class="mut sm">${S.kind === 'series' ? 'S1 · 48 min' : m.sub}</span></div>
   ${statusBanner()}
   <div style="display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:20px">${board}<div>${watch}${pbLine}</div></div>

}

// ---------------------------------------------------------------- D · Episode stage
function D() {
  const m = M(), t = S.t, series = S.kind === 'series'

  const pill = `<div class="row" style="justify-content:center;${t.pillPlace === 'on the edge' ? 'margin-top:-20px' : 'margin-top:12px'};position:relative;z-index:5">

    ${S.play === 'tv' ? `<button class="btn pill s" data-act="bringback">${ic(phone() ? 'phn' : 'mon')}${phone() ? 'Back' : 'Bring back'}</button>` : `<button class="btn p pill" data-act="pop:tv">${ic('tv')}${phone() ? 'TV' : 'Send to TV'}</button>`}

   </div></div>`
  const next = series && S.ep < 7 ? [S.ep + 1, epTitle(S.ep + 1)] : null
  const upNext = !next ? '' : t.upNext === 'card'

       <div style="padding:12px 14px"><div class="xs mut">Up next</div><div class="ttl" style="margin:2px 0 8px">E0${next[0]} · ${next[1]}</div><button class="row sm mut" data-act="autoplay" style="width:100%"><span class="grow" style="text-align:left">${S.autoplay ? 'Starts by itself after this one' : 'Autoplay is off'}</span><span class="sw ${S.autoplay ? 'on' : ''}"></span></button></div></div>`
    : `<button class="row panel" data-act="ep:${next[0]}" data-fb="Up next (row)" style="width:100%;text-align:left;align-self:start"><span class="av" style="border-radius:8px;width:96px;height:54px;background:url(${m.backdrop}) ${30 + S.ep * 17}% 60%/260% auto"></span><span class="grow"><span class="xs mut" style="display:block">Up next${S.autoplay ? ' · autoplay' : ''}</span><span class="sm" style="font-weight:600">E0${next[0]} · ${next[1]}</span></span>${ic('play', 'if', 'color:var(--p)')}</button>`
  const hero = series
    ? `<div class="row" style="gap:12px;align-items:baseline"><span style="font:600 ${phone() ? 13 : 15}px ui-monospace,monospace;color:var(--p)">E${String(S.ep).padStart(2, '0')}</span><span style="font-size:${phone() ? 24 : 30}px;font-weight:600;letter-spacing:-.03em;line-height:1.15">${epTitle(S.ep)}</span></div>
       <div class="mut sm" style="margin:8px 0 12px">Season 1 · ${info[0]} · ${info[1]}</div><p style="font-size:15px;line-height:1.6;max-width:62ch">${info[2]}</p>`
    : `<div style="font-size:${phone() ? 26 : 34}px;font-weight:600;letter-spacing:-.03em;line-height:1.1">${m.title}</div><div class="row" style="margin:10px 0 12px;flex-wrap:wrap">${aboutBits(m).replace('margin-bottom:10px', '')}</div><p style="font-size:15px;line-height:1.6;max-width:66ch">${m.overview}</p>${credits(m)}`
  const cast = t.epCast === 'show' ? `<div class="xs mut" style="margin:20px 0 8px">${series ? 'In this episode' : 'Cast'}</div>${phone() ? castRow(6, 48) : castGrid(series ? 3 : 8, 40, series ? 3 : 4)}` : ''
  return `<div class="stagebg" style="--bgk:${(1 - t.bgk / 100).toFixed(2)};margin:${phone() ? '-4px -4px 0' : '0 -8px'};padding:${phone() ? '4px 4px 16px' : '0 8px 20px'}">
   <div class="bg" style="background-image:url(${m.backdrop});opacity:${t.bgk / 100}"></div>
   ${pill}
   <div style="margin-top:14px">${statusBanner()}${tvBanner()}</div>
   <div data-fb="Episode stage" style="display:grid;grid-template-columns:${phone() || !upNext ? 'minmax(0,1fr)' : 'minmax(0,1fr) 340px'};gap:${phone() ? 18 : 40}px;margin-top:18px">
    <div>${hero}${cast}</div>${upNext}

   ${S.aboutOpen ? `<div class="fade-in" style="margin-top:12px"><p style="max-width:66ch">${m.overview}</p>${credits(m)}<div style="margin-top:14px">${castRow(8, 52)}</div></div>` : ''}` : ''}
   ${phone() && series ? `<button class="row panel" style="width:100%;margin-top:12px" data-act="pop:eps">${'<span class="sm grow" style="text-align:left">All episodes</span><span class="xs mut">S1 · 2 of 7</span>' + ic('rt', 'mut')}</button>` : ''}
   <div class="ttl" style="margin:18px 0 10px">More like this</div>${shelf(phone() ? 6 : 7, phone() ? 3 : 7)}
  </div>${phone() ? phoneSheets() + sheet('eps', 'Episodes', episodes()) : ''}`
}

// ---------------------------------------------------------------- render
const app = document.getElementById('app')
function render() {
  app.className = phone() ? 'phone' : 'desk'
  document.documentElement.style.setProperty('--gap', S.t.density === 'compact' ? '10px' : '16px')
  document.documentElement.style.setProperty('--pad', S.t.density === 'compact' ? '10px' : '14px')
  const body = S.kind === 'local' && S.dir !== 'A' ? `<p class="below mut">The local-file case is only mocked for A.</p>` : { A, B, C, D }[S.dir]()
  app.style.position = 'relative'
  app.innerHTML = header() + player() + body + pins()
  renderSide(); save(); placePins()
}
function pins() {
  return '' // pins are placed after render (need element positions)
}

// ---------------------------------------------------------------- side panel
const side = document.getElementById('side')
function segUI(key, opts, val) { return `<div class="seg">${opts.map(([v, l]) => `<button class="${val === v ? 'on' : ''}" data-set="${key}:${v}">${l}</button>`).join('')}</div>` }
function renderSide() {
  const tunes = [...TUNES._, ...TUNES[S.dir]]
  const notesHere = S.notes.map((n, i) => ({ ...n, i }))
  side.innerHTML = `
  <div class="row"><h1 class="grow">Below the player</h1><button class="btn ic" data-ui="closeSide" style="${innerWidth < 820 ? '' : 'display:none'}">${ic('x')}</button></div>
  <p class="xs mut" style="margin-top:4px">Pick a direction, tune it, leave notes on anything. Everything works: tabs, pills, Send to TV, sources, episodes.</p>
  <h3>Direction</h3>
  <div class="dirs">${Object.entries(DIRS).filter(([k]) => k === 'A' || S.showOld).map(([k, [n, d]]) => `<button class="${S.dir === k ? 'on' : ''}" data-set="dir:${k}"><b>${k}</b><span class="grow"><span style="display:block;font-weight:600">${n}</span><span class="xs mut">${d}</span></span>${S.verdict[k] ? `<span class="v">${S.verdict[k]}</span>` : ''}</button>`).join('')}</div>
  <button class="btn xs mut" data-ui="old" style="margin-top:4px">${S.showOld ? 'Hide' : 'Show'} earlier directions (B, C, D)</button>
  <h3>Look at it as</h3>
  ${segUI('dev', [['desk', 'Desktop'], ['phone', 'Phone']], S.dev)}
  <div style="height:6px"></div>${segUI('kind', [['series', 'Series'], ['film', 'Film'], ['local', 'Local file']], S.kind)}
  <div style="height:6px"></div>${segUI('play', [['playing', 'Playing'], ['idle', 'Not started'], ['tv', 'On TV'], ['failed', 'Failed']], S.play)}
  <h3>Tune ${S.dir}</h3>
  ${tunes.map(([k, l, o]) => typeof o === 'string'
    ? `<div class="tune"><label>${l}</label><input type="range" min="${o.split(':')[1]}" max="${o.split(':')[2]}" value="${S.t[k]}" data-range="${k}"></div>`
    : `<div class="tune"><label>${l}</label>${segUI('t.' + k, o.map(v => [v, v]), S.t[k])}</div>`).join('')}
  <h3>Your verdict on ${S.dir}</h3>
  <div class="verdict">${[['keep', 'Keep'], ['maybe', 'Maybe'], ['drop', 'Drop']].map(([v, l]) => `<button data-v="${v}" class="${S.verdict[S.dir] === l ? 'on' : ''}" data-verdict="${l}">${l}</button>`).join('')}</div>
  <h3>Notes</h3>
  <button class="btn ${document.body.classList.contains('cm') ? 'p' : 's'}" data-ui="cm" style="width:100%">${ic('msg')}${document.body.classList.contains('cm') ? 'Click any outlined part… (Esc to stop)' : 'Comment on a part'}</button>
  <div style="margin-top:8px">${notesHere.length ? notesHere.map(n => `<div class="note"><span class="k">${n.i + 1}</span><span class="grow"><span class="xs mut" style="display:block">${n.dir} · ${n.dev} · ${n.kind} · ${esc(n.part)}</span>${esc(n.text)}</span><button class="btn ic" data-del="${n.i}" style="width:22px;height:22px">${ic('x', '', 'width:12px')}</button></div>`).join('') : '<p class="xs mut">No notes yet.</p>'}</div>
  <textarea placeholder="Anything else: mixes you want (e.g. C's board + A's About), what's missing…" data-general>${esc(S.general)}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn p grow" data-ui="send">Send to Claude</button><button class="btn s" data-ui="copy">Copy</button></div>
  <button class="btn xs mut" data-ui="reset" style="margin-top:12px">Reset prototype</button>`
}

// ---------------------------------------------------------------- events
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-set],[data-ui],[data-verdict],[data-del]')
  // comment mode: capture clicks on the stage
  if (document.body.classList.contains('cm') && e.target.closest('#app')) {
    const fb = e.target.closest('[data-fb]')
    if (fb) { e.preventDefault(); e.stopPropagation(); openComment(fb, e.clientX, e.clientY) }
    return
  }
  if (!el) { if (S.pop && !e.target.closest('[data-pop]')) { S.pop = null; render() } return }
  if (el.dataset.set) {
    const [k, v] = el.dataset.set.split(/:(.*)/)
    if (k.startsWith('t.')) S.t[k.slice(2)] = v
    else { S[k] = v; if (k === 'kind') { S.lang = S.kind === 'series' ? 'VOSTFR' : 'VF'; S.host = 0 } }
    S.pop = null; return render()
  }
  if (el.dataset.verdict) { S.verdict[S.dir] = S.verdict[S.dir] === el.dataset.verdict ? undefined : el.dataset.verdict; return render() }
  if (el.dataset.del) { S.notes.splice(+el.dataset.del, 1); render(); return placePins() }
  if (el.dataset.ui) return ui(el.dataset.ui)
  const [a, b, c] = el.dataset.act.split(':')
  if (a === 'pop') S.pop = S.pop === b ? null : b
  else if (a === 'close') S.pop = null
  else if (a === 'lang') { S.lang = b; S.host = 0; if (S.play === 'failed') S.play = 'playing' }
  else if (a === 'host') { S.host = +b; S.play = S.play === 'tv' ? 'tv' : 'playing'; S.pop = phone() ? S.pop : null }
  else if (a === 'pick') { S.lang = b; S.host = +c; if (S.play !== 'tv') S.play = 'playing' }
  else if (a === 'cast') { S.device = +b; S.play = 'tv'; S.pop = null }
  else if (a === 'bringback') { S.play = 'playing'; S.device = 0 }
  else if (a === 'start') S.play = 'playing'
  else if (a === 'autoplay') S.autoplay = !S.autoplay
  else if (a === 'tab') S.tab[b] = c
  else if (a === 'ep') { S.ep = +b; S.pop = null; if (S.play === 'idle') S.play = 'playing' }
  else if (a === 'watch') S.watchVF = { ...S.watchVF, [b]: true }
  else if (a === 'about') S.aboutOpen = !S.aboutOpen
  else if (a === 'dl') S.dl = true
  render(); placePins()
})
document.addEventListener('input', e => {
  if (e.target.dataset.range) { S.t[e.target.dataset.range] = +e.target.value; const y = side.scrollTop; const k = e.target.dataset.range; render(); side.scrollTop = y; side.querySelector(`[data-range=${k}]`)?.focus() }
  if ('general' in e.target.dataset) { S.general = e.target.value; save() }
})
document.addEventListener('keydown', e => { if (e.key === 'Escape') { document.body.classList.remove('cm'); closeComment(); S.pop = null; render(); placePins() } })
addEventListener('resize', placePins)
document.getElementById('sideToggle').onclick = () => side.classList.toggle('open')

function ui(k) {
  if (k === 'cm') { document.body.classList.toggle('cm'); side.classList.remove('open'); renderSide(); placePins() }
  if (k === 'old') { S.showOld = !S.showOld; renderSide(); save() }
  if (k === 'closeSide') side.classList.remove('open')
  if (k === 'reset' && confirm('Clear all choices and notes?')) { localStorage.removeItem('wbp'); S = structuredClone(DEFAULT); render(); placePins() }
  if (k === 'copy') navigator.clipboard.writeText(feedbackText()).then(() => toast('Copied. Paste it to Claude.'))
  if (k === 'send') fetch('/feedback', { method: 'POST', body: JSON.stringify(payload()) })
    .then(r => { if (!r.ok) throw 0; toast('Sent. Tell Claude "feedback sent".') })
    .catch(() => navigator.clipboard.writeText(feedbackText()).then(() => toast("Couldn't reach the server; copied instead.")))
}
function payload() { return { verdict: S.verdict, notes: S.notes, general: S.general, last: { dir: S.dir, dev: S.dev, kind: S.kind, play: S.play }, tunes: S.t } }
function feedbackText() {
  return `Below-player prototype feedback\nVerdicts: ${Object.entries(S.verdict).filter(e => e[1]).map(([k, v]) => k + '=' + v).join(', ') || 'none'}\n` +
    S.notes.map((n, i) => `${i + 1}. [${n.dir} · ${n.dev} · ${n.kind} · ${n.part}] ${n.text}\n   tunes: ${JSON.stringify(n.tunes)}`).join('\n') + `\nGeneral: ${S.general}\nTunes now: ${JSON.stringify(S.t)}`
}
function toast(msg) { const d = document.createElement('div'); d.className = 'toast glass'; d.textContent = msg; document.body.append(d); setTimeout(() => d.remove(), 2600) }

// comments pinned to parts
const cbox = document.getElementById('cbox')
let target = null
function openComment(el, x, y) {
  target = el
  cbox.innerHTML = `<div class="xs mut" style="margin-bottom:6px">${S.dir} · ${esc(el.dataset.fb)}</div><textarea placeholder="What should change here?"></textarea><div class="row" style="margin-top:8px;justify-content:flex-end"><button class="btn s" data-c="x">Cancel</button><button class="btn p" data-c="ok">Add note</button></div>`
  cbox.style.display = 'block'
  cbox.style.left = Math.min(x, innerWidth - 316) + 'px'; cbox.style.top = Math.min(y + 8, innerHeight - 190) + 'px'
  cbox.querySelector('textarea').focus()
}
function closeComment() { cbox.style.display = 'none'; target = null }
cbox.addEventListener('click', e => {
  e.stopPropagation()
  const c = e.target.closest('[data-c]')?.dataset.c
  if (c === 'x') closeComment()
  if (c === 'ok') {
    const text = cbox.querySelector('textarea').value.trim()
    if (text) S.notes.push({ dir: S.dir, dev: S.dev, kind: S.kind, play: S.play, part: target.dataset.fb, text, tunes: Object.fromEntries([...TUNES._, ...TUNES[S.dir]].map(([k]) => [k, S.t[k]])) })
    closeComment(); render(); placePins()
  }
})
cbox.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) cbox.querySelector('[data-c=ok]').click() })
function placePins() {
  app.querySelectorAll('.fbpin').forEach(p => p.remove())
  const base = app.getBoundingClientRect()
  S.notes.forEach((n, i) => {
    if (n.dir !== S.dir || n.dev !== S.dev) return
    const el = [...app.querySelectorAll('[data-fb]')].find(e => e.dataset.fb === n.part)
    if (!el) return
    const r = el.getBoundingClientRect()
    const p = document.createElement('div'); p.className = 'fbpin'; p.textContent = i + 1
    p.style.left = (r.right - base.left - 10) + 'px'; p.style.top = (r.top - base.top - 10) + 'px'
    app.append(p)
  })
}
render(); placePins()
</script>
</body>
</html>
