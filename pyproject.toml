[project]
name = "sestudio"
version = "0.1.0"
authors = [
    { name = "DSestu", email = "davidsestu@sencrop.com" },
]
description = "Download episodes from fstream"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fire>=0.7.1",
    "cryptography>=48.0.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.34",
    "yt-dlp>=2026.3.17",
    "async-upnp-client>=0.48.0",
]

[project.urls]
Source = "https://github.com/DSestu/sestudio"
Issues = "https://github.com/DSestu/sestudio/issues"
Changelog = "https://github.com/DSestu/sestudio/releases"
License = "https://github.com/DSestu/sestudio/blob/main/LICENSE"

[project.scripts]
sestudio = "sestudio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sestudio"]

# Ship the built frontend inside the wheel at sestudio/web/static so the
# installed app serves the UI with no repo checkout. Requires `npm --prefix
# frontend run build` (→ frontend/dist) to have run before `uv build`.
[tool.hatch.build.targets.wheel.force-include]
"frontend/dist" = "sestudio/web/static"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-httpx>=0.36.2",
    "ruff>=0.6.3",
]
