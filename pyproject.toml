[project]
name = "fstream-dl"
version = "0.1.0"
description = "Download episodes from fstream"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "click>=8.4.0",
    "cryptography>=48.0.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.34",
    "yt-dlp>=2026.3.17",
]

[project.scripts]
fstream-dl = "fstream_dl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fstream_dl"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-httpx>=0.36.2",
]
